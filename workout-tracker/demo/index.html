<script>
/* eslint-env browser */
'use strict';

// In-browser stand-in for the Apps Script server. demo/build.js inlines this into
// the generated page, ahead of src/App.html, where it defines window.DEMO_BACKEND
// and the single guard line in App.html's rpc() routes every call here instead of
// to google.script.run.
//
// WHAT IS REAL: the three engine files (WorkoutCore, DeloadEngine,
// SessionsMigration) are inlined verbatim before this file and are the same code
// production runs. Draft normalisation, validation, Log row building, the deload
// prescription, the dashboard status rules and the advance offer are all genuine.
//
// WHAT IS FAKED: only the ~12 functions in src/WebApp.gs that read a Sheet. Each
// is transcribed here with `ss.getSheetByName(...).getValues()` swapped for an
// in-memory array. If those functions' RESPONSE SHAPES change in WebApp.gs, this
// file must be updated by hand — that is the demo's one manual sync surface.
//
// Nothing here reaches the network. State lives in the visitor's own localStorage.

(function () {
  var SEED = window.DEMO_SEED;
  var STORAGE_KEY = 'workout-tracker-demo/v1/' + (SEED && SEED.seedHash || 'dev');

  // ── storage ────────────────────────────────────────────────────────────────

  var store = null;
  var storageWorks = true;

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function hydrate() {
    // ?reset is handled here rather than in demo/shell.js so it lands before the
    // first read, whatever order the page's scripts end up in.
    if (/[?&]reset\b/.test(window.location.search)) {
      try { window.localStorage.removeItem(STORAGE_KEY); } catch (error) {}
      try {
        window.history.replaceState(null, '', window.location.pathname + window.location.hash);
      } catch (error) {}
      return clone(SEED);
    }
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.schemaVersion === SEED.schemaVersion) return parsed;
      }
    } catch (error) { storageWorks = false; }
    return clone(SEED);
  }

  function persist() {
    if (!storageWorks) return;
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (error) { storageWorks = false; }
  }

  function resetStore() {
    try { window.localStorage.removeItem(STORAGE_KEY); } catch (error) {}
    store = clone(SEED);
  }

  store = hydrate();

  // ── errors ─────────────────────────────────────────────────────────────────

  var CODES = {
    VALIDATION_FAILED: 'VALIDATION_FAILED',
    CONFIG_MISSING: 'CONFIG_MISSING',
    STALE_REVISION: 'STALE_REVISION',
    DRAFT_CONFLICT: 'DRAFT_CONFLICT'
  };

  function demoError(code, message, retryable) {
    var error = new Error(message);
    error.demoCode = code;
    error.retryable = retryable === true;
    return error;
  }

  // ── small helpers ported from src/WebApp.gs ────────────────────────────────

  function ymd(value) {
    var text = value === null || value === undefined ? '' : String(value).trim();
    var match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!match) return '';
    return match[1] + '-' + String(match[2]).padStart(2, '0') + '-' + String(match[3]).padStart(2, '0');
  }

  function nullableNumber(value) {
    if (value === null || value === undefined || value === '') return null;
    if (typeof value === 'string' && value.trim() === '') return null;
    var number = Number(value);
    return isFinite(number) ? number : null;
  }

  function requiredNumber(value) {
    var number = nullableNumber(value);
    return number === null ? NaN : number;
  }

  function uuid(prefix) {
    return (prefix || 'demo') + '-' + Date.now().toString(36) + '-'
      + Math.random().toString(36).slice(2, 10);
  }

  function priorSetSnapshot(prior) {
    if (!prior) return null;
    return {
      date: prior.date || '', set: prior.set, type: prior.type,
      weight: prior.weight, reps: prior.reps, rir: prior.rir
    };
  }

  // ── Sheet-reader stand-ins ─────────────────────────────────────────────────

  function mesoIntervals() {
    var intervals = [];
    store.mesos.forEach(function (row) {
      var name = String(row[0]).trim();
      var start = ymd(row[1]);
      var end = ymd(row[3]);
      if (name && start && end) intervals.push({ meso: name, startDate: start, endDate: end });
    });
    return intervals;
  }

  function activeMesoOrThrow() {
    var active = resolveActiveMesoV1(store.mesos);
    if (active.status === 'matched') return active;
    throw demoError(CODES.CONFIG_MISSING, 'No active mesocycle is configured.', false);
  }

  function mesoWindow(meso) {
    return deloadMesoLogWindowV1(store.mesos, meso);
  }

  function selectProgram(sessionType, resolvedMeso) {
    return selectWorkoutProgramV1(store.programs, sessionType, resolvedMeso);
  }

  // Port of _webResolveMesoContext (src/WebApp.gs:1392).
  function resolveMesoContext(date, sessionType) {
    var resolution = resolveWorkoutMesoForDateV1(mesoIntervals(), date);
    if (resolution.status === 'matched') {
      var program = sessionType ? selectProgram(sessionType, resolution.meso) : null;
      return {
        meso: program ? program.meso : resolution.meso,
        week: resolution.week,
        startDate: resolution.matches[0].startDate,
        endDate: resolution.matches[0].endDate,
        program: program
      };
    }
    var fallback = sessionType ? selectProgram(sessionType, null) : null;
    return {
      meso: fallback ? fallback.meso : store.meso,
      week: null, startDate: null, endDate: null, program: fallback
    };
  }

  // Port of _webResolvedSessionsInMeso (src/WebApp.gs:1525).
  function resolvedSessionsInMeso(date, context) {
    var out = [];
    if (!context.startDate) return out;
    store.log.forEach(function (row) {
      var rowDate = ymd(row[0]);
      var sessionType = String(row[1]).trim();
      var week = nullableNumber(row[2]);
      if (!rowDate || !sessionType || !Number.isInteger(week) || week < 1) return;
      if (rowDate < context.startDate || rowDate > date) return;
      if (context.endDate && rowDate > context.endDate) return;
      out.push({ date: rowDate, sessionType: sessionType, week: week, resolved: true });
    });
    return out;
  }

  // Port of _webCurrentProgramWeek (src/WebApp.gs:1504).
  function currentProgramWeek(date, context) {
    var week = Number.isInteger(context.week) && context.week > 0 ? context.week : null;
    if (context.startDate) {
      store.log.forEach(function (row) {
        var rowDate = ymd(row[0]);
        var rowWeek = nullableNumber(row[2]);
        if (!rowDate || rowWeek === null || !Number.isInteger(rowWeek) || rowWeek < 1) return;
        if (rowDate < context.startDate || rowDate > date) return;
        if (context.endDate && rowDate > context.endDate) return;
        week = week === null ? rowWeek : Math.max(week, rowWeek);
      });
    }
    return week;
  }

  // Port of _webSessionWeek (src/WebApp.gs:1971).
  function sessionWeek(date, context, sessionType) {
    var programWeek = currentProgramWeek(date, context);
    if (!context.startDate || !sessionType || sessionType === 'PENDING') return programWeek;
    return resolveWorkoutSessionWeekV1(programWeek, sessionType, resolvedSessionsInMeso(date, context));
  }

  // Port of _webLatestPerformanceMap (src/WebApp.gs:1988).
  function latestPerformanceMap(sessionType) {
    var map = {};
    var wanted = String(sessionType || '').trim();
    store.log.forEach(function (row, index) {
      if ((wanted && String(row[1]).trim() !== wanted) || !row[0]) return;
      var exercise = String(row[3]).trim();
      var set = requiredNumber(row[4]);
      var type = String(row[5]).trim().toUpperCase();
      if (!exercise || !isFinite(set) || !type) return;
      if (type === 'PENDING' || type === 'SKIP') return;
      var date = ymd(row[0]);
      if (!date) return;
      var key = exercise + '|||' + set + '|||' + type;
      if (!map[key] || date > map[key].date || (date === map[key].date && index > map[key].index)) {
        map[key] = {
          date: date, index: index, set: set, type: type,
          weight: nullableNumber(row[6]), reps: nullableNumber(row[7]),
          rir: nullableNumber(row[8]), notes: String(row[9] == null ? '' : row[9])
        };
      }
    });
    return map;
  }

  // Port of _webLatestExerciseWorkoutMap (src/WebApp.gs:2019).
  function latestExerciseWorkoutMap() {
    var grouped = {};
    var latest = {};
    var map = {};
    store.log.forEach(function (row, index) {
      var date = ymd(row[0]);
      var sessionType = String(row[1]).trim();
      var week = nullableNumber(row[2]);
      var exercise = String(row[3]).trim();
      var set = requiredNumber(row[4]);
      var type = String(row[5]).trim().toUpperCase();
      if (!date || !sessionType || !exercise || !isFinite(set) || !type) return;
      if (type === 'PENDING' || type === 'SKIP') return;
      var key = exercise + '|||' + date + '|||' + sessionType + '|||' + (week === null ? '' : week);
      if (!grouped[key]) grouped[key] = { exercise: exercise, date: date, lastIndex: index, sets: [] };
      grouped[key].lastIndex = index;
      grouped[key].sets.push({
        date: date, index: index, set: set, type: type,
        weight: nullableNumber(row[6]), reps: nullableNumber(row[7]),
        rir: nullableNumber(row[8]), notes: String(row[9] == null ? '' : row[9])
      });
    });
    Object.keys(grouped).forEach(function (key) {
      var workout = grouped[key];
      var current = latest[workout.exercise];
      if (!current || workout.date > current.date
          || (workout.date === current.date && workout.lastIndex > current.lastIndex)) {
        latest[workout.exercise] = workout;
      }
    });
    Object.keys(latest).forEach(function (exercise) {
      latest[exercise].sets.forEach(function (prior) {
        var key = exercise + '|||' + prior.set + '|||' + prior.type;
        if (!map[key] || prior.index > map[key].index) map[key] = prior;
      });
    });
    return map;
  }

  function attachPrevious(draft, performance) {
    (draft.exercises || []).forEach(function (exercise) {
      (exercise.sets || []).forEach(function (set) {
        set.previous = priorSetSnapshot(performance[exercise.name + '|||' + set.set + '|||' + set.type]);
      });
    });
    return draft;
  }

  function completionBestLiftMap() {
    var best = {};
    store.log.forEach(function (row, index) {
      if (String(row[5] || '').trim().toUpperCase() !== 'W') return;
      var exercise = String(row[3] || '').trim();
      var weight = nullableNumber(row[6]);
      var reps = nullableNumber(row[7]);
      if (!exercise || weight === null || reps === null) return;
      var current = best[exercise];
      if (!current || weight > current.weight
          || (weight === current.weight && reps > current.reps)
          || (weight === current.weight && reps === current.reps && index > current.index)) {
        best[exercise] = { weight: weight, reps: reps, index: index };
      }
    });
    Object.keys(best).forEach(function (exercise) { delete best[exercise].index; });
    return best;
  }

  function completionContext(draft) {
    var context = resolveMesoContext(draft.date, draft.sessionType || '');
    var maxSets = {};
    if (draft.week != null && context.startDate && context.endDate) {
      store.log.forEach(function (row) {
        var date = ymd(row[0]);
        if (!date || date < context.startDate || date > context.endDate
            || nullableNumber(row[2]) !== Number(draft.week)) return;
        var type = String(row[5] || '').trim().toUpperCase();
        if (type === 'WU' || type === 'PENDING' || type === 'SKIP') return;
        var session = String(row[1] || '').trim();
        var exercise = String(row[3] || '').trim();

  // Port of _webCardioWeekSummary (src/WebApp.gs:1322).
  function cardioWeekSummary(date) {
    var selected = _workoutCoreYmdOrdinal(date);
    var summary = { sessions: 0, minutes: 0, distanceKm: 0, moderateSessions: 0, hiitSessions: 0 };
    if (selected === null) return summary;
    var parts = date.split('-');
    var asDate = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0, 0);
    var start = selected - ((asDate.getDay() + 6) % 7);
    store.cardioLog.forEach(function (row) {
      var rowDate = _workoutCoreYmdOrdinal(ymd(row[0]));
      var type = String(row[4] == null ? '' : row[4]).trim().toUpperCase();
      if (rowDate === null || rowDate < start || rowDate > start + 6) return;
      if (CARDIO_TYPES.indexOf(type) < 0) return;
      summary.sessions += 1;
      summary.minutes += nullableNumber(row[3]) || 0;
      summary.distanceKm += nullableNumber(row[2]) || 0;
      if (type === 'MISS') summary.moderateSessions += 1;
      if (type === 'HIIT') summary.hiitSessions += 1;
    });
    summary.minutes = Math.round(summary.minutes * 100) / 100;
    summary.distanceKm = Math.round(summary.distanceKm * 100) / 100;
    return summary;
  }

      var closure = resolveMesoClosureV1({

        currentStatus: 'Active', currentEndDate: '', confirmed: confirmed
      });
      if (closure.shouldClose) {
        store.mesos[active.rowIndex][3] = closure.endDate;
        store.mesos[active.rowIndex][4] = 'Closed';
        persist();
        return {
          applied: true, reason: 'meso_closed', meso: active.meso,
          endDate: closure.endDate, currentWeek: active.currentWeek, recordedSkipped: 0
        };
      }
      return {
        applied: false, reason: closure.reason,
        outstanding: view.advance.outstanding || [], currentWeek: active.currentWeek
      };
    },

    webStartCardio: function (input) {
      var previous = cardioPreviousMap();
      if (store.cardioState.active) {
        return { draft: attachCardioPrevious(store.cardioState.draft, previous) };
      }
      var draft = normalizeCardioDraftV1({
        schemaVersion: 1,
        draftId: uuid('cardio'),
        revision: 0,
        date: ymd(input.date) || store.today,
        activity: store.cardioLib.defaultActivity,
        type: 'MISS',
        durationMinutes: null, distanceKm: null, rpe: null, notes: ''
      });
      store.cardioState = { active: true, draftId: draft.draftId, revision: 0, draft: draft };
      persist();
      return { draft: attachCardioPrevious(draft, previous) };
    },

    webCheckpointCardioDraft: function (input) {
      requireRevision(store.cardioState, input.expectedRevision);
      var draft = normalizeCardioDraftV1(input.draft);
      store.cardioState = {
        active: true, draftId: draft.draftId,
        revision: store.cardioState.revision + 1, draft: draft
      };
      persist();
      return {
        draftId: draft.draftId,
        revision: store.cardioState.revision,
        checkpointedAt: new Date().toISOString()
      };
    },

    webDiscardCardioDraft: function (input) {
      var draftId = store.cardioState.draftId;
      store.cardioState = { active: false, draftId: null, revision: 0, draft: null };
      persist();
      return {
        discarded: true, draftId: draftId,
        revision: Number(input.expectedRevision || 0) + 1
      };
    },

    webCompleteCardio: function (input) {
      var draft = normalizeCardioDraftV1(input.draft);
      var row;
      try {
        row = buildCardioLogRowV1(draft, new Date());
      } catch (error) {
        throw demoError(CODES.VALIDATION_FAILED, 'Please check the highlighted Cardio details.', false);
      }
      store.cardioLog.push(row);
      store.cardioState = { active: false, draftId: null, revision: 0, draft: null };
      persist();
      return {
        kind: 'cardio',
        submissionId: String(input.submissionId || uuid('submission')),
        sessionId: draft.draftId,
        revision: Number(input.expectedRevision || 0) + 1,
        completedAt: new Date().toISOString(),
        cardioRowsWritten: 1,
        activity: draft.activity, type: draft.type, date: draft.date,
        durationMinutes: draft.durationMinutes, distanceKm: draft.distanceKm, rpe: draft.rpe
      };
    }
  };

  function attachCardioPrevious(draft, previousMap) {
    var copy = normalizeCardioDraftV1(draft);
    copy.previous = previousMap[copy.activity + '|||' + copy.type] || null;
    return copy;
  }

  // ── dispatch ───────────────────────────────────────────────────────────────

  window.DEMO_BACKEND = function (name, payload) {
    var input = payload || {};
    var requestId = input.clientRequestId || '';
    return new Promise(function (resolve, reject) {
      // One task boundary, no artificial delay: App.html renders its loading and
      // saving states synchronously before awaiting, and they need a paint.
      window.setTimeout(function () {
        var handler = HANDLERS[name];
        if (!handler) {
          reject({
            code: 'CONFIG_MISSING', requestId: requestId, retryable: false,
            message: 'The demo does not implement ' + name + '.'
          });
          return;
        }
        try {
          resolve({ ok: true, data: handler(input), requestId: requestId });
        } catch (error) {
          reject({
            code: error && error.demoCode ? error.demoCode : 'WRITE_FAILED',
            message: error && error.message ? error.message : 'The demo hit an unexpected error.',
            retryable: !!(error && error.retryable),
            requestId: requestId
          });
        }
      }, 0);
    });
  };

  // Consumed by demo/shell.js for the reset control.
  window.DEMO_CONTROL = {
    reset: function () { resetStore(); },
    storageKey: STORAGE_KEY,
    storageWorks: function () { return storageWorks; }
  };
}());

<script>
/* eslint-env browser */
'use strict';

// Demo-only chrome that lives entirely outside the app: a corner pill explaining
// what this is and offering a reset. Nothing here touches src/App.html — it
// appends its own nodes to <body> and reads window.DEMO_CONTROL from the mock.

(function () {
  var PILL_ID = 'demo-pill';
  var TOUR_RESUME_KEY = 'workout-tracker-demo/tour-after-reset';
  var AUTO_TOUR_KEY = 'workout-tracker-demo/tour-seen-v1';
  var AUTO_TOUR_DELAY_MS = 2000;
  var tour = null;
  var tourObserver = null;

  function targets(name) {
    return Array.prototype.slice.call(document.querySelectorAll('[data-tour="' + name + '"]'));
  }

  function target(name) {
    return document.querySelector('[data-tour="' + name + '"]');
  }

  function startWorkoutTarget() {
    // The demo only exposes resistance sessions here; still skip the special
    // Pending or already-completed row if the seed changes in the future.
    return targets('start-workout').find(function (button) {
      return button.dataset.sessionType && button.dataset.sessionType !== 'PENDING'
        && button.dataset.tourState !== 'completed';
    }) || null;
  }

  function swapStepTarget() {
    return target('confirm-exercise-swap') || target('swap-option');
  }

  function nextExerciseTarget() {
    return targets('exercise-tab').find(function (button) {
      return button.getAttribute('aria-selected') !== 'true';
    }) || target('exercise-tab');
  }

  function adaptTarget() {
    return swapStepTarget() || target('swap-exercise');
  }

  function allVisibleSetsCompleted() {
    var checkboxes = targets('set-complete');
    return checkboxes.length > 0 && checkboxes.every(function (checkbox) { return checkbox.checked; });
  }

  function completionTarget() {
    return target('training-distribution') || target('confirm-complete') || target('complete-workout');
  }

  function waitForTarget(name, callback) {
    var found = target(name);
    if (found) { callback(found); return; }
    var observer = new MutationObserver(function () {
      var match = target(name);
      if (!match) return;
      observer.disconnect();
      callback(match);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  function waitForDriver(callback) {
    var attempts = 0;
    (function check() {
      if (window.driver && window.driver.js && window.driver.js.driver) {
        callback();
        return;
      }
      attempts += 1;
      if (attempts < 60) window.setTimeout(check, 50);
    }());
  }

  function updateFinalPopover() {
    var popover = document.querySelector('.driver-popover.workout-demo-tour');
    if (!popover) return;
    var title = popover.querySelector('.driver-popover-title');
    var description = popover.querySelector('.driver-popover-description');
    var next = popover.querySelector('.driver-popover-next-btn');
    if (target('training-distribution')) {
      if (title) title.textContent = 'See what you trained';
      if (description) {
        description.textContent = 'Your completed sets feed into your training distribution, showing how much work each muscle group received this session.';
      }
      if (next) {
        next.style.display = '';
        next.textContent = 'Done';
      }
      return;
    }
    if (title) title.textContent = target('confirm-complete') ? 'Ready to save?' : 'Explore the workout';
    if (description) {
      description.textContent = target('confirm-complete')
        ? 'The confirmation is ready if you decide to save your workout. Otherwise, you can finish the tour and keep browsing.'
        : 'Feel free to explore—check out History, add a note, or log more exercises. Choose Finish tour when you’re done.';
    }
    if (next) {
      next.style.display = '';
      next.textContent = 'Finish tour';
    }
  }

  function updateSwapPopover() {
    var popover = document.querySelector('.driver-popover.workout-demo-tour');
    if (!popover) return;
    var title = popover.querySelector('.driver-popover-title');
    var description = popover.querySelector('.driver-popover-description');
    if (target('confirm-exercise-swap')) {
      if (title) title.textContent = 'Adapt the plan';
      if (description) description.textContent = 'Review the replacement, then select Swap exercise to keep the session moving.';
      return;
    }
    if (!target('swap-option')) {
      if (title) title.textContent = 'Adapt the plan';
      if (description) description.textContent = 'Need an alternative? Select Swap to keep the session flexible.';
      return;
    }
    if (title) title.textContent = 'Adapt the plan';
    if (description) description.textContent = 'Choose an alternative to see how the plan can flex without abandoning the workout.';
  }

  function observeTourState() {
    if (tourObserver) tourObserver.disconnect();
    var app = document.getElementById('app');
    if (!app) return;
    tourObserver = new MutationObserver(function () {
      if (!tour || !tour.isActive()) return;
      var index = tour.getActiveIndex();
      // Completing a set redraws the logger and removes Driver's temporary
      // active-element class with the old DOM. Re-enter this step so Driver
      // resolves the generated data-tour anchor again and all remaining sets
      // stay interactive.
      if (index === 1 && target('set-logger')) {
        window.setTimeout(function () {
          if (tour && tour.isActive() && tour.getActiveIndex() === 1) tour.moveTo(1);
        }, 0);
      }
      if (index === 4 && completionTarget()) {
        window.setTimeout(function () {
          if (tour && tour.isActive() && tour.getActiveIndex() === 4) {
            tour.moveTo(4);
            updateFinalPopover();
          }
        }, 0);
      }
    });
    tourObserver.observe(app, { childList: true, subtree: true });
  }

  function stopTour() {
    if (tourObserver) {
      tourObserver.disconnect();
      tourObserver = null;
    }
    tour = null;
  }

  function finishTour() {
    if (tour) tour.destroy();
  }

  function moveWhenReady(name, index) {
    waitForTarget(name, function () {
      if (!tour || !tour.isActive()) return;
      tour.moveTo(index);
      if (index === 3) updateSwapPopover();
      if (index === 4) updateFinalPopover();
    });
  }

  function moveAfterAction(name, index) {
    window.setTimeout(function () { moveWhenReady(name, index); }, 0);
  }

  // Product-led transitions: a real app action is the only way forward.
  // Each target is a generated data-tour anchor, never a visual selector.
  document.addEventListener('click', function (event) {
    if (!tour || !tour.isActive()) return;
    var control = event.target && event.target.closest && event.target.closest(
      '[data-tour]'
    );
    if (!control) return;
    var index = tour.getActiveIndex();
    var name = control.getAttribute('data-tour');
    if (index === 0 && name === 'start-workout') moveAfterAction('set-logger', 1);
    if (index === 1 && name === 'set-complete') {
      window.setTimeout(function () {
        if (tour && tour.isActive() && tour.getActiveIndex() === 1 && allVisibleSetsCompleted()) {
          moveAfterAction('exercise-tab', 2);
        }
      }, 0);
    }
    if (index === 2 && name === 'exercise-tab') moveAfterAction('swap-exercise', 3);
    if (index === 3 && name === 'swap-exercise') moveAfterAction('swap-option', 3);
    if (index === 3 && name === 'swap-option') moveAfterAction('confirm-exercise-swap', 3);
    if (index === 3 && name === 'confirm-exercise-swap') moveAfterAction('complete-workout', 4);
    if (index === 4 && name === 'complete-workout') moveAfterAction('confirm-complete', 4);
    if (index === 4 && name === 'confirm-complete') moveAfterAction('training-distribution', 4);
  });

  function beginTour() {
    if (!window.driver || !window.driver.js || !window.driver.js.driver) return false;
    if (!startWorkoutTarget()) return false;
    if (tour && tour.isActive()) tour.destroy();

    tour = window.driver.js.driver({
      animate: true,
      duration: 180,
      allowClose: true,
      allowScroll: true,
      overlayColor: '#10251a',
      overlayOpacity: 0.56,
      smoothScroll: true,
      stagePadding: 7,
      stageRadius: 12,
      disableActiveInteraction: false,
      showProgress: true,
      progressText: '{{current}} of {{total}}',
      showButtons: ['next', 'close'],
      popoverClass: 'workout-demo-tour',
      onDoneClick: finishTour,
      onHighlighted: function () {
        if (!tour) return;
        var index = tour.getActiveIndex();
        if (index !== 4) {
          var popover = document.querySelector('.driver-popover.workout-demo-tour');
          var next = popover && popover.querySelector('.driver-popover-next-btn');
          if (next) next.style.display = 'none';
        }
        if (index === 3) window.setTimeout(updateSwapPopover, 0);
        if (index === 4) window.setTimeout(updateFinalPopover, 0);
      },
      onDestroyed: stopTour,
      steps: [
        {
          element: startWorkoutTarget,
          waitForElement: 3000,
          popover: {
            title: 'Start a workout',
            description: 'Choose this resistance-training workout to begin.',
            side: 'bottom', align: 'start'
          }
        },
        {
          element: function () { return target('set-logger'); },
          waitForElement: 3000,
          popover: {
            title: 'Log your training',
            description: 'Adjust the weight or reps as needed, then tick the sets to continue.',
            side: 'bottom', align: 'center'
          }
        },
        {
          element: nextExerciseTarget,
          popover: {
            title: 'Move through your workout',
            description: 'Select another exercise to move through your session.',
            side: 'bottom', align: 'center'
          }
        },
        {
          element: adaptTarget,
          waitForElement: 3000,
          popover: {
            title: 'Adapt the plan',
            description: 'Choose an alternative to see how the plan can flex without abandoning the workout.',
            side: 'bottom', align: 'center'
          }
        },
        {
          element: completionTarget,
          waitForElement: 3000,
          popover: {
            title: 'Explore the workout',
            description: 'Feel free to explore—check out History, add a note, or log more exercises. Choose Finish tour when you’re done.',
            side: 'top', align: 'center'
          }
        }
      ]
    });
    observeTourState();
    tour.drive();
    return true;
  }

  function startTour() {
    // Tours always begin from known seed state. Starting one resets only
    // browser-local demo data, never the live app.
    try { window.sessionStorage.setItem(TOUR_RESUME_KEY, '1'); } catch (error) {}
    if (window.DEMO_CONTROL) window.DEMO_CONTROL.reset();
    window.location.reload();
  }

  function build() {
    if (document.getElementById(PILL_ID)) return;

    var pill = document.createElement('div');
    pill.id = PILL_ID;
    pill.className = 'demo-pill';

    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'demo-pill-toggle';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.textContent = 'demo';

    var panel = document.createElement('div');
    panel.className = 'demo-pill-panel';
    panel.hidden = true;

    var copy = document.createElement('p');
    copy.textContent = window.DEMO_CONTROL && window.DEMO_CONTROL.storageWorks()
      ? 'A live demo of a personal workout tracker. Everything you log is kept in '
        + 'this browser only — nothing is sent anywhere.'
      : 'A live demo of a personal workout tracker. Your browser is blocking site '
        + 'storage, so anything you log resets when you reload.';

    var reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'demo-pill-reset';
    reset.textContent = 'Reset demo';
    reset.addEventListener('click', function () {
      if (window.DEMO_CONTROL) window.DEMO_CONTROL.reset();
      window.location.reload();
    });

    var startTourButton = document.createElement('button');
    startTourButton.type = 'button';
    startTourButton.className = 'demo-pill-tour';
    startTourButton.textContent = 'Take the quick tour';
    startTourButton.addEventListener('click', function () {
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      startTour();
    });

    panel.appendChild(copy);
    panel.appendChild(startTourButton);
    panel.appendChild(reset);

    toggle.addEventListener('click', function () {
      var open = panel.hidden;
      panel.hidden = !open;
      toggle.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', function (event) {
      if (pill.contains(event.target) || panel.hidden) return;
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
    });

    pill.appendChild(toggle);
    pill.appendChild(panel);
    document.body.appendChild(pill);
  }

  // Insurance against a future App.html emitting another Sheets link the three
  // demo guards don't cover: an <a href=""> reloads the page when clicked.
  document.addEventListener('click', function (event) {
    var anchor = event.target && event.target.closest && event.target.closest('a');
    if (!anchor) return;
    var href = anchor.getAttribute('href');
    if (href === '' || href === null || href.indexOf('https://docs.google.com') === 0) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  function buildAndResumeTour() {
    build();
    try {
      if (window.sessionStorage.getItem(TOUR_RESUME_KEY) === '1') {
        window.sessionStorage.removeItem(TOUR_RESUME_KEY);
        waitForTarget('start-workout', function () { waitForDriver(beginTour); });
        return;
      }
    } catch (error) {}

    // This explicit URL is useful for portfolio review and QA: it restarts the
    // optional tour even after a browser has recorded its first visit.
    if (/(?:^|&)tour=1(?:&|$)/.test(window.location.search.slice(1))) {
      window.setTimeout(startTour, AUTO_TOUR_DELAY_MS);
      return;
    }

    // New visitors get the guided path immediately. Driver's close button is
    // always available, so this remains an invitation rather than a gate; the
    // persistent marker prevents it restarting on later visits or reloads.
    try {
      if (window.localStorage.getItem(AUTO_TOUR_KEY) === '1') return;
      window.localStorage.setItem(AUTO_TOUR_KEY, '1');
      if (window.localStorage.getItem(AUTO_TOUR_KEY) === '1') {
        window.setTimeout(startTour, AUTO_TOUR_DELAY_MS);
      }
    } catch (error) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildAndResumeTour);
  } else {
    buildAndResumeTour();
  }
}());

<script>
  (function () {
    'use strict';

    const APP = document.getElementById('app');
    const CHECKPOINT_DELAY = 850;
    const CHECKPOINT_RETRY_LIMIT = 3;
    const CHECKPOINT_RETRY_BASE_DELAY = 1200;
    const MAX_SET_ROWS = 194;
    const PENDING_SESSION_TYPE = 'PENDING';
    const DELETE_SWIPE_WIDTH = 78;
    const DELETE_SWIPE_THRESHOLD = 28;
    const SET_TYPES = ['W', 'D', 'WU', 'RP', 'PENDING', 'SKIP'];
    const SET_TYPE_OPTIONS = [
      { value: 'W', label: 'Standard set', display: '1', description: 'A regular working set using your planned weight, reps and RIR.' },
      { value: 'WU', label: 'Warm-up set', display: 'WU', description: 'A lighter preparation set before your working sets. It helps you get ready and does not count toward training volume.' },
      { value: 'D', label: 'Drop set', display: 'D', description: 'Continue the set after reducing the weight, with little or no rest.' },
      { value: 'RP', label: 'Rest-pause set', display: 'RP', description: 'Take a very short rest during a hard set, then continue for more reps with the same weight.' },
      { value: 'PENDING', label: 'Pending', display: 'P', description: 'Use this when you want to do the exercise later this week. It removes the set from this session and makes it available as a Pending exercise.' },
      { value: 'SKIP', label: 'Skip', display: 'S', description: 'Use this when you will not complete the exercise this week. It records the set as skipped.' }
    ];
    const state = {
      bootstrap: null,
      draft: null,
      cardioDraft: null,
      focusedId: null,
      status: null,
      loading: true,
      saving: false,
      completing: false,
      saved: null,
      completionContext: null,
      completionView: 'session',
      history: null,
      historyLoading: false,
      swap: null,
      swapLoading: false,
      swapRequestId: 0,
      addExercise: null,
      addExerciseLoading: false,
      addExerciseRequestId: 0,
      exerciseCueSaving: false,
      exerciseCueRequestId: 0,
      checkpointTimer: null,
      checkpointRunning: false,
      checkpointRetryCount: 0,
      checkpointBlocked: false,
      dirty: false,
      workoutEdited: false,
      sessionSwitching: false,
      dashboardLoading: false,
      dashboardAdvancing: false,
      dashboardAdvanceConfirm: false,
      dashboardVisible: false,
      // Display-only deload prescription context from webLoadSession. Never
      // persisted, never part of the draft: Log already records what was done.
      deload: null,
      editEpoch: 0,
      setupWeekTouched: false,
      setupDefaultsRequest: 0,
      submissionId: null,
      sheetHandoff: false,
      previousBySetId: {},
      exerciseCueBaselines: {},
      sheetUrl: window.WEB_APP_SHEET_URL || ''
    };
    let setSwipe = null;

    function clientRequestId(prefix) {
      return (prefix || 'web') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c];
      });
    }

    function attr(value) { return escapeHtml(value); }
    function text(value) { return escapeHtml(value); }
    function selected(value, expected) { return String(value) === String(expected) ? ' selected' : ''; }
    function checked(value) { return value ? ' checked' : ''; }
    function isBlank(value) { return value === null || value === undefined || value === ''; }
    function numericValue(value) { return isBlank(value) ? '' : String(value); }
    function uuid(prefix) { return (prefix || 'id') + '-' + clientRequestId(''); }

    function isAssistedExercise(exercise) {
      return /assisted/i.test(String(exercise && exercise.name || ''));
    }

    function canonicalWeight(exercise, value) {
      if (isBlank(value)) return null;
      const weight = Number(value);
      if (!isAssistedExercise(exercise)) return weight;
      return weight === 0 ? 0 : -Math.abs(weight);
    }

    function normalisedWeight(exercise, value) {
      return isAssistedExercise(exercise) ? canonicalWeight(exercise, value) : value;
    }

    function displayedWeight(exercise, value) {
      if (isBlank(value)) return '';
      const weight = Number(value);
      return isAssistedExercise(exercise) ? String(Math.abs(weight)) : String(weight);
    }

    function todayIso() {
      const now = new Date();
      const timezoneOffset = now.getTimezoneOffset() * 60000;
      return new Date(now - timezoneOffset).toISOString().slice(0, 10);
    }

    function setStatus(kind, message, code) {
      state.status = message ? { kind: kind || 'info', message: message, code: code || '' } : null;
    }

    function swapUnavailableReason() {
      if (state.exerciseCueSaving) return 'Swap is paused while the exercise cue is being saved.';
      if (state.checkpointBlocked) return 'Swap is paused because background saving is blocked. Use Complete to retry the safe save first, or continue in Today.';
      if (state.completing || state.saved) return 'Swap is unavailable because this workout is being completed or has already been saved.';
      if (state.sheetHandoff) return 'Swap is unavailable while the app is handing this workout over to Google Sheets.';
      if (state.sessionSwitching) return 'Swap is unavailable while the workout session is changing.';
      if (state.draft && state.draft.pendingBatch) return 'Swap is unavailable in a pending batch so the original pending item remains linked.';
      return '';
    }

    function draftMutationUnavailableReason(label) {
      const name = label || 'This change';
      if (state.exerciseCueSaving) return name + ' is paused while the exercise cue is being saved.';
      if (state.checkpointBlocked) return name + ' is paused because background saving is blocked. Use Complete to retry the safe save first, or continue in Today.';
      if (state.completing || state.saved) return name + ' is unavailable because this workout is being completed or has already been saved.';
      if (state.sheetHandoff) return name + ' is unavailable while the app is handing this workout over to Google Sheets.';
      if (state.sessionSwitching) return name + ' is unavailable while the workout session is changing.';
      return '';
    }

    function skipWorkoutUnavailableReason() {
      const unavailable = draftMutationUnavailableReason('Skip workout');
      if (unavailable) return unavailable;
      if (state.checkpointRunning) return 'Skip workout is paused while the latest draft save is finishing.';
      if (!state.draft || !state.draft.exercises.length || !allSetCount()) return 'Skip workout needs a loaded workout plan.';
      if (state.draft.pendingBatch) return 'Skip workout is unavailable for a pending batch.';
      return '';
    }

    function rpc(name, payload) {
      // The single seam the standalone demo build hangs off: demo/build.js pastes
      // this file verbatim into a page that defines window.DEMO_BACKEND, so every
      // call is served in-browser instead of by Apps Script. Never set in the
      // deployed web app, where this is undefined and the Google path below runs.
      if (window.DEMO_BACKEND) return window.DEMO_BACKEND(name, payload);
      return new Promise(function (resolve, reject) {
        if (!(window.google && google.script && google.script.run)) {
          reject({ code: 'LOCAL_UNAVAILABLE', message: 'Google Apps Script is unavailable. Open this from the deployed web app.', retryable: false });
          return;
        }
        google.script.run
          .withSuccessHandler(function (envelope) {
            if (envelope && envelope.ok) { resolve(envelope); return; }
            const error = (envelope && envelope.error) || { code: 'UNKNOWN_RESPONSE', message: 'The tracker returned an unexpected response.', retryable: true };
            error.requestId = envelope && envelope.requestId || payload && payload.clientRequestId || '';
            reject(error);
          })
          .withFailureHandler(function (failure) {
            const raw = failure && failure.message ? failure.message : String(failure || 'Unexpected connection failure.');
            reject({ code: 'TRANSPORT_ERROR', message: raw, retryable: true, requestId: payload && payload.clientRequestId || '' });
          })[name](payload);
      });
    }

    function withErrorReference(message, error) {
      const parts = [];
      if (error && error.code) parts.push(error.code);
      if (error && error.requestId) parts.push(error.requestId);
      return message + (parts.length ? ' Reference: ' + parts.join(' · ') + '.' : '');
    }

    function asErrorMessage(error, action) {
      const name = action || 'save';
      const code = error && error.code;
      if (code === 'STALE_REVISION' || code === 'DRAFT_CONFLICT') {
        return withErrorReference('This workout changed elsewhere. Your entries are still here; open Google Sheets to compare it before retrying.', error);
      }
      if (code === 'SAVE_IN_PROGRESS') return withErrorReference('Another save is finishing. Your workout is still on this screen; please try again in a moment.', error);
      if (code === 'IDEMPOTENCY_CONFLICT') return withErrorReference('This completion request was already used for a different workout. Your entries remain intact.', error);
      if (code === 'WRITE_RECOVERY_CONFLICT') return withErrorReference('The tracker could not verify a previous write safely. Your workout remains here; open Google Sheets before retrying.', error);
      if (code === 'VALIDATION_FAILED') return withErrorReference((error.message || 'Please check the highlighted workout details before ' + name + '.') + ' Your entries have not been cleared.', error);
      return withErrorReference((error && error.message ? error.message : 'Could not ' + name + '.') + ' Your entries are still here.', error);
    }

    function normaliseDraft(draft) {
      const next = Object.assign({
        schemaVersion: 1,
        draftId: uuid('draft'),
        revision: 0,
        meso: state.bootstrap && state.bootstrap.activeMeso || '',
        sessionType: '',
        pendingBatch: false,
        intentionalSkip: false,
        date: state.bootstrap && state.bootstrap.defaultDate || todayIso(),
        week: state.bootstrap && state.bootstrap.defaultWeek != null ? state.bootstrap.defaultWeek : null,
        gymLocation: '',
        energy: null,
        sessionNotes: '',
        focusedExerciseId: null,
        exercises: []
      }, draft || {});
      next.exercises = Array.isArray(next.exercises) ? next.exercises.map(function (exercise, exerciseIndex) {
        const copy = Object.assign({ id: uuid('exercise-' + exerciseIndex), order: exerciseIndex + 1, name: '', cue: '', note: '', primaryMuscle: '', sets: [] }, exercise || {});
        copy.sets = Array.isArray(copy.sets) ? copy.sets.map(function (set, setIndex) {
          const nextSet = Object.assign({ id: uuid('set-' + setIndex), order: (exerciseIndex * 1000) + setIndex, set: setIndex + 1, type: 'W', weight: null, reps: null, rir: null, notes: '', completed: false }, set || {});
          nextSet.weight = normalisedWeight(copy, nextSet.weight);
          return nextSet;
        }) : [];
        return copy;
      }) : [];
      return next;
    }

    function newDraft(sessionType) {
      return normaliseDraft({
        sessionType: sessionType,
        date: state.bootstrap.defaultDate || todayIso(),
        week: state.bootstrap.defaultWeek == null ? null : state.bootstrap.defaultWeek,
        meso: state.bootstrap.activeMeso || '',
        gymLocation: '',
        energy: null,
        sessionNotes: '',
        exercises: []
      });
    }

    function normaliseCardioDraft(draft) {
      const next = Object.assign({
        schemaVersion: 1,
        draftId: uuid('cardio'),
        revision: 0,
        date: state.bootstrap && state.bootstrap.defaultDate || todayIso(),
        activity: state.bootstrap && state.bootstrap.cardioLibrary && state.bootstrap.cardioLibrary.defaultActivity || '',
        type: 'MISS',
        durationMinutes: null,
        distanceKm: null,
        rpe: null,
        notes: '',
        previous: null
      }, draft || {});
      next.type = next.type === 'HIIT' ? 'HIIT' : 'MISS';
      return next;
    }

    function activeDraft() {
      return state.cardioDraft || state.draft;
    }

    function snapshotActiveDraft() {
      const draft = activeDraft();
      return draft ? JSON.parse(JSON.stringify(draft)) : null;
    }

    function captureLoadedExerciseState(draft, includePrevious) {
      state.previousBySetId = {};
      state.exerciseCueBaselines = {};
      (draft && draft.exercises || []).forEach(function (exercise) {
        state.exerciseCueBaselines[exercise.id] = String(exercise.cue || '').trim();
        (exercise.sets || []).forEach(function (set) {
          if (!includePrevious) return;
          const prior = set.previous && typeof set.previous === 'object' ? set.previous : null;
          state.previousBySetId[set.id] = prior ? {
            weight: prior.weight,
            reps: prior.reps,
            rir: prior.rir,
            type: prior.type
          } : null;
        });
      });
    }

    function reindexSetOrders(draft) {
      let order = 0;
      (draft && draft.exercises || []).slice().sort(function (a, b) {
        return a.order - b.order;
      }).forEach(function (exercise) {
        (exercise.sets || []).forEach(function (set) { set.order = order++; });
      });
    }

    function appendStandardSet(draft, exercise) {
      const total = (draft && draft.exercises || []).reduce(function (count, item) {
        return count + (item.sets || []).length;
      }, 0);
      if (!draft || !exercise || total >= MAX_SET_ROWS) return null;
      const workingSets = exercise.sets.filter(function (set) { return set.type === 'W'; });
      const source = workingSets.length ? workingSets[workingSets.length - 1] : exercise.sets[exercise.sets.length - 1];
      const nextSetNumber = workingSets.reduce(function (max, set) {
        return Number.isFinite(Number(set.set)) ? Math.max(max, Number(set.set)) : max;
      }, 0) + 1;
      const newSet = {
        id: uuid(exercise.id + '-set'),
        order: total,
        set: nextSetNumber,
        type: 'W',
        weight: source && !isBlank(source.weight) ? source.weight : null,
        reps: source && !isBlank(source.reps) ? source.reps : null,
        rir: source && !isBlank(source.rir) ? source.rir : null,
        notes: '',
        completed: false
      };
      exercise.sets.push(newSet);
      reindexSetOrders(draft);
      return newSet;
    }

    function removeSetFromExercise(draft, exercise, setId) {
      if (!draft || !exercise || !Array.isArray(exercise.sets) || exercise.sets.length <= 1) return null;
      const index = exercise.sets.findIndex(function (set) { return set.id === setId; });
      if (index < 0) return null;
      const removed = exercise.sets.splice(index, 1)[0];
      reindexSetOrders(draft);
      return removed;
    }

    function appendExerciseFromOption(draft, option) {
      if (!draft || !Array.isArray(draft.exercises) || !option || !option.name) return null;
      if (draft.exercises.some(function (exercise) { return exercise.name === option.name; })) return null;
      const currentSetCount = draft.exercises.reduce(function (count, exercise) {
        return count + (exercise.sets || []).length;
      }, 0);
      const priorSets = Array.isArray(option.latestSets) && option.latestSets.length
        ? option.latestSets
        : [{ set: 1, type: 'W', weight: null, reps: null, rir: null }];
      if (currentSetCount + priorSets.length > MAX_SET_ROWS) return null;
      const exerciseId = uuid('exercise');
      const nextOrder = draft.exercises.reduce(function (max, exercise) {
        return Math.max(max, Number.isFinite(Number(exercise.order)) ? Number(exercise.order) : 0);
      }, -1) + 1;
      const exercise = {
        id: exerciseId,
        order: nextOrder,
        name: option.name,
        cue: option.cue || '',
        note: '',
        primaryMuscle: option.primaryMuscle || '',
        sets: priorSets.map(function (prior, index) {
          return {
            id: uuid(exerciseId + '-set'),
            order: currentSetCount + index,
            set: Number.isFinite(Number(prior.set)) ? Number(prior.set) : index + 1,
            type: SET_TYPES.indexOf(String(prior.type || 'W')) >= 0 ? String(prior.type || 'W') : 'W',
            weight: normalisedWeight({ name: option.name }, isBlank(prior.weight) ? null : prior.weight),
            reps: isBlank(prior.reps) ? null : prior.reps,
            rir: isBlank(prior.rir) ? null : prior.rir,
            notes: '',
            completed: false
          };
        })
      };
      draft.exercises.push(exercise);
      reindexSetOrders(draft);
      return exercise;
    }

    function setTypeDisplay(set) {
      if (!set || set.type === 'W') return set && !isBlank(set.set) ? String(set.set) : '—';
      const option = SET_TYPE_OPTIONS.find(function (item) { return item.value === set.type; });
      return option ? option.display : String(set.type || '—').slice(0, 2);
    }

    function previousSetHtml(set) {
      const prior = state.previousBySetId[set.id];
      if (!prior) return '<span class="previous-empty">—</span>';
      const load = isBlank(prior.weight) ? '— kg' : text(prior.weight) + ' kg';
      const reps = isBlank(prior.reps) ? '—' : text(prior.reps);
      const rir = isBlank(prior.rir) ? '' : '<small>' + text(prior.rir) + ' RIR</small>';
      return '<span><span class="previous-main">' + load + ' x ' + reps + '</span>' + rir + '</span>';
    }

    function getFocusedExercise() {
      if (!state.draft || !state.draft.exercises.length) return null;
      return state.draft.exercises.find(function (exercise) { return exercise.id === state.focusedId; }) || state.draft.exercises[0];
    }

    function completeCount(exercise) { return exercise.sets.filter(function (set) { return set.completed; }).length; }
    function allSetCount() { return state.draft ? state.draft.exercises.reduce(function (n, exercise) { return n + exercise.sets.length; }, 0) : 0; }
    function completedSetCount() { return state.draft ? state.draft.exercises.reduce(function (n, exercise) { return n + completeCount(exercise); }, 0) : 0; }
    function saveableSetCount() {
      return state.draft ? state.draft.exercises.reduce(function (n, exercise) {
        return n + exercise.sets.filter(function (set) {
          return set.completed || set.type === 'PENDING' || set.type === 'SKIP';
        }).length;
      }, 0) : 0;
    }

    function completionRound(value) { return Math.round(Number(value || 0) * 10) / 10; }

    function completionExerciseSetMax(draft) {
      const byExercise = {};
      (draft && draft.exercises || []).forEach(function (exercise) {
        let max = 0;
        (exercise.sets || []).forEach(function (set) {
          if (set.completed !== true || ['WU', 'PENDING', 'SKIP'].indexOf(String(set.type || '').toUpperCase()) >= 0) return;
          const setNumber = Number(set.set);
          if (Number.isFinite(setNumber) && setNumber > max) max = setNumber;
        });
        if (max > 0) byExercise[exercise.name] = max;
      });
      return byExercise;
    }

    function completionMuscleTotals(exerciseSets, allocations) {
      const totals = {};
      Object.keys(exerciseSets || {}).forEach(function (exercise) {
        const mapping = allocations && allocations[exercise] || {};
        Object.keys(mapping).forEach(function (muscle) {
          const fraction = Number(mapping[muscle]);
          if (!Number.isFinite(fraction) || fraction <= 0) return;
          totals[muscle] = (totals[muscle] || 0) + exerciseSets[exercise] * fraction;
        });
      });
      return totals;
    }

    function completionMuscleRows(totals) {
      return Object.keys(totals || {}).map(function (muscle) {
        return { muscle: muscle, sets: completionRound(totals[muscle]) };
      }).filter(function (item) { return item.sets > 0; }).sort(function (a, b) {
        return b.sets !== a.sets ? b.sets - a.sets : a.muscle.localeCompare(b.muscle);
      });
    }

    function completionBestLiftRows(draft, priorBestLifts) {
      const records = [];
      (draft && draft.exercises || []).forEach(function (exercise) {
        let candidate = null;
        (exercise.sets || []).forEach(function (set) {
          if (set.completed !== true || String(set.type || '').toUpperCase() !== 'W') return;
          if (isBlank(set.weight) || isBlank(set.reps)) return;
          const weight = Number(set.weight);
          const reps = Number(set.reps);
          if (!Number.isFinite(weight) || !Number.isFinite(reps)) return;
          if (!candidate || weight > candidate.weight
              || (weight === candidate.weight && reps > candidate.reps)) {
            candidate = { weight: weight, reps: reps };
          }
        });
        if (!candidate) return;
        const prior = priorBestLifts && priorBestLifts[exercise.name];
        if (prior && !(candidate.weight > Number(prior.weight)
            || (candidate.weight === Number(prior.weight) && candidate.reps > Number(prior.reps)))) return;
        records.push({
          exercise: exercise.name,
          weight: candidate.weight,
          reps: candidate.reps,
          previousWeight: prior && Number.isFinite(Number(prior.weight)) ? Number(prior.weight) : null,
          previousReps: prior && Number.isFinite(Number(prior.reps)) ? Number(prior.reps) : null
        });
      });
      return records;
    }

    function buildCompletionSummary(draft, context) {
      context = context && typeof context === 'object' ? context : {};
      const exerciseSets = completionExerciseSetMax(draft);
      const allocations = context.allocations || {};
      const sessionTotals = completionMuscleTotals(exerciseSets, allocations);
      const weekTotals = Object.assign({}, context.weekMuscles || {});
      const priorSessionSets = context.weekSessionExerciseMax || {};
      Object.keys(exerciseSets).forEach(function (exercise) {
        const addedSets = Math.max(0, exerciseSets[exercise] - (Number(priorSessionSets[exercise]) || 0));
        const mapping = allocations[exercise] || {};
        Object.keys(mapping).forEach(function (muscle) {
          const fraction = Number(mapping[muscle]);
          if (!Number.isFinite(fraction) || fraction <= 0 || addedSets <= 0) return;
          weekTotals[muscle] = (Number(weekTotals[muscle]) || 0) + addedSets * fraction;
        });
      });
      const sessionMuscles = completionMuscleRows(sessionTotals);
      return {
        schemaVersion: 1,
        week: draft && draft.week == null ? null : Number(draft.week),
        workingSetCount: Object.keys(exerciseSets).reduce(function (sum, exercise) {
          return sum + exerciseSets[exercise];
        }, 0),
        muscleCount: sessionMuscles.length,
        newBestLifts: completionBestLiftRows(draft, context.priorBestLifts || {}),
        sessionMuscles: sessionMuscles,
        weekMuscles: completionMuscleRows(weekTotals)
      };
    }
    function snapshotDraft() { return JSON.parse(JSON.stringify(state.draft)); }

    function markWorkoutIntentionallySkipped(draft) {
      if (!draft) return draft;
      draft.intentionalSkip = true;
      draft.exercises.forEach(function (exercise) {
        exercise.sets.forEach(function (set) {
          set.type = 'SKIP';
          set.weight = null;
          set.reps = null;
          set.rir = null;
          set.completed = false;
        });
      });
      return draft;
    }

    function pendingOptionMatchesBatch(option, draft) {
      if (!draft || draft.pendingBatch !== true) return true;
      const week = option && option.pendingWeek;
      return option && String(option.pendingSession || '').trim() === String(draft.sessionType || '').trim()
        && week !== null && week !== undefined && week !== ''
        && Number.isInteger(Number(week))
        && Number(week) === Number(draft.week);
    }

    function pendingOptionsForDraft(options, draft) {
      return (Array.isArray(options) ? options : []).filter(function (option) {
        if (!option || !option.name) return false;
        if (draft && draft.sessionType === PENDING_SESSION_TYPE && draft.exercises.length === 0) {
          return String(option.pendingSession || '').trim() !== ''
            && Number.isInteger(Number(option.pendingWeek))
            && Number(option.pendingWeek) >= 0;
        }
        return pendingOptionMatchesBatch(option, draft);
      });
    }

    function adoptPendingBatchOrigin(draft, option) {
      if (!draft || draft.pendingBatch === true) return pendingOptionMatchesBatch(option, draft);
      if (draft.sessionType !== PENDING_SESSION_TYPE || draft.exercises.length !== 0) return true;
      const session = String(option && option.pendingSession || '').trim();
      const week = Number(option && option.pendingWeek);
      if (!session || !Number.isInteger(week) || week < 0) return false;
      draft.sessionType = session;
      draft.week = week;
      draft.pendingBatch = true;
      return true;
    }

    function changeDraft(mutator, shouldRender, meaningfulEdit) {
      if (!state.draft || state.exerciseCueSaving || state.completing || state.saved || state.sheetHandoff) return;
      if (meaningfulEdit !== false) state.draft.intentionalSkip = false;
      mutator(state.draft);
      state.draft.focusedExerciseId = state.focusedId;
      if (meaningfulEdit !== false) state.workoutEdited = true;
      state.dirty = true;
      state.editEpoch += 1;
      queueCheckpoint();
      if (shouldRender) render();
    }

    function changeCardioDraft(mutator, shouldRender) {
      if (!state.cardioDraft || state.completing || state.saved || state.sheetHandoff) return;
      mutator(state.cardioDraft);
      state.cardioDraft.previous = cardioPreviousFor(state.cardioDraft.activity, state.cardioDraft.type);
      state.dirty = true;
      state.editEpoch += 1;
      queueCheckpoint();
      if (shouldRender) render();
    }

    function queueCheckpoint(delay) {
      if (!activeDraft() || state.saved || state.sheetHandoff || state.checkpointBlocked) return;
      window.clearTimeout(state.checkpointTimer);
      state.checkpointTimer = window.setTimeout(function () { checkpointIfNeeded(); }, delay == null ? CHECKPOINT_DELAY : delay);
    }

    async function checkpointIfNeeded() {
      if (!activeDraft() || state.checkpointRunning || !state.dirty || state.saved) return;
      state.checkpointRunning = true;
      const checkpointEpoch = state.editEpoch;
      const cardio = !!state.cardioDraft;
      const draft = snapshotActiveDraft();
      let checkpointError = null;
      let checkpointSucceeded = false;
      try {
        const response = await rpc(cardio ? 'webCheckpointCardioDraft' : 'webCheckpointDraft', {
          clientRequestId: clientRequestId('checkpoint'),
          draft: draft,
          expectedRevision: draft.revision
        });
        const data = response.data || {};
        // The server revision is authoritative even if the user kept typing while this request ran.
        const current = cardio ? state.cardioDraft : state.draft;
        if (!current || current.draftId !== draft.draftId) return;
        current.draftId = data.draftId || current.draftId;
        current.revision = data.revision;
        state.dirty = state.editEpoch !== checkpointEpoch;
        checkpointSucceeded = true;
        state.checkpointRetryCount = 0;
        state.checkpointBlocked = false;
        if (!state.dirty && state.status && state.status.kind === 'warning') setStatus(null);
      } catch (error) {
        checkpointError = error;
        state.dirty = true;
        state.checkpointRetryCount += 1;
        setStatus((error.code === 'STALE_REVISION' || error.code === 'DRAFT_CONFLICT') ? 'error' : 'warning', asErrorMessage(error, 'checkpoint'), error.code);
      } finally {
        state.checkpointRunning = false;
        if (state.dirty && activeDraft() && !state.saved && !state.completing && !state.sheetHandoff) {
          const retryable = checkpointError && checkpointError.retryable === true;
          if (checkpointSucceeded) {
            queueCheckpoint();
          } else if (retryable && state.checkpointRetryCount <= CHECKPOINT_RETRY_LIMIT) {
            queueCheckpoint(Math.min(5000, CHECKPOINT_RETRY_BASE_DELAY * Math.pow(2, state.checkpointRetryCount - 1)));
          } else {
            state.checkpointBlocked = true;
            setStatus('error', state.cardioDraft
              ? 'Background saving stopped because the Cardio draft did not exactly match the app\'s last safe copy. Nothing was overwritten, and your entries are still on this screen. Use Complete cardio to retry.'
              : 'Background saving stopped because Today did not exactly match the app\'s last safe copy. Nothing was overwritten, and your entries are still on this screen. Use Complete to retry, or open Today and choose the safe fallback.', state.status && state.status.code);
          }
        }
        renderStatusOnly();
      }
    }

    async function flushCheckpoint() {
      window.clearTimeout(state.checkpointTimer);
      await waitForCheckpointToFinish();
      if (!state.dirty) return true;
      await checkpointIfNeeded();
      if (!state.dirty) return true;
      throw {
        code: state.status && state.status.code || 'CHECKPOINT_FAILED',
        message: state.status && state.status.message || 'Your draft could not be safely checkpointed.',
        retryable: false
      };
    }

    async function waitForCheckpointToFinish() {
      if (state.checkpointRunning) {
        await new Promise(function (resolve) {
          const wait = window.setInterval(function () {
            if (!state.checkpointRunning) { window.clearInterval(wait); resolve(); }
          }, 35);
        });
      }
    }

    function renderStatusOnly() {
      const target = document.getElementById('status-banner');
      if (!target) return;
      if (!state.status) { target.className = 'status-banner hidden'; target.textContent = ''; return; }
      target.className = 'status-banner ' + state.status.kind;
      target.textContent = state.status.message;
    }

    function render() {
      if (state.loading) {
        APP.innerHTML = '<section class="app-loading" aria-label="Loading workout tracker"><span class="spinner" aria-hidden="true"></span><p>Loading your workout…</p></section>';
        return;
      }
      if (state.saved) { renderSaved(); return; }
      if (state.dashboardVisible) { renderDashboard(); return; }
      if (state.cardioDraft) { renderCardio(); return; }
      if (!state.draft || (!state.draft.exercises.length && state.draft.sessionType !== PENDING_SESSION_TYPE)) { renderDashboard(); return; }
      renderWorkout();
    }

    function renderStatus() {
      const status = state.status;
      return '<div id="status-banner" class="status-banner ' + (status ? status.kind : 'hidden') + '" role="status">' + (status ? text(status.message) : '') + '</div>';
    }

    function renderSetup() {
      const sessions = (state.bootstrap && state.bootstrap.sessionTypes) || [];
      const existing = state.draft;
      const defaultSession = existing && existing.sessionType || (state.bootstrap && state.bootstrap.scheduledSessionType) || '';
      APP.innerHTML = '' +
        '<header class="topbar"><p class="eyebrow">Workout Tracker</p><h1>Set up today’s workout</h1><p class="meta-line">Your Sheet remains the source of truth. We’ll keep a recoverable draft there as you log.</p></header>' +
        '<div class="content">' + renderStatus() +
          '<section class="card setup-card" aria-labelledby="setup-heading">' +
            '<h2 id="setup-heading">What are you training?</h2>' +
            '<div class="setup-grid">' +
              '<div class="field full"><label for="session-type">Session</label><select id="session-type" required><option value="">Choose a session…</option><option value="' + PENDING_SESSION_TYPE + '"' + selected(defaultSession, PENDING_SESSION_TYPE) + '>Pending</option>' +
                sessions.map(function (session) { return '<option value="' + attr(session) + '"' + selected(defaultSession, session) + '>' + text(session) + '</option>'; }).join('') +
              '</select></div>' +
              '<div class="field"><label for="setup-date">Date</label><input id="setup-date" type="date" value="' + attr(existing && existing.date || state.bootstrap.defaultDate || todayIso()) + '"></div>' +
              '<div class="field"><label for="setup-week">Week</label><input id="setup-week" type="number" min="0" step="1" value="' + attr(existing && existing.week != null ? existing.week : state.bootstrap.defaultWeek == null ? '' : state.bootstrap.defaultWeek) + '" inputmode="numeric"></div>' +
            '</div>' +
            '<div class="setup-actions"><button id="load-session" class="button button-primary button-block" type="button">Load workout</button></div>' +
          '</section>' +
          sheetFallbackHtml() +
        '</div>';
      document.getElementById('load-session').addEventListener('click', loadSelectedSession);
      document.getElementById('session-type').addEventListener('change', function () {
        setStatus(null);
        renderStatusOnly();
        refreshSetupDefaults();
      });
      document.getElementById('setup-date').addEventListener('change', refreshSetupDefaults);
      document.getElementById('setup-week').addEventListener('input', function () { state.setupWeekTouched = true; });
    }

    function dashboardStatusIcon(status) {
      if (status === 'completed') return '✓';
      if (status === 'in-progress') return 'Ⅱ';
      if (status === 'skipped') return '−';
      return '';
    }

    function dashboardSessionCopy(session) {
      const count = Number(session.exerciseCount) || 0;
      const remaining = Number(session.remainingCount) || 0;
      if (session.status === 'completed') return 'Logged this week';
      if (session.status === 'in-progress') {
        return remaining
          ? remaining + ' exercise' + (remaining === 1 ? '' : 's') + ' left'
          : 'Draft ready to resume';
      }
      if (session.status === 'skipped') return 'Skipped this week';
      return count ? count + ' exercise' + (count === 1 ? '' : 's') + ' · ready' : 'Ready to start';
    }

    // The advance control is the only thing that moves the training week. It is
    // deliberately explicit: coverage of logged work cannot tell a finished
    // session apart from one the user intends to come back to.
    function dashboardAdvanceHtml(dashboard) {
      const advance = dashboard.advance;
      if (!advance || !advance.label) return '';

        return '<section class="dashboard-advance-confirm">' +
          '<p class="confirm-copy"><strong>' + names + '</strong> ' +

          (advance.kind === 'close' ? 'Close the mesocycle anyway?' : 'Move on anyway?') +
          '<br><small>' + (outstanding.length === 1 ? 'It will be' : 'They will be') +
          ' recorded as skipped.</small></p>' +
          '<button class="dashboard-advance is-suggested" type="button" data-action="advance-week-confirm"' +
          (state.dashboardAdvancing ? ' disabled' : '') + '>Yes, ' + text(advance.label.toLowerCase()) + '</button>' +
          '<button class="dashboard-advance" type="button" data-action="advance-week-cancel">Cancel</button>' +
          '</section>';

        '" type="button" data-action="advance-week"' + (state.dashboardAdvancing ? ' disabled' : '') +
        '>' + text(advance.label) + '</button>';

    function cardioNumber(value) {
      const number = Number(value) || 0;
      return Number.isInteger(number) ? String(number) : String(Math.round(number * 100) / 100);
    }

    }

    async function refreshSetupDefaults() {
      const sessionElement = document.getElementById('session-type');
      const dateElement = document.getElementById('setup-date');
      const weekElement = document.getElementById('setup-week');
      if (!sessionElement || !dateElement || !weekElement || !sessionElement.value) return;
      const session = sessionElement.value;
      const date = dateElement.value || todayIso();
      if (session === PENDING_SESSION_TYPE) {
        weekElement.value = state.bootstrap && state.bootstrap.defaultWeek == null ? '' : String(state.bootstrap.defaultWeek);
        state.setupWeekTouched = false;
        return;
      }
      const requestNumber = ++state.setupDefaultsRequest;
      weekElement.disabled = true;
      weekElement.setAttribute('aria-busy', 'true');
      try {
        const response = await rpc('webGetSetupDefaults', {
          clientRequestId: clientRequestId('setup-defaults'),
          sessionType: session,
          date: date
        });
        if (requestNumber !== state.setupDefaultsRequest) return;
        const data = response.data || {};
        weekElement.value = data.week == null ? '' : String(data.week);
        state.setupWeekTouched = false;
      } catch (error) {
        if (requestNumber !== state.setupDefaultsRequest) return;
        setStatus('warning', asErrorMessage(error, 'refresh the workout week'), error.code);
        renderStatusOnly();
      } finally {
        if (requestNumber === state.setupDefaultsRequest) {
          weekElement.disabled = false;
          weekElement.removeAttribute('aria-busy');
        }
      }
    }

    function trackerSheetUrl(kind) {
      const urls = state.bootstrap && state.bootstrap.sheetUrls || {};
      return urls[kind] || urls.root || state.sheetUrl || (state.bootstrap && state.bootstrap.sheetUrl) || '';

      if (!todayUrl) return '<p class="small">Need the spreadsheet instead? The deployment’s Google Sheets link is unavailable; ask the app owner to add it to this deployment.</p>';
      return '<p class="small"><a class="sheet-link" href="' + attr(todayUrl) + '" data-action="sheet-handoff" data-sheet-url="' + attr(todayUrl) + '">Continue in Today ↗</a>' +
        (logUrl && logUrl !== todayUrl ? ' · <a class="sheet-link" href="' + attr(logUrl) + '" data-action="sheet-handoff" data-sheet-url="' + attr(logUrl) + '">Inspect Log ↗</a>' : '') + '</p>';

      return '<span><span class="previous-main">' + duration + '</span>' +
        (details.length ? '<small>' + details.join(' · ') + '</small>' : '') + '</span>';

ise-note-panel" type="button" data-action="show-cardio-note" aria-haspopup="dialog"><span class="exercise-note-heading"><strong>Activity note</strong><span aria-hidden="true">✎</span></span><span class="exercise-note-copy">' + (draft.notes ? text(draft.notes) : 'Add an optional note about this Cardio session.') + '</span></button></div></section></div>' +

        '<div data-tour="set-logger" class="compact-set-grid" role="table" aria-label="Sets for ' + attr(exercise.name) + '">' +
          '<div class="compact-set-header" role="row"><span role="columnheader">Set</span><span role="columnheader">Previous</span><span role="columnheader">' + (isAssistedExercise(exercise) ? 'Assist' : 'kg') + '</span><span role="columnheader">Reps</span><span role="columnheader">RIR</span><span role="columnheader"><span class="visually-hidden">Done</span>✓</span></div>' +
          '<div class="compact-set-body">' + exercise.sets.map(function (set) { return renderSet(exercise, set); }).join('') + '</div>' +
          '<div class="add-set-row"><button class="set-type-circle add-set-button" type="button" data-action="add-set" aria-label="Add a standard set">+</button><button class="add-set-label" type="button" data-action="add-set">Add standard set</button></div>' +
        '</div>' +
        '<div class="exercise-notes-stack">' +
          '<button class="exercise-note-panel" type="button" data-action="show-exercise-note" aria-haspopup="dialog"><span class="exercise-note-heading"><strong>Exercise note</strong><span aria-hidden="true">✎</span></span><span class="exercise-note-copy">' + (exercise.note ? text(exercise.note) : 'Add a note about this exercise in this workout.') + '</span></button>' +
          '<button class="exercise-note-panel" type="button" data-action="show-exercise-cue" aria-haspopup="dialog"><span class="exercise-note-heading"><strong>Exercise cue</strong><span aria-hidden="true">›</span></span><span class="exercise-note-copy">' + (exercise.cue ? text(exercise.cue) : 'No persistent setup or form cue.') + '</span></button>' +
        '</div>' +
      '</section>';
    }

    function renderSet(exercise, set) {
      const id = attr(set.id);
      const placeholder = set.type === 'PENDING' || set.type === 'SKIP';
      const assisted = isAssistedExercise(exercise);
      // For an assisted exercise the number is the assistance, not a signed
      // weight. The column header says "Assist" and the value is stored
      // negative; no minus sign appears anywhere on screen, because the sign is
      // a storage detail rather than something the user enters or reads.
      const weightLabel = assisted
        ? 'Set ' + text(set.set) + ' assistance in kilograms'
        : 'Set ' + text(set.set) + ' weight in kilograms';
      return '<div class="set-swipe-row' + (set.completed ? ' completed' : '') + (placeholder ? ' placeholder' : '') + '" role="row" data-swipe-set-id="' + id + '">' +
        '<div class="compact-set-row" data-set-id="' + id + '">' +
          '<span class="set-type-cell" role="cell"><button class="set-type-circle' + (set.type === 'W' ? ' standard' : '') + '" type="button" data-action="show-set-type" data-set-id="' + id + '" aria-label="Set ' + text(set.set) + ' type: ' + text(set.type) + '">' + text(setTypeDisplay(set)) + '</button></span>' +
          '<span class="previous-performance" role="cell">' + previousSetHtml(set) + '</span>' +
          '<span class="compact-input-cell' + (assisted ? ' assisted-weight-cell' : '') + '" role="cell">' +
            '<input aria-label="' + weightLabel + '" data-field="weight" data-set-id="' + id + '" type="number" inputmode="decimal" step="0.25" value="' + attr(displayedWeight(exercise, set.weight)) + '" placeholder="—"' + (placeholder ? ' disabled' : '') + '>' +
          '</span>' +
          '<span class="compact-input-cell" role="cell"><input aria-label="Set ' + text(set.set) + ' repetitions" data-field="reps" data-set-id="' + id + '" type="number" inputmode="decimal" step="0.5" value="' + attr(numericValue(set.reps)) + '" placeholder="—"' + (placeholder ? ' disabled' : '') + '></span>' +
          '<span class="compact-input-cell" role="cell"><input aria-label="Set ' + text(set.set) + ' RIR" data-field="rir" data-set-id="' + id + '" type="number" inputmode="decimal" min="0" step="0.5" value="' + attr(numericValue(set.rir)) + '" placeholder="—"' + (placeholder ? ' disabled' : '') + '></span>' +
          (placeholder ? '<span class="placeholder-mark" role="cell" aria-label="No completion required">—</span>' : '<span class="set-complete-cell" role="cell"><label><span class="visually-hidden">Mark set ' + text(set.set) + ' complete</span><input data-tour="set-complete" class="set-complete-checkbox" data-action="toggle-set" data-set-id="' + id + '" type="checkbox"' + checked(set.completed) + '></label></span>') +
        '</div>' +
      '</div>';
    }

    function renderMetadataFields() {
      const locations = (state.bootstrap && state.bootstrap.gymLocations) || [];
      const energy = (state.bootstrap && Array.isArray(state.bootstrap.energyOptions)) ? state.bootstrap.energyOptions : [];
      return '<div class="metadata-grid">' +
        '<div class="field"><label for="meta-date">Date</label><input id="meta-date" data-meta="date" type="date" value="' + attr(state.draft.date) + '"></div>' +
        '<div class="field"><label for="meta-week">Week</label><input id="meta-week" data-meta="week" type="number" min="0" step="1" inputmode="numeric" value="' + attr(numericValue(state.draft.week)) + '"' + (state.draft.pendingBatch ? ' disabled title="The original pending week stays fixed for this batch."' : '') + '></div>' +
        '<div class="field"><label for="meta-gym">Gym</label><select id="meta-gym" data-meta="gymLocation"><option value="">Choose…</option>' + locations.map(function (place) { return '<option value="' + attr(place) + '"' + selected(state.draft.gymLocation, place) + '>' + text(place) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="meta-energy">Energy</label><select id="meta-energy" data-meta="energy"><option value="">Not set</option>' + energy.map(function (value) { return '<option value="' + attr(value) + '"' + selected(state.draft.energy, value) + '>' + text(value) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field full"><label for="meta-notes">Session note</label><textarea id="meta-notes" data-meta="sessionNotes" placeholder="Optional note about this workout session">' + text(state.draft.sessionNotes) + '</textarea></div>' +
      '</div>';
    }

    function renderStickyActions() {
      const skipUnavailable = skipWorkoutUnavailableReason();
      return '<footer class="sticky-actions"><div class="sticky-actions-inner"><button data-tour="complete-workout" id="complete-workout" class="button button-primary" type="button"' + (state.completing ? ' disabled' : '') + '>' + (state.completing ? 'Completing…' : 'Complete workout') + '</button>' +
        sheetFallbackButton() + '</div><button id="skip-workout" class="button button-danger-soft button-block" style="margin-top:8px" type="button"' + (skipUnavailable ? ' disabled title="' + attr(skipUnavailable) + '"' : '') + '>Skip workout</button></footer>';
    }

    function sheetFallbackButton() {
      const url = trackerSheetUrl('today');
      return url ? '<a class="button sheet-fallback" href="' + attr(url) + '" data-action="sheet-handoff" data-sheet-url="' + attr(url) + '" aria-label="Save this draft and continue in the Today sheet">Today ↗</a>' : '<button class="button sheet-fallback" type="button" disabled title="Google Sheets link is unavailable">Today</button>';
    }

    function bindWorkoutEvents() {
      document.getElementById('edit-workout').addEventListener('click', openWorkoutDetails);
      document.getElementById('workout-session').addEventListener('change', function (event) {
        requestSessionChange(event.target.value);
      });
    }

    function openWorkoutDetails() {
