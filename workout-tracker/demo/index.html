    function completionBodyViewHtml(rows, map, x, label) {
      const muscles = map.regions.map(function (region) {
        return completionMusclePath(rows, region[0], region[1]);
      }).join('');
      return '<svg class="completion-body-view" x="' + x + '" y="26" width="220" height="400" viewBox="' + map.viewBox + '" preserveAspectRatio="xMidYMid meet" aria-label="' + label + ' body">' +
        '<path class="completion-body-base" d="' + map.base + '"/>' + muscles + '</svg>';
    }

    function completionBodyMap(rows) {
      return '<svg class="completion-body-map" viewBox="0 0 440 430" role="img" aria-labelledby="completion-body-title completion-body-desc">' +
        '<title id="completion-body-title">Front and back training distribution</title>' +
        '<desc id="completion-body-desc">Muscle regions trained are shaded green; darker regions received more set allocation.</desc>' +
        '<text class="completion-body-label" x="110" y="17">Front</text>' +
        '<text class="completion-body-label" x="330" y="17">Back</text>' +
        completionBodyViewHtml(rows, COMPLETION_BODY_MAPS.front, 0, 'Front') +
        completionBodyViewHtml(rows, COMPLETION_BODY_MAPS.back, 220, 'Back') +
        '</svg>';
    }
    // GENERATED_BODY_MAP_END

    function completionDistributionHtml(summary) {
      const weekView = state.completionView === 'week';
      const rows = weekView ? (summary.weekMuscles || []) : (summary.sessionMuscles || []);
      const max = rows.length ? Math.max.apply(null, rows.map(function (item) { return Number(item.sets) || 0; })) : 0;
      const list = rows.length ? rows.map(function (item) {
        const width = max ? Math.max(8, Math.round((Number(item.sets) || 0) / max * 100)) : 0;
        return '<div class="completion-muscle-row"><span class="completion-muscle-name">' + text(item.muscle) + '</span>' +
          '<span class="completion-track" aria-hidden="true"><span style="width:' + width + '%"></span></span>' +
          '<strong>' + text(completionValue(item.sets)) + '</strong></div>';
      }).join('') : '<p class="completion-empty">No muscle allocations were recorded for this view.</p>';
      const weekLabel = summary.week == null ? 'Week' : 'Week ' + text(summary.week);
      return '<section data-tour="training-distribution" class="completion-panel" aria-labelledby="completion-distribution-title">' +
        '<h2 id="completion-distribution-title">Training distribution</h2>' +
        '<div class="completion-switcher" role="tablist" aria-label="Training distribution period">' +
          '<button id="completion-session-tab" type="button" role="tab" aria-selected="' + (!weekView) + '">This workout</button>' +
          '<button id="completion-week-tab" type="button" role="tab" aria-selected="' + weekView + '">' + weekLabel + '</button>' +
        '</div><div class="completion-body-stage">' + completionBodyMap(rows) + '</div>' +
        '<div class="completion-muscle-list" aria-live="polite">' + list + '</div></section>';
    }

    function leaveCompletedWorkout() {
      state.saved = null;
      state.submissionId = null;
      state.draft = null;
      state.cardioDraft = null;
      state.focusedId = null;
      state.status = null;
      state.previousBySetId = {};
      state.exerciseCueBaselines = {};
      state.completionContext = null;
      state.completionView = 'session';
      state.setupWeekTouched = false;
      bootstrap();
    }

    function bindCompletedWorkoutActions() {
      const dashboard = document.getElementById('saved-dashboard');
      const done = document.getElementById('start-another');
      if (dashboard) dashboard.addEventListener('click', leaveCompletedWorkout);
      if (done) done.addEventListener('click', leaveCompletedWorkout);
      const sessionTab = document.getElementById('completion-session-tab');
      const weekTab = document.getElementById('completion-week-tab');
      if (sessionTab) sessionTab.addEventListener('click', function () {
        if (state.completionView !== 'session') { state.completionView = 'session'; renderSaved(); }
      });
      if (weekTab) weekTab.addEventListener('click', function () {
        if (state.completionView !== 'week') { state.completionView = 'week'; renderSaved(); }
      });
    }

    function renderSaved() {
      const saved = state.saved || {};
      if (saved.kind === 'cardio') {
        APP.innerHTML = '<header class="topbar"><p class="eyebrow">Workout Tracker</p><h1>Cardio saved</h1><p class="meta-line">' + text(saved.activity || 'Cardio') + (saved.date ? ' · ' + text(saved.date) : '') + '</p></header><div class="content"><section class="card status-card" style="min-height:unset"><div class="avatar" style="width:56px;height:56px;font-size:26px">✓</div>' + (window.DEMO_BACKEND ? '' : '<h2>Saved confidently</h2>') + '<p class="meta-line">' + text(saved.durationMinutes) + ' min ' + (saved.type === 'HIIT' ? 'H / HIIT' : 'M / MISS') + (window.DEMO_BACKEND ? '.</p>' : ' saved to LogCardio.</p><p class="small">Session: ' + text(saved.sessionId || '') + '</p>') + '<button id="start-another" class="button button-primary button-block" type="button">Back to dashboard</button>' + (window.DEMO_BACKEND ? '' : '<div style="margin-top:12px"><a class="sheet-link" href="' + attr(trackerSheetUrl('cardioLog')) + '">Inspect LogCardio ↗</a></div>') + '</section></div>';
        document.getElementById('start-another').addEventListener('click', function () {
          state.saved = null; state.submissionId = null; state.cardioDraft = null; state.draft = null; state.status = null;
          bootstrap();
        });
        return;
      }
      const count = saved.logRowsWritten == null ? (state.draft ? allSetCount() : 0) : saved.logRowsWritten;
      const savedSessionType = state.draft ? state.draft.sessionType : (saved.sessionType || 'Workout');
      const savedDate = state.draft ? state.draft.date : (saved.date || '');
      const summary = saved.completionSummary;
      if (saved.intentionallySkipped || !summary) {
        APP.innerHTML = '<header class="topbar"><p class="eyebrow">Workout Tracker</p><h1>' + (saved.intentionallySkipped ? 'Workout skipped' : 'Workout saved') + '</h1><p class="meta-line">' + text(savedSessionType) + (savedDate ? ' · ' + text(completionDateLabel(savedDate)) : '') + '</p></header><div class="content">' +
          '<section class="card status-card" style="min-height:unset"><div class="avatar" style="width:56px;height:56px;font-size:26px">✓</div><p class="meta-line">' + text(count) + ' set' + (count === 1 ? '' : 's') + ' saved.</p><button id="start-another" class="button button-primary button-block" type="button">Back to dashboard</button></section></div>';
        bindCompletedWorkoutActions();
        return;
      }
      const week = summary.week == null ? '' : 'Week ' + summary.week;
      const meta = [savedSessionType, week, completionDateLabel(savedDate)].filter(Boolean).join(' · ');
      const records = completionRecordsHtml(summary.newBestLifts || []);
      APP.innerHTML = '<header class="completion-hero"><div class="completion-hero-row"><div>' +
          '<button id="saved-dashboard" class="completion-dashboard" type="button">← Dashboard</button>' +
          '<h1>Workout complete</h1><p>' + text(meta) + '</p></div>' +
          '<span class="completion-check" aria-label="Workout saved">✓</span></div>' +
          '<div class="completion-summary"><span>' + text(summary.workingSetCount) + ' working set' + (Number(summary.workingSetCount) === 1 ? '' : 's') + '</span>' +
          '<span>' + text(summary.muscleCount) + ' muscle' + (Number(summary.muscleCount) === 1 ? '' : 's') + '</span></div></header>' +
        '<main class="completion-content">' + records + completionDistributionHtml(summary) + '</main>' +
        '<footer class="completion-footer"><button id="start-another" class="button button-primary button-block" type="button">Done</button></footer>';
      bindCompletedWorkoutActions();
    }

    async function bootstrap() {
      invalidateSwapRequest();
      invalidateAddExerciseRequest();
      invalidateExerciseCueSave();
      state.loading = true; render();
      try {
        const response = await rpc('webGetBootstrap', { clientRequestId: clientRequestId('bootstrap') });
        state.bootstrap = response.data || {};
        state.sheetUrl = state.sheetUrl || state.bootstrap.sheetUrl || '';
        if (state.bootstrap.existingDraft) {
          state.cardioDraft = null;
          state.draft = normaliseDraft(state.bootstrap.existingDraft);
          state.completionContext = state.bootstrap.completionContext || null;
          state.completionView = 'session';
          captureLoadedExerciseState(state.draft, true);
          state.focusedId = state.draft.focusedExerciseId || (state.draft.exercises[0] && state.draft.exercises[0].id) || null;
          state.workoutEdited = true;
        } else {
          state.draft = null;
          state.previousBySetId = {};
          state.exerciseCueBaselines = {};
          state.completionContext = null;
          state.completionView = 'session';
          state.workoutEdited = false;
          state.cardioDraft = state.bootstrap.existingCardioDraft
            ? normaliseCardioDraft(state.bootstrap.existingCardioDraft) : null;
        }
        const recovery = state.bootstrap.recovery || {};
        if (recovery.completionResumed && recovery.completionResponse && !state.bootstrap.existingDraft) {
          state.draft = null;
          state.focusedId = null;
          state.saved = recovery.completionResponse;
          state.submissionId = recovery.completionResponse.submissionId || null;
        } else if (recovery.completionResumed && recovery.todayPreserved) {
          setStatus('info', 'Your previous workout finished saving. Newer Today entries were preserved and are ready to continue.');
        } else if (recovery.checkpointResumed) {
          setStatus('info', 'Your interrupted draft save was recovered before editing resumed.');
        } else if (recovery.discardResumed) {
          setStatus('info', 'Your interrupted session discard was safely finished.');
        } else if (recovery.cardioCompletionResumed && recovery.cardioCompletionResponse
            && !state.bootstrap.existingCardioDraft && !state.bootstrap.existingDraft) {
          state.cardioDraft = null;
          state.saved = recovery.cardioCompletionResponse;
          state.submissionId = recovery.cardioCompletionResponse.submissionId || null;
        }
        state.dirty = false;
        state.checkpointBlocked = false;
        state.dashboardVisible = false;
        state.loading = false;
        render();
      } catch (error) {
        state.loading = false;
        APP.innerHTML = '<section class="status-card"><div><p class="eyebrow">Workout Tracker</p><h1>Couldn’t open your workout</h1><p class="meta-line">' + text(asErrorMessage(error, 'open the app')) + '</p><button id="retry-bootstrap" class="button button-primary" type="button">Try again</button><div style="margin-top:14px">' + sheetFallbackHtml() + '</div></div></section>';
        document.getElementById('retry-bootstrap').addEventListener('click', bootstrap);
      }
    }

    document.addEventListener('click', function (event) {
      if (event.target && event.target.id === 'complete-workout') requestCompletion();
      if (event.target && event.target.id === 'skip-workout') requestWorkoutSkip();
      if (event.target && event.target.id === 'complete-cardio') requestCardioCompletion();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      const backdrop = document.getElementById('modal-backdrop');
      if (state.exerciseCueSaving && backdrop && backdrop.dataset.modalOwner === 'exercise-cue') return;
      closeModal();
    });

    APP.addEventListener('pointermove', onSetPointerMove);
    APP.addEventListener('pointerup', onSetPointerEnd);
    APP.addEventListener('pointercancel', onSetPointerEnd);
    APP.addEventListener('touchstart', onSetTouchStart, { passive: true });
    APP.addEventListener('touchmove', onSetTouchMove, { passive: false });
    APP.addEventListener('touchend', onSetTouchEnd, { passive: true });
    APP.addEventListener('touchcancel', onSetTouchEnd, { passive: true });
    bootstrap();
  })();
</script>
