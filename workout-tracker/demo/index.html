      openModal('<section class="bottom-sheet details-modal" role="dialog" aria-modal="true" aria-labelledby="details-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Workout setup</p><h2 id="details-title">Workout details</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close workout details">×</button></div>' + renderMetadataFields() + '<div class="confirm-actions"><button class="button button-primary" type="button" data-dismiss-modal>Done</button></div></section>');
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.querySelectorAll('[data-meta]').forEach(function (element) {
        element.addEventListener('input', function () { applyField(element, false); });
        element.addEventListener('change', function () { applyField(element, false); });
      });
    }

    function requestSessionChange(nextSession) {
      if (!state.draft || state.sessionSwitching || !nextSession || nextSession === state.draft.sessionType) return;
      const currentSession = state.draft.sessionType;
      const selector = document.getElementById('workout-session');
      if (selector) selector.value = currentSession;
      if (state.exerciseCueSaving) {
        setStatus('error', 'Session changes are paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      if (!state.workoutEdited) { switchWorkoutSession(nextSession); return; }
      openModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="switch-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Change session?</p><h2 id="switch-title">Switch from ' + text(currentSession) + ' to ' + text(nextSession) + '?</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Keep current session">×</button></div><p class="confirm-copy">This replaces the current workout plan in the app and in Today. If you want to keep these entries, continue in Today or complete this workout first.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Keep ' + text(currentSession) + '</button><button id="confirm-session-switch" class="button button-primary" type="button">Switch to ' + text(nextSession) + '</button></div></section>');
      document.getElementById('confirm-session-switch').addEventListener('click', function () {
        closeModal();
        switchWorkoutSession(nextSession);
      });
    }

    async function switchWorkoutSession(nextSession) {
      if (!state.draft || state.exerciseCueSaving || state.sessionSwitching || !nextSession || nextSession === state.draft.sessionType) return;
      invalidateSwapRequest();
      invalidateAddExerciseRequest();
      state.sessionSwitching = true;
      const selector = document.getElementById('workout-session');
      if (selector) selector.disabled = true;
      setStatus('info', 'Switching to ' + nextSession + '…');
      renderStatusOnly();
      try {
        await flushCheckpoint();
        const response = await rpc('webLoadSession', { clientRequestId: clientRequestId('switch'), sessionType: nextSession, date: state.draft.date || todayIso() });
        invalidateSwapRequest();
        invalidateAddExerciseRequest();
        state.draft = normaliseDraft(response.data && response.data.draft);
        state.deload = (response.data && response.data.deload) || null;
        state.completionContext = (response.data && response.data.completionContext) || null;
        state.completionView = 'session';
        state.draft.sessionType = state.draft.sessionType || nextSession;
        captureLoadedExerciseState(state.draft, true);
        state.focusedId = state.draft.focusedExerciseId || (state.draft.exercises[0] && state.draft.exercises[0].id) || null;
        state.draft.focusedExerciseId = state.focusedId;
        state.workoutEdited = false;
        state.history = null;
        state.submissionId = null;
        state.checkpointBlocked = false;
        if (!state.draft.exercises.length) {
          setStatus('warning', 'This session has no programmed exercises yet. Check Programs in Google Sheets, then try again.');
        } else {
          state.dirty = true;
          state.editEpoch += 1;
          setStatus(null);
          queueCheckpoint();
        }
      } catch (error) {
        setStatus('error', asErrorMessage(error, 'switch the session'), error.code);
      } finally {
        state.sessionSwitching = false;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function onAppClick(event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (state.exerciseCueSaving) {
        event.preventDefault();
        setStatus('error', 'Workout changes are paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      if (action === 'sheet-handoff') {
        event.preventDefault();
        beginSheetHandoff(button.dataset.sheetUrl || button.href);
      } else if (action === 'focus-exercise') {
        state.focusedId = button.dataset.exerciseId;
        state.draft.focusedExerciseId = state.focusedId;
        changeDraft(function () {}, true, false);
      } else if (action === 'toggle-set') {
        const set = findSet(button.dataset.setId);
        if (set) changeDraft(function () { set.completed = !set.completed; }, true);
      } else if (action === 'show-history') {
        showHistory();
      } else if (action === 'show-swap') {
        showSwap();
      } else if (action === 'show-add-exercise') {
        showAddExercise();
      } else if (action === 'show-pending-exercises') {
        showPendingExercises();
      } else if (action === 'show-set-type') {
        showSetType(button.dataset.setId);
      } else if (action === 'add-set') {
        addSetToFocusedExercise();
      } else if (action === 'delete-set') {
        deleteSetFromFocusedExercise(button.dataset.setId);
      } else if (action === 'show-exercise-note') {
        showExerciseNote();
      } else if (action === 'show-exercise-cue') {
        showExerciseCue();
      } else if (action === 'load-dashboard-session') {
        loadDashboardSession(button.dataset.sessionType);
      } else if (action === 'advance-week') {
        advanceWeek(false);
      } else if (action === 'advance-week-confirm') {
        advanceWeek(true);
      } else if (action === 'advance-week-cancel') {
        state.dashboardAdvanceConfirm = false;
        render();
      } else if (action === 'start-cardio') {
        startCardio();
      } else if (action === 'show-cardio-dashboard') {
        showCardioDashboard();
      } else if (action === 'show-workout-dashboard') {
        showWorkoutDashboard();
      } else if (action === 'show-cardio-activities') {
        showCardioActivities();
      } else if (action === 'toggle-cardio-type') {
        changeCardioDraft(function (draft) { draft.type = draft.type === 'HIIT' ? 'MISS' : 'HIIT'; }, true);
      } else if (action === 'edit-cardio-details') {
        showCardioDetails();
      } else if (action === 'show-cardio-note') {
        showCardioNote();
      }
    }

    function onFieldInput(event) {
      // Mobile users often type a value and immediately tap Done. Waiting for
      // blur/change can let the Done click replace the input before its latest
      // value reaches state, so mirror every editable value on input.
      if (event.target.matches('[data-cardio-field]')) applyCardioField(event.target, false);
      else if (event.target.matches('[data-field], [data-meta]')) applyField(event.target, false);
    }
    function onFieldChange(event) {
      // Replacing APP.innerHTML on blur/change collapses <details> and can remove
      // the next control a mobile user is already tapping. Field values are
      // already reflected in the existing DOM, so checkpoint without rerendering.
      if (event.target.matches('[data-cardio-field]')) applyCardioField(event.target, false);
      else if (event.target.matches('[data-field], [data-meta]')) applyField(event.target, false);
    }

    async function beginSheetHandoff(url) {
      if (!url || state.sheetHandoff || state.completing) return;
      if (state.exerciseCueSaving) {
        setStatus('error', 'Opening Google Sheets is paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      invalidateSwapRequest();
      invalidateAddExerciseRequest();
      state.sheetHandoff = true;
      window.clearTimeout(state.checkpointTimer);
      setStatus('info', activeDraft() ? 'Saving your latest entries before opening Google Sheets…' : 'Opening Google Sheets…');
      renderStatusOnly();
      try {
        if (activeDraft() && !state.saved) await flushCheckpoint();
        window.location.assign(url);
      } catch (error) {
        const checkpointTarget = state.cardioDraft ? 'the Cardio draft checkpoint' : 'Today';
        setStatus('warning', 'Your latest web entries could not be saved to ' + checkpointTarget + '. Background saving is paused so it cannot overwrite Sheet edits.', error.code);
        renderStatusOnly();
        openModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="handoff-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Choose the safe fallback</p><h2 id="handoff-title">Latest web edits are not in the Sheet</h2></div></div><p class="confirm-copy">You can keep logging here and retry, or open Google Sheets now. If you open the Sheet, this page will stop saving so it cannot overwrite changes you make there.</p><div class="confirm-actions"><button id="cancel-sheet-handoff" class="button" type="button">Keep logging here</button><button id="confirm-sheet-handoff" class="button button-primary" type="button">Open Sheet anyway</button></div></section>');
        document.getElementById('cancel-sheet-handoff').addEventListener('click', function () {
          state.sheetHandoff = false;
          closeModal();
          if (state.dirty) queueCheckpoint();
        });
        document.getElementById('confirm-sheet-handoff').addEventListener('click', function () {
          window.location.assign(url);
        });
      }
    }

    function findSet(id) {
      const exercise = getFocusedExercise();
      return exercise && exercise.sets.find(function (set) { return set.id === id; });
    }

    function showSetType(setId) {
      const set = findSet(setId);
      if (!set) return;
      const exercise = getFocusedExercise();
      const canDelete = exercise && exercise.sets.length > 1;
      openModal('<section class="bottom-sheet set-type-sheet" role="dialog" aria-modal="true" aria-labelledby="set-type-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Set ' + text(set.set) + '</p><h2 id="set-type-title">Set type</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close set type">×</button></div><div class="set-type-options">' + SET_TYPE_OPTIONS.map(function (option) {
        const display = option.value === 'W' ? setTypeDisplay({ set: set.set, type: 'W' }) : option.display;
        return '<button class="set-type-option' + (option.value === set.type ? ' is-selected' : '') + '" type="button" data-set-type="' + attr(option.value) + '"><span class="set-type-circle' + (option.value === 'W' ? ' standard' : '') + '">' + text(display) + '</span><span><strong>' + text(option.label) + '</strong><small>' + text(option.description) + '</small></span><span class="set-type-radio" aria-hidden="true"></span></button>';
      }).join('') + '</div><div class="set-type-footer"><button id="request-delete-set" class="button button-danger-soft button-block" type="button"' + (canDelete ? '' : ' disabled title="An exercise must keep at least one set"') + '>Delete this set</button>' + (canDelete ? '' : '<p class="small">An exercise must keep at least one set.</p>') + '</div></section>');
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.querySelectorAll('[data-set-type]').forEach(function (button) {
        button.addEventListener('click', function () {
          applySetType(setId, button.dataset.setType);
        });
      });
      document.getElementById('request-delete-set').addEventListener('click', function () {
        if (canDelete) confirmSetDeletion(setId);
      });
    }

    function applySetType(setId, type) {
      const set = findSet(setId);
      if (!set || SET_TYPES.indexOf(type) < 0) return;
      const unavailable = draftMutationUnavailableReason('Set type changes');
      if (unavailable) {
        closeModal();
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      closeModal();
      changeDraft(function () {
        set.type = type;
        if (type === 'PENDING' || type === 'SKIP') set.completed = false;
      }, true);
    }

    function addSetToFocusedExercise() {
      const exercise = getFocusedExercise();
      if (!exercise) return;
      const unavailable = draftMutationUnavailableReason('Adding a set');
      if (unavailable) {
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      if (allSetCount() >= MAX_SET_ROWS) {
        setStatus('error', 'Today can hold at most ' + MAX_SET_ROWS + ' sets. Complete this workout or continue in Google Sheets before adding another.');
        renderStatusOnly();
        return;
      }
      let newSet = null;
      changeDraft(function (draft) {
        newSet = appendStandardSet(draft, exercise);
      }, true);
      if (!newSet) return;
      state.previousBySetId[newSet.id] = null;
      setStatus('success', 'Set ' + newSet.set + ' was added to ' + exercise.name + '. Programs was not changed.');
      renderStatusOnly();
    }

    function confirmSetDeletion(setId) {
      const set = findSet(setId);
      const exercise = getFocusedExercise();
      if (!set || !exercise || exercise.sets.length <= 1) return;
      openModal('<section class="bottom-sheet compact-confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="delete-set-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">' + text(exercise.name) + '</p><h2 id="delete-set-title">Delete set ' + text(set.set) + '?</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Cancel deletion">×</button></div><p class="confirm-copy">This removes the set from this workout and Today. Your Programs template and past Log entries stay unchanged.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Keep set</button><button id="confirm-delete-set" class="button button-danger" type="button">Delete set</button></div></section>');
      document.getElementById('confirm-delete-set').addEventListener('click', function () {
        closeModal();
        deleteSetFromFocusedExercise(setId);
      });
    }

    function deleteSetFromFocusedExercise(setId) {
      const exercise = getFocusedExercise();
      const set = findSet(setId);
      const unavailable = draftMutationUnavailableReason('Deleting a set');
      if (unavailable) {
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      if (!exercise || !set) return;
      if (exercise.sets.length <= 1) {
        setStatus('error', 'Keep at least one set for this exercise. You can mark it Skip instead.');
        renderStatusOnly();
        return;
      }
      let removed = null;
      changeDraft(function (draft) {
        removed = removeSetFromExercise(draft, exercise, setId);
      }, true);
      if (!removed) return;
      delete state.previousBySetId[setId];
      setStatus('success', 'Set ' + removed.set + ' was deleted from ' + exercise.name + '. Programs was not changed.');
      renderStatusOnly();
    }

    function beginSetSwipe(target, clientX, clientY, source, identifier) {
      const row = target && target.closest('[data-swipe-set-id]');
      if (!row) return;
      setSwipe = {
        row: row,
        startX: clientX,
        startY: clientY,
        dx: 0,
        furthestLeft: 0,
        horizontal: false,
        source: source,
        identifier: identifier,
        captured: false
      };
    }

    function moveSetSwipe(clientX, clientY, event) {
      if (!setSwipe) return;
      const dx = clientX - setSwipe.startX;
      const dy = clientY - setSwipe.startY;
      if (!setSwipe.horizontal && Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
      if (!setSwipe.horizontal && Math.abs(dy) >= Math.abs(dx)) { setSwipe = null; return; }
      setSwipe.horizontal = true;
      setSwipe.dx = Math.max(-DELETE_SWIPE_WIDTH, Math.min(0, dx));
      setSwipe.furthestLeft = Math.min(setSwipe.furthestLeft, setSwipe.dx);
      const content = setSwipe.row.querySelector('.compact-set-row');
      if (content) content.style.transform = 'translateX(' + setSwipe.dx + 'px)';
      event.preventDefault();
    }

    function finishSetSwipe() {
      if (!setSwipe) return;
      const swipe = setSwipe;
      setSwipe = null;
      const content = swipe.row.querySelector('.compact-set-row');
      const shouldDelete = swipe.horizontal && swipe.furthestLeft <= -DELETE_SWIPE_THRESHOLD;
      if (content) content.style.removeProperty('transform');
      if (shouldDelete) confirmSetDeletion(swipe.row.dataset.swipeSetId);
    }

    function onSetPointerStart(event) {
      // Touch uses the native touch stream below. It is more reliable in the
      // Apps Script iframe on iOS Chrome/Safari; pointer events remain for pens.
      if (event.pointerType !== 'pen') return;
      beginSetSwipe(event.target, event.clientX, event.clientY, 'pointer', event.pointerId);
      if (setSwipe && setSwipe.row.setPointerCapture) {
        try { setSwipe.row.setPointerCapture(event.pointerId); setSwipe.captured = true; } catch (ignore) {}
      }
    }

    function onSetPointerMove(event) {
      if (!setSwipe || setSwipe.source !== 'pointer' || setSwipe.identifier !== event.pointerId) return;
      moveSetSwipe(event.clientX, event.clientY, event);
    }

    function onSetPointerEnd(event) {
      if (!setSwipe || setSwipe.source !== 'pointer' || setSwipe.identifier !== event.pointerId) return;
      if (setSwipe.captured && setSwipe.row.releasePointerCapture) {
        try { setSwipe.row.releasePointerCapture(event.pointerId); } catch (ignore) {}
      }
      finishSetSwipe();
    }

    function touchWithIdentifier(list, identifier) {
      for (let index = 0; index < list.length; index += 1) {
        if (list[index].identifier === identifier) return list[index];
      }
      return null;
    }

    function onSetTouchStart(event) {
      if (event.touches.length !== 1) return;
      const touch = event.changedTouches[0];
      beginSetSwipe(event.target, touch.clientX, touch.clientY, 'touch', touch.identifier);
    }

    function onSetTouchMove(event) {
      if (!setSwipe || setSwipe.source !== 'touch') return;
      const touch = touchWithIdentifier(event.touches, setSwipe.identifier);
      if (touch) moveSetSwipe(touch.clientX, touch.clientY, event);
    }

    function onSetTouchEnd(event) {
      if (!setSwipe || setSwipe.source !== 'touch') return;
      const touch = touchWithIdentifier(event.changedTouches, setSwipe.identifier);
      if (touch) finishSetSwipe();
    }

    function showExerciseNote(tab) {
      const exercise = getFocusedExercise();
      if (!exercise) return;
      renderExerciseNoteModal(exercise, tab === 'cue' ? 'cue' : 'exercise');
    }

    function renderExerciseNoteModal(exercise, tab) {
      const cueTab = tab === 'cue';
      const exerciseNote = String(exercise.note || '');
      const cue = String(exercise.cue || '').trim();
      openModal('<section class="bottom-sheet exercise-note-sheet" role="dialog" aria-modal="true" aria-labelledby="note-sheet-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">' + text(exercise.name) + '</p><h2 id="note-sheet-title">Note</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close note">×</button></div><div class="note-tabs" role="tablist" aria-label="Note type"><button class="note-tab' + (cueTab ? '' : ' is-selected') + '" type="button" role="tab" aria-selected="' + (!cueTab) + '" data-note-tab="exercise">Exercise note</button><button class="note-tab' + (cueTab ? ' is-selected' : '') + '" type="button" role="tab" aria-selected="' + cueTab + '" data-note-tab="cue">Exercise cue</button></div>' +
        (cueTab
          ? '<div class="note-editor" role="tabpanel"><div class="note-label-row"><label class="field-label" for="exercise-cue-input">Persistent exercise cue</label><span id="exercise-cue-count" class="note-count">' + cue.length + '/500</span></div><div class="note-input-wrap"><textarea id="exercise-cue-input" maxlength="500" placeholder="Add a setup or form cue for every workout">' + text(cue) + '</textarea><button id="clear-exercise-cue" class="note-clear' + (cue ? '' : ' hidden') + '" type="button" aria-label="Clear persistent exercise cue">×</button></div><p class="small">Saved to this exercise and shown in future workouts. This is separate from the workout-specific Exercise note.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Cancel</button><button id="save-exercise-cue" class="button button-primary" type="button">Save cue</button></div></div>'
          : '<div class="note-editor" role="tabpanel"><div class="note-label-row"><label class="field-label" for="exercise-note-input">Exercise note</label><span id="exercise-note-count" class="note-count">' + exerciseNote.length + '/500</span></div><div class="note-input-wrap"><textarea id="exercise-note-input" maxlength="500" placeholder="How did this exercise feel today?">' + text(exerciseNote) + '</textarea><button id="clear-exercise-note" class="note-clear' + (exerciseNote ? '' : ' hidden') + '" type="button" aria-label="Clear exercise note">×</button></div><p class="small">Saved for this exercise in this workout and added to Exercise Notes when you complete the workout.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Cancel</button><button id="save-exercise-note" class="button button-primary" type="button">Save note</button></div></div>') + '</section>', cueTab ? 'exercise-cue' : 'exercise-note');
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.querySelectorAll('[data-note-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          renderExerciseNoteModal(exercise, button.dataset.noteTab);
        });
      });
      const input = document.getElementById(cueTab ? 'exercise-cue-input' : 'exercise-note-input');
      const counter = document.getElementById(cueTab ? 'exercise-cue-count' : 'exercise-note-count');
      const clear = document.getElementById(cueTab ? 'clear-exercise-cue' : 'clear-exercise-note');
      input.addEventListener('input', function () {
        counter.textContent = input.value.length + '/500';
        clear.classList.toggle('hidden', input.value.length === 0);
      });
      clear.addEventListener('click', function () {
        input.value = '';
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
      if (cueTab) {
        document.getElementById('save-exercise-cue').addEventListener('click', async function () {
          const unavailable = draftMutationUnavailableReason('Exercise cue changes');
          if (unavailable) {
            closeModal();
            setStatus('error', unavailable);
            renderStatusOnly();
            return;
          }
          const value = input.value.trim();
          const baseline = String(state.exerciseCueBaselines[exercise.id] || '').trim();
          if (value === baseline) { closeModal(); return; }
          const button = document.getElementById('save-exercise-cue');
          const modal = document.getElementById('modal-backdrop');
          const requestId = state.exerciseCueRequestId + 1;
          state.exerciseCueRequestId = requestId;
          state.exerciseCueSaving = true;
          const requestContext = {
            requestId: requestId,
            draftReference: state.draft,
            draftId: state.draft.draftId,
            expectedRevision: null,
            exerciseId: exercise.id,
            exerciseName: exercise.name,
            modal: modal
          };
          input.disabled = true;
          modal.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
          button.disabled = true;
          button.textContent = 'Saving…';
          try {
            await flushCheckpoint();
            if (!exerciseCueSaveIsCurrent(requestContext)) return;
            requestContext.expectedRevision = state.draft.revision;
            const response = await rpc('webSaveExerciseCue', {
              clientRequestId: clientRequestId('exercise-cue'),
              draftId: requestContext.draftId,
              expectedRevision: requestContext.expectedRevision,
              exercise: requestContext.exerciseName,
              expectedCue: baseline,
              cue: value
            });
            if (!exerciseCueSaveIsCurrent(requestContext)) return;
            const data = response.data || {};
            exercise.cue = data.cue === undefined ? value : data.cue;
            state.exerciseCueBaselines[exercise.id] = exercise.cue;
            state.draft.revision = data.revision;
            state.exerciseCueSaving = false;
            closeModal();
            setStatus('info', value ? 'Exercise cue saved for future workouts.' : 'Exercise cue cleared.');
            render();
          } catch (error) {
            if (exerciseCueSaveIsCurrent(requestContext)) {
              state.exerciseCueSaving = false;
              input.disabled = false;
              modal.querySelectorAll('button').forEach(function (item) { item.disabled = false; });
              button.disabled = false;
              button.textContent = 'Save cue';
              setStatus('error', asErrorMessage(error, 'save the exercise cue'), error.code);
              renderStatusOnly();
            }
          } finally {
            if (state.exerciseCueRequestId === requestId && !exerciseCueSaveIsCurrent(requestContext)) {
              state.exerciseCueSaving = false;
            }
          }
        });
        return;
      }
      document.getElementById('save-exercise-note').addEventListener('click', function () {
        const unavailable = draftMutationUnavailableReason('Exercise note changes');
        if (unavailable) {
          closeModal();
          setStatus('error', unavailable);
          renderStatusOnly();
          return;
        }
        const value = input.value;
        closeModal();
        if (value === exercise.note) return;
        changeDraft(function () { exercise.note = value; }, true);
      });
    }

    function showExerciseCue() {
      showExerciseNote('cue');
    }

    function exerciseCueSaveIsCurrent(context) {
      const backdrop = document.getElementById('modal-backdrop');
      if (!context || !state.draft || state.exerciseCueRequestId !== context.requestId) return false;
      if (state.draft !== context.draftReference || state.draft.draftId !== context.draftId) return false;
      if (context.expectedRevision !== null && state.draft.revision !== context.expectedRevision) return false;
      if (!backdrop || backdrop !== context.modal || backdrop.dataset.modalOwner !== 'exercise-cue') return false;
      return state.draft.exercises.some(function (item) {
        return item.id === context.exerciseId && item.name === context.exerciseName;
      });
    }

    function inputNumber(value) {
      return value === '' ? null : Number(value);
    }

    function applyField(element, renderAfter) {
      const field = element.dataset.field || element.dataset.meta;
      if (!field || !state.draft) return;
      if (state.draft.pendingBatch && field === 'week') return;
      changeDraft(function () {
        const target = element.dataset.setId ? findSet(element.dataset.setId) : state.draft;
        if (!target) return;
        if (field === 'weight' && element.dataset.setId) {
          target[field] = canonicalWeight(getFocusedExercise(), element.value);
        } else {
          target[field] = ['weight', 'reps', 'rir', 'week'].indexOf(field) >= 0 ? inputNumber(element.value) : element.value;
        }
      }, renderAfter);
    }

    function applyCardioField(element, renderAfter) {
      const field = element.dataset.cardioField;
      if (!field || !state.cardioDraft) return;
      changeCardioDraft(function (draft) {
        draft[field] = ['durationMinutes', 'distanceKm', 'rpe'].indexOf(field) >= 0
          ? inputNumber(element.value) : element.value;
      }, renderAfter);
    }

    async function loadSelectedSession() {
      if (state.exerciseCueSaving) {
        setStatus('error', 'Loading another workout is paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      const session = document.getElementById('session-type').value;
      const date = document.getElementById('setup-date').value || todayIso();
      const weekValue = document.getElementById('setup-week').value;
      if (!session) { setStatus('error', 'Choose a session before loading your workout.'); renderStatusOnly(); return; }
      const button = document.getElementById('load-session');
      button.disabled = true; button.textContent = 'Loading…'; setStatus(null); renderStatusOnly();
      try {
        const response = await rpc('webLoadSession', {
          clientRequestId: clientRequestId('load'),
          sessionType: session,
          date: date,
          week: state.setupWeekTouched && weekValue !== '' ? Number(weekValue) : null
        });
        invalidateSwapRequest();
        invalidateAddExerciseRequest();
        state.draft = normaliseDraft(response.data && response.data.draft);
        state.deload = (response.data && response.data.deload) || null;
        state.completionContext = (response.data && response.data.completionContext) || null;
        state.completionView = 'session';
        state.draft.sessionType = state.draft.sessionType || session;
        captureLoadedExerciseState(state.draft, true);
        state.draft.date = date;
        // The server derives week from the selected date/mesocycle. Override it
        // only when the user deliberately edited the Week field in this setup.
        if (state.setupWeekTouched && weekValue !== '') state.draft.week = Number(weekValue);
        state.setupWeekTouched = false;
        state.focusedId = state.draft.focusedExerciseId || (state.draft.exercises[0] && state.draft.exercises[0].id) || null;
        state.draft.focusedExerciseId = state.focusedId;
        state.workoutEdited = false;
        if (!state.draft.exercises.length) {
          setStatus('warning', 'This session has no programmed exercises yet. Check Programs in Google Sheets, then try again.');
        } else {
          state.dirty = true;
          state.editEpoch += 1;
          queueCheckpoint();
        }
        render();
      } catch (error) {
        setStatus('error', asErrorMessage(error, 'load the session'), error.code);
        button.disabled = false; button.textContent = 'Load workout'; renderStatusOnly();
      }
    }

    // Moves Mesos.Current Week, or closes the mesocycle after the deload week.
    // The server refuses when sessions are outstanding until `confirmed` is set,
    // so the confirmation copy always names what is unfinished.
    async function advanceWeek(confirmed) {
      const dashboard = state.bootstrap && state.bootstrap.dashboard || {};
      if (state.dashboardAdvancing || state.dashboardLoading || dashboard.week == null) return;
      state.dashboardAdvancing = true;
      render();
      try {
        const response = await rpc('webAdvanceWeek', {
          clientRequestId: clientRequestId('advance-week'),
          expectedWeek: dashboard.week,
          confirmed: confirmed === true
        });
        const result = response.data || {};
        if (!result.applied) {
          if (result.reason === 'confirm_required' || result.reason === 'deload_outstanding') {
            dashboard.advance = Object.assign({}, dashboard.advance, {
              outstanding: result.outstanding || []
            });
            state.dashboardAdvanceConfirm = true;
            return;
          }
          if (result.reason === 'already_advanced' || result.reason === 'week_changed') {
            setStatus('warning', 'The training week changed elsewhere. Reloading.');
            await bootstrap();
            return;
          }
          setStatus('warning', 'The week could not be advanced yet.');
          return;
        }
        state.dashboardAdvanceConfirm = false;
        const recorded = Number(result.recordedSkipped) || 0;
        const recordedCopy = recorded
          ? ' ' + recorded + ' unfinished session' + (recorded === 1 ? '' : 's') + ' recorded as skipped.'
          : '';
        if (result.reason === 'meso_closed') {
          setStatus('info', text(result.meso) + ' closed.' + recordedCopy
            + ' Start the next block in Google Sheets.');
        } else if (result.reason === 'deload_opened') {
          // The dashboard's own Deload chip and reduced-week line say this
          // already; a status banner on top is the same message twice.
          setStatus(null);
        } else {
          setStatus('info', 'Week ' + result.currentWeek + ' started.' + recordedCopy);
        }
        await bootstrap();
      } catch (error) {
        setStatus('error', asErrorMessage(error, 'advance the week'), error.code);
      } finally {
        state.dashboardAdvancing = false;
        render();
      }
    }

    async function loadDashboardSession(session) {
      if (!session || state.dashboardLoading || state.exerciseCueSaving) return;
      if (state.cardioDraft) {
        setStatus('warning', 'A Cardio draft is still open. Resume and complete it before opening a resistance session.');
        renderStatusOnly();
        return;
      }
      state.dashboardLoading = true;
      setStatus('info', 'Opening ' + session + '…');
      render();
      try {
        const response = await rpc('webLoadSession', {
          clientRequestId: clientRequestId('dashboard-load'),
          sessionType: session,
          date: state.bootstrap && state.bootstrap.defaultDate || todayIso()
        });
        invalidateSwapRequest();
        invalidateAddExerciseRequest();
        state.draft = normaliseDraft(response.data && response.data.draft);
        state.deload = (response.data && response.data.deload) || null;
        state.completionContext = (response.data && response.data.completionContext) || null;
        state.completionView = 'session';
        state.draft.sessionType = state.draft.sessionType || session;
        captureLoadedExerciseState(state.draft, true);
        state.focusedId = state.draft.focusedExerciseId || (state.draft.exercises[0] && state.draft.exercises[0].id) || null;
        state.draft.focusedExerciseId = state.focusedId;
        state.workoutEdited = false;
        state.history = null;
        state.submissionId = null;
        state.checkpointBlocked = false;
        if (!state.draft.exercises.length) {
          setStatus('warning', 'This session has no programmed exercises yet. Check Programs in Google Sheets, then try again.');
        } else {
          state.dirty = true;
          state.editEpoch += 1;
          setStatus(null);
          queueCheckpoint();
        }
      } catch (error) {
        setStatus('error', asErrorMessage(error, 'open the session'), error.code);
      } finally {
        state.dashboardLoading = false;
        render();
      }
    }

    async function startCardio() {
      if (state.dashboardLoading || state.draft) return;
      if (state.cardioDraft) {
        state.dashboardVisible = false;
        setStatus(null);
        render();
        return;
      }
      state.dashboardLoading = true;
      setStatus('info', 'Opening Cardio…');
      render();
      try {
        const response = await rpc('webStartCardio', {
          clientRequestId: clientRequestId('cardio-start'),
          date: state.bootstrap && state.bootstrap.defaultDate || todayIso()
        });
        state.cardioDraft = normaliseCardioDraft(response.data && response.data.draft);
        state.completionContext = null;
        state.submissionId = null;
        state.dirty = false;
        state.checkpointBlocked = false;
        state.status = null;
      } catch (error) {
        setStatus('error', asErrorMessage(error, 'open Cardio'), error.code);
      } finally {
        state.dashboardLoading = false;
        render();
      }
    }

    function showCardioDashboard() {
      if (!state.cardioDraft || state.dashboardLoading || state.completing) return;
      requestDashboardDiscard('cardio');
    }

    function showWorkoutDashboard() {
      if (!state.draft || state.dashboardLoading || state.completing || state.sheetHandoff) return;
      requestDashboardDiscard('workout');
    }

    function requestDashboardDiscard(kind) {
      const cardio = kind === 'cardio';
      const draft = cardio ? state.cardioDraft : state.draft;
      if (!draft) return;
      const label = cardio ? 'Cardio session' : (draft.sessionType || 'workout');
      const logName = cardio ? 'LogCardio' : 'Log';
      openModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="discard-dashboard-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Discard session?</p><h2 id="discard-dashboard-title">Leave ' + text(label) + '?</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Keep session">×</button></div><p class="confirm-copy">This permanently deletes every unsaved entry in this session. Nothing will be added to ' + text(logName) + '.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Keep session</button><button id="confirm-dashboard-discard" class="button button-danger" type="button">Discard and go to dashboard</button></div></section>');
      document.getElementById('confirm-dashboard-discard').addEventListener('click', function () {
        closeModal();
        discardToDashboard(kind);
      });
    }

    async function discardToDashboard(kind) {
      const cardio = kind === 'cardio';
      const draft = cardio ? state.cardioDraft : state.draft;
      if (!draft || state.dashboardLoading || state.completing || state.sheetHandoff) return;
      window.clearTimeout(state.checkpointTimer);
      state.dashboardLoading = true;
      setStatus('info', 'Discarding this session…');
      render();
      try {
        // Let an already-running checkpoint finish so its authoritative
        // revision can be used, but never start a new checkpoint for data the
        // user has explicitly chosen to discard.
        await waitForCheckpointToFinish();
        const current = cardio ? state.cardioDraft : state.draft;
        if (!current || current.draftId !== draft.draftId) {
          throw { code: 'DRAFT_CONFLICT', message: 'The open session changed before it could be discarded.', retryable: false };
        }
        const response = await rpc(cardio ? 'webDiscardCardioDraft' : 'webDiscardWorkoutDraft', {
          clientRequestId: clientRequestId('discard'),
          draftId: current.draftId,
          expectedRevision: current.revision
        });
        const result = response.data || {};
        state.dirty = false;
        state.checkpointBlocked = false;
        state.checkpointRetryCount = 0;
        state.submissionId = null;
        state.draft = null;
        state.cardioDraft = null;
        state.focusedId = null;
        state.previousBySetId = {};
        state.exerciseCueBaselines = {};
        state.completionContext = null;
        state.completionView = 'session';
        state.dashboardLoading = false;
        setStatus(null);
        await bootstrap();
        if (result.todayPreserved) {
          setStatus('warning', 'Newer entries in Today were preserved. Review them before starting another workout.');
          render();
        }
      } catch (error) {
        state.dashboardLoading = false;
        setStatus('error', asErrorMessage(error, 'discard this session'), error.code);
        render();
      }
    }

    async function showHistory() {
      const exercise = getFocusedExercise();
      if (!exercise || state.historyLoading) return;
      state.historyLoading = true;
      openModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="history-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Previous performance</p><h2 id="history-title">' + text(exercise.name) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close history">×</button></div><div class="app-loading" style="min-height:180px"><span class="spinner"></span><p>Loading history…</p></div></section>');
      try {
        const response = await rpc('webGetExerciseHistory', { clientRequestId: clientRequestId('history'), sessionType: state.draft.sessionType, exercise: exercise.name, date: state.draft.date });
        state.history = response.data || { exercise: exercise.name, items: [] };
        renderHistoryModal();
      } catch (error) {
        renderHistoryError(asErrorMessage(error, 'load history'));
      } finally { state.historyLoading = false; }
    }

    function historySetText(set) {
      const load = isBlank(set.weight) ? '— kg' : text(set.weight) + ' kg';
      const reps = isBlank(set.reps) ? '— reps' : text(set.reps) + ' reps';
      const rir = isBlank(set.rir) ? '' : ' · ' + text(set.rir) + ' RIR';
      return text(set.type || 'W') + ' · ' + load + ' × ' + reps + rir;
    }

    function renderHistoryModal() {
      const history = state.history || { items: [] };
      const items = Array.isArray(history.items) ? history.items : [];
      updateModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="history-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Previous performance</p><h2 id="history-title">' + text(history.exercise || getFocusedExercise().name) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close history">×</button></div>' +
        (items.length ? '<ul class="history-list">' + items.map(function (item) { return '<li class="history-item"><div><div class="history-main">' + (item.sets || []).map(historySetText).join('<br>') + '</div><div class="history-context">' + text(item.date || '') + (item.week != null ? ' · Week ' + text(item.week) : '') + '</div></div><strong>' + text(item.sessionType || '') + '</strong></li>'; }).join('') + '</ul>' : '<p class="history-empty">No comparable history yet. Today can be the first entry.</p>') +
      '</section>');
    }

    function renderHistoryError(message) {
      updateModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="history-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Previous performance</p><h2 id="history-title">History unavailable</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close history">×</button></div><div class="status-banner error">' + text(message) + '</div></section>');
    }

    async function showSwap() {
      const exercise = getFocusedExercise();
      if (!exercise || state.swapLoading) return;
      const unavailable = swapUnavailableReason();
      if (unavailable) {
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      openModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Swap exercise</p><h2 id="swap-title">Replace ' + text(exercise.name) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close swap">×</button></div><div class="app-loading swap-loading"><span class="spinner"></span><p>Finding ' + text(exercise.primaryMuscle || 'matching') + ' alternatives…</p></div></section>', 'swap');
      const requestId = state.swapRequestId + 1;
      state.swapRequestId = requestId;
      state.swapLoading = true;
      state.swap = null;
      const requestContext = {
        requestId: requestId,
        draftId: state.draft.draftId,
        sessionType: state.draft.sessionType,
        exerciseId: exercise.id,
        exerciseName: exercise.name
      };
      try {
        const response = await rpc('webGetSwapOptions', {
          clientRequestId: clientRequestId('swap-options'),
          sessionType: requestContext.sessionType,
          exercise: exercise.name
        });
        if (!swapRequestIsCurrent(requestContext)) return;
        const usedNames = {};
        state.draft.exercises.forEach(function (item) {
          if (item.id !== exercise.id) usedNames[item.name] = true;
        });
        const data = response.data || {};
        state.swap = {
          exerciseId: exercise.id,
          exerciseName: exercise.name,
          requestId: requestId,
          draftId: requestContext.draftId,
          sessionType: requestContext.sessionType,
          primaryMuscle: data.primaryMuscle || exercise.primaryMuscle || '',
          options: (Array.isArray(data.options) ? data.options : []).filter(function (option) {
            return option && option.name && !usedNames[option.name];
          })
        };
        renderSwapModal();
      } catch (error) {
        if (swapRequestIsCurrent(requestContext)) {
          updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Swap exercise</p><h2 id="swap-title">Alternatives unavailable</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close swap">×</button></div><div class="status-banner error">' + text(asErrorMessage(error, 'load swap options')) + '</div></section>');
        }
      } finally {
        if (state.swapRequestId === requestId) state.swapLoading = false;
      }
    }

    function swapRequestIsCurrent(context) {
      const backdrop = document.getElementById('modal-backdrop');
      if (!context || !state.draft || state.swapRequestId !== context.requestId) return false;
      if (!backdrop || backdrop.dataset.modalOwner !== 'swap') return false;
      if (state.draft.draftId !== context.draftId || state.draft.sessionType !== context.sessionType) return false;
      return state.draft.exercises.some(function (item) {
        return item.id === context.exerciseId && item.name === context.exerciseName;
      });
    }

    function activeSwapExercise() {
      const swap = state.swap;
      const backdrop = document.getElementById('modal-backdrop');
      if (swapUnavailableReason() || !swap || !state.draft || state.swapRequestId !== swap.requestId) return null;
      if (!backdrop || backdrop.dataset.modalOwner !== 'swap') return null;
      if (state.draft.draftId !== swap.draftId || state.draft.sessionType !== swap.sessionType) return null;
      return state.draft.exercises.find(function (item) {
        return item.id === swap.exerciseId && item.name === swap.exerciseName;
      }) || null;
    }

    function renderSwapModal() {
      const swap = state.swap;
      if (!swap || !activeSwapExercise()) return;
      const options = swap.options || [];
      updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Swap exercise' + (swap.primaryMuscle ? ' · ' + text(swap.primaryMuscle) : '') + '</p><h2 id="swap-title">Replace ' + text(swap.exerciseName) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close swap">×</button></div>' +
        (options.length ? '<label class="visually-hidden" for="swap-search">Search alternatives</label><input id="swap-search" class="swap-search" type="search" placeholder="Search alternatives…" autocomplete="off"><div id="swap-options" class="swap-list">' + options.map(function (option, index) {
          const lastDate = option.latestSets && option.latestSets.length ? option.latestSets[0].date : '';
          return '<button data-tour="swap-option" class="swap-option" type="button" data-swap-index="' + index + '" data-swap-search="' + attr(option.name.toLowerCase()) + '"><span><strong>' + text(option.name) + '</strong><small>' + (lastDate ? 'Previous lift data available · ' + text(lastDate) : 'No previous lift data') + '</small></span><span aria-hidden="true">›</span></button>';
        }).join('') + '</div><p id="swap-no-results" class="history-empty hidden">No alternatives match that search.</p>' : '<p class="history-empty">No unused ' + text(swap.primaryMuscle || 'matching') + ' alternatives are listed in Exercises.</p>') +
      '</section>');
      bindSwapModal();
    }

    function bindSwapModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (!backdrop || !state.swap) return;
      const search = backdrop.querySelector('#swap-search');
      if (search) {
        search.addEventListener('input', function () {
          const query = search.value.trim().toLowerCase();
          let visible = 0;
          backdrop.querySelectorAll('[data-swap-index]').forEach(function (button) {
            const match = !query || button.dataset.swapSearch.indexOf(query) >= 0;
            button.classList.toggle('hidden', !match);
            if (match) visible += 1;
          });
          const empty = backdrop.querySelector('#swap-no-results');
          if (empty) empty.classList.toggle('hidden', visible !== 0);
        });
      }
      backdrop.querySelectorAll('[data-swap-index]').forEach(function (button) {
        button.addEventListener('click', function () {
          requestExerciseSwap(state.swap.options[Number(button.dataset.swapIndex)]);
        });
      });
    }

    function latestSwapSet(option, set) {
      return (option.latestSets || []).find(function (prior) {
        return Number(prior.set) === Number(set.set) && String(prior.type) === String(set.type);
      }) || null;
    }

    function swapSetSummary(set, prior) {
      if (!prior) return 'Set ' + text(set.set) + ' · ' + text(set.type) + ': no previous match (values will be blank)';
      const load = isBlank(prior.weight) ? '— kg' : text(prior.weight) + ' kg';
      const reps = isBlank(prior.reps) ? '— reps' : text(prior.reps) + ' reps';
      const rir = isBlank(prior.rir) ? '— RIR' : text(prior.rir) + ' RIR';
      return 'Set ' + text(set.set) + ' · ' + text(set.type) + ': ' + load + ' × ' + reps + ' · ' + rir;
    }

    function requestExerciseSwap(option) {
      const swap = state.swap;
      const exercise = activeSwapExercise();
      if (!swap || !exercise || !option) return;
      const preview = exercise.sets.map(function (set) {
        return '<li>' + swapSetSummary(set, latestSwapSet(option, set)) + '</li>';
      }).join('');
      updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="swap-confirm-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Confirm swap</p><h2 id="swap-confirm-title">' + text(exercise.name) + ' → ' + text(option.name) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Cancel swap">×</button></div><p class="confirm-copy">The set count, set numbers and set types stay the same. Weight, reps and RIR use the latest logged entry for this exercise where available, even if it came from another session. Unmatched values become blank and completion ticks reset.</p><ul class="swap-preview">' + preview + '</ul><div class="confirm-actions"><button id="back-to-swap-options" class="button" type="button">Back</button><button data-tour="confirm-exercise-swap" id="confirm-exercise-swap" class="button button-primary" type="button">Swap exercise</button></div></section>');
      document.getElementById('back-to-swap-options').addEventListener('click', renderSwapModal);
      document.getElementById('confirm-exercise-swap').addEventListener('click', function () { applyExerciseSwap(option); });
    }

    function applyExerciseSwap(option) {
      const unavailable = swapUnavailableReason();
      if (unavailable) {
        closeModal();
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      const swap = state.swap;
      const exercise = activeSwapExercise();
      if (!swap || !exercise || !option) return;
      const duplicate = state.draft.exercises.some(function (item) { return item.id !== exercise.id && item.name === option.name; });
      if (duplicate) {
        setStatus('error', option.name + ' is already in this workout, so it cannot replace ' + exercise.name + '.');
        closeModal();
        render();
        return;
      }
      const oldName = exercise.name;
      closeModal();
      changeDraft(function () {
        exercise.name = option.name;
        exercise.cue = option.cue || '';
        exercise.note = '';
        exercise.primaryMuscle = option.primaryMuscle || '';
        exercise.sets.forEach(function (set) {
          const prior = latestSwapSet(option, set);
          state.previousBySetId[set.id] = prior ? {
            weight: prior.weight,
            reps: prior.reps,
            rir: prior.rir,
            type: prior.type
          } : null;
          set.weight = normalisedWeight(exercise, prior ? prior.weight : null);
          set.reps = prior ? prior.reps : null;
          set.rir = prior ? prior.rir : null;
          set.notes = '';
          set.completed = false;
        });
        state.exerciseCueBaselines[exercise.id] = String(option.cue || '').trim();
      }, false);
      state.history = null;
      state.swap = null;
      setStatus('success', oldName + ' was swapped for ' + option.name + '. The draft is being saved to Today.');
      render();
    }

    function showAddExercise() {
      if (!state.draft) return;
      if (state.draft.pendingBatch) { showPendingExercises(); return; }
      const unavailable = draftMutationUnavailableReason('Adding an exercise');
      if (unavailable) { setStatus('error', unavailable); renderStatusOnly(); return; }
      openModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Add exercise</p><h2 id="add-exercise-title">What would you like to add?</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close add exercise">×</button></div><div class="confirm-actions"><button id="choose-pending-exercises" class="button button-primary" type="button">Pending exercises</button><button id="choose-library-exercise" class="button" type="button">Exercise library</button></div></section>', 'add-exercise-choice');
      document.getElementById('choose-pending-exercises').addEventListener('click', showPendingExercises);
      document.getElementById('choose-library-exercise').addEventListener('click', showExerciseLibrary);
    }

    async function showExerciseLibrary() {
      if (!state.draft || state.addExerciseLoading) return;
      if (state.draft.pendingBatch) {
        setStatus('error', 'This pending batch can only include pending exercises from ' + state.draft.sessionType + ' · Week ' + state.draft.week + '.');
        renderStatusOnly();
        return;
      }
      const unavailable = draftMutationUnavailableReason('Adding an exercise');
      if (unavailable) {
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      if (allSetCount() >= MAX_SET_ROWS) {
        setStatus('error', 'Today can hold at most ' + MAX_SET_ROWS + ' sets. Complete this workout or continue in Google Sheets before adding an exercise.');
        renderStatusOnly();
        return;
      }
      openModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Add exercise</p><h2 id="add-exercise-title">Choose from your library</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close exercise picker">×</button></div><div class="app-loading swap-loading"><span class="spinner"></span><p>Loading exercises…</p></div></section>', 'add-exercise');
      const requestId = state.addExerciseRequestId + 1;
      state.addExerciseRequestId = requestId;
      state.addExerciseLoading = true;
      state.addExercise = null;
      const requestContext = {
        requestId: requestId,
        draftId: state.draft.draftId,
        sessionType: state.draft.sessionType
      };
      try {
        const response = await rpc('webGetAddExerciseOptions', {
          clientRequestId: clientRequestId('add-exercise-options'),
          sessionType: requestContext.sessionType
        });
        if (!addExerciseRequestIsCurrent(requestContext)) return;
        const usedNames = {};
        state.draft.exercises.forEach(function (exercise) { usedNames[exercise.name] = true; });
        const data = response.data || {};
        state.addExercise = {
          requestId: requestId,
          draftId: requestContext.draftId,
          sessionType: requestContext.sessionType,
          kind: 'library',
          title: 'Choose from your library',
          eyebrow: 'Add exercise',
          emptyMessage: 'Every exercise in the Exercises tab is already in this workout.',
          options: (Array.isArray(data.options) ? data.options : []).filter(function (option) {
            return option && option.name && !usedNames[option.name];
          })
        };
        renderAddExerciseModal();
      } catch (error) {
        if (addExerciseRequestIsCurrent(requestContext)) {
          updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Add exercise</p><h2 id="add-exercise-title">Exercise library unavailable</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close exercise picker">×</button></div><div class="status-banner error">' + text(asErrorMessage(error, 'load exercises')) + '</div></section>');
        }
      } finally {
        if (state.addExerciseRequestId === requestId) state.addExerciseLoading = false;
      }
    }

    async function showPendingExercises() {
      if (!state.draft || state.addExerciseLoading) return;
      const unavailable = draftMutationUnavailableReason('Adding a pending exercise');
      if (unavailable) { setStatus('error', unavailable); renderStatusOnly(); return; }
      openModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Pending exercises</p><h2 id="add-exercise-title">Loading pending exercises…</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close pending exercises">×</button></div><div class="app-loading swap-loading"><span class="spinner"></span><p>Loading pending exercises…</p></div></section>', 'add-exercise');
      const requestId = state.addExerciseRequestId + 1;
      state.addExerciseRequestId = requestId;
      state.addExerciseLoading = true;
      state.addExercise = null;
      const requestContext = { requestId: requestId, draftId: state.draft.draftId, sessionType: state.draft.sessionType };
      try {
        const response = await rpc('webGetPendingExerciseOptions', { clientRequestId: clientRequestId('pending-exercise-options') });
        if (!addExerciseRequestIsCurrent(requestContext)) return;
        const usedNames = {};
        state.draft.exercises.forEach(function (exercise) { usedNames[exercise.name] = true; });
        const data = response.data || {};
        const eligibleOptions = pendingOptionsForDraft(data.options, state.draft);
        state.addExercise = {
          requestId: requestId, draftId: requestContext.draftId, sessionType: requestContext.sessionType,
          kind: 'pending',
          eyebrow: 'Pending exercises', title: 'Choose what to do today',
          emptyMessage: state.draft.pendingBatch
            ? 'There are no other open pending exercises from ' + state.draft.sessionType + ' · Week ' + state.draft.week + '.'
            : 'There are no open pending exercises.',
          options: eligibleOptions.filter(function (option) { return !usedNames[option.name]; })
        };
        renderAddExerciseModal();
      } catch (error) {
        if (addExerciseRequestIsCurrent(requestContext)) {
          updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Pending exercises</p><h2>Pending exercises unavailable</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close pending exercises">×</button></div><div class="status-banner error">' + text(asErrorMessage(error, 'load pending exercises')) + '</div></section>');
        }
      } finally {
        if (state.addExerciseRequestId === requestId) state.addExerciseLoading = false;
      }
    }

    function addExerciseRequestIsCurrent(context) {
      const backdrop = document.getElementById('modal-backdrop');
      if (!context || !state.draft || state.addExerciseRequestId !== context.requestId) return false;
      if (!backdrop || backdrop.dataset.modalOwner !== 'add-exercise') return false;
      return state.draft.draftId === context.draftId && state.draft.sessionType === context.sessionType;
    }

    function activeAddExercisePicker() {
      const picker = state.addExercise;
      const backdrop = document.getElementById('modal-backdrop');
      if (draftMutationUnavailableReason('Adding an exercise') || !picker || !state.draft || state.addExerciseRequestId !== picker.requestId) return null;
      if (!backdrop || backdrop.dataset.modalOwner !== 'add-exercise') return null;
      if (state.draft.draftId !== picker.draftId || state.draft.sessionType !== picker.sessionType) return null;
      return picker;
    }

    function renderAddExerciseModal() {
      const picker = activeAddExercisePicker();
      if (!picker) return;
      const options = picker.options || [];
      updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">' + text(picker.eyebrow || 'Add exercise') + '</p><h2 id="add-exercise-title">' + text(picker.title || 'Choose an exercise') + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Close exercise picker">×</button></div>' +
        (options.length ? '<label class="visually-hidden" for="add-exercise-search">Search exercises</label><input id="add-exercise-search" class="swap-search" type="search" placeholder="Search exercises…" autocomplete="off"><div class="swap-list">' + options.map(function (option, index) {
          const latestSets = option.latestSets || [];
          const detail = latestSets.length ? 'Use latest ' + latestSets.length + '-set workout' + (latestSets[0].date ? ' · ' + text(latestSets[0].date) : '') : 'Start with one blank standard set';
          return '<button class="swap-option" type="button" data-add-exercise-index="' + index + '" data-add-exercise-search="' + attr((option.name + ' ' + (option.primaryMuscle || '')).toLowerCase()) + '"><span><strong>' + text(option.name) + '</strong><small>' + text(option.primaryMuscle || 'Exercise') + ' · ' + detail + (option.pendingSession ? ' · originally ' + text(option.pendingSession) + ' week ' + text(option.pendingWeek) : '') + '</small></span><span aria-hidden="true">›</span></button>';
        }).join('') + '</div><p id="add-exercise-no-results" class="history-empty hidden">No exercises match that search.</p>' : '<p class="history-empty">' + text(picker.emptyMessage || 'No exercises are available.') + '</p>') +
      '</section>');
      bindAddExerciseModal();
    }

    function bindAddExerciseModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const picker = activeAddExercisePicker();
      if (!backdrop || !picker) return;
      const search = backdrop.querySelector('#add-exercise-search');
      if (search) {
        search.addEventListener('input', function () {
          const query = search.value.trim().toLowerCase();
          let visible = 0;
          backdrop.querySelectorAll('[data-add-exercise-index]').forEach(function (button) {
            const match = !query || button.dataset.addExerciseSearch.indexOf(query) >= 0;
            button.classList.toggle('hidden', !match);
            if (match) visible += 1;
          });
          const empty = backdrop.querySelector('#add-exercise-no-results');
          if (empty) empty.classList.toggle('hidden', visible !== 0);
        });
      }
      backdrop.querySelectorAll('[data-add-exercise-index]').forEach(function (button) {
        button.addEventListener('click', function () {
          requestAddExercise(picker.options[Number(button.dataset.addExerciseIndex)]);
        });
      });
    }

    function addExerciseSetSummary(set) {
      const load = isBlank(set.weight) ? '— kg' : text(set.weight) + ' kg';
      const reps = isBlank(set.reps) ? '— reps' : text(set.reps) + ' reps';
      const rir = isBlank(set.rir) ? '— RIR' : text(set.rir) + ' RIR';
      return 'Set ' + text(set.set) + ' · ' + text(set.type || 'W') + ': ' + load + ' × ' + reps + ' · ' + rir;
    }

    function requestAddExercise(option) {
      const picker = activeAddExercisePicker();
      if (!picker || !option) return;
      if (state.draft.pendingBatch && (picker.kind !== 'pending' || !pendingOptionMatchesBatch(option, state.draft))) {
        closeModal();
        setStatus('error', 'This pending batch can only include exercises from ' + state.draft.sessionType + ' · Week ' + state.draft.week + '.');
        render();
        return;
      }
      const sets = Array.isArray(option.latestSets) && option.latestSets.length
        ? option.latestSets
        : [{ set: 1, type: 'W', weight: null, reps: null, rir: null }];
      const wouldExceedCapacity = allSetCount() + sets.length > MAX_SET_ROWS;
      updateModal('<section class="bottom-sheet swap-sheet" role="dialog" aria-modal="true" aria-labelledby="add-exercise-confirm-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Confirm exercise</p><h2 id="add-exercise-confirm-title">Add ' + text(option.name) + '?</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Cancel adding exercise">×</button></div><p class="confirm-copy">' + (option.latestSets && option.latestSets.length ? 'The set structure and values come from this exercise’s latest logged workout. Completion ticks reset.' : 'No logged workout was found, so this starts with one blank standard set.') + ' This changes only the current workout and Today; Programs stays unchanged.</p><ul class="swap-preview">' + sets.map(function (set) { return '<li>' + addExerciseSetSummary(set) + '</li>'; }).join('') + '</ul>' + (wouldExceedCapacity ? '<div class="status-banner error">These sets would exceed Today’s ' + MAX_SET_ROWS + '-row limit.</div>' : '') + '<div class="confirm-actions"><button id="back-to-add-exercise-options" class="button" type="button">Back</button><button id="confirm-add-exercise" class="button button-primary" type="button"' + (wouldExceedCapacity ? ' disabled' : '') + '>Add exercise</button></div></section>');
      document.getElementById('back-to-add-exercise-options').addEventListener('click', renderAddExerciseModal);
      document.getElementById('confirm-add-exercise').addEventListener('click', function () { applyAddExercise(option); });
    }

    function applyAddExercise(option) {
      const unavailable = draftMutationUnavailableReason('Adding an exercise');
      if (unavailable) {
        closeModal();
        setStatus('error', unavailable);
        renderStatusOnly();
        return;
      }
      // Keep the picker context before closing its modal. closeModal() clears
      // state.addExercise to invalidate stale requests, but a confirmed option
      // still needs to know whether it came from the pending picker.
      const picker = activeAddExercisePicker();
      if (!picker || !option) return;
      if (state.draft.exercises.some(function (exercise) { return exercise.name === option.name; })) {
        closeModal();
        setStatus('error', option.name + ' is already in this workout.');
        render();
        return;
      }
      let added = null;
      closeModal();
      changeDraft(function (draft) {
        if (picker.kind === 'pending' && !adoptPendingBatchOrigin(draft, option)) return;
        added = appendExerciseFromOption(draft, option);
        if (added) {
          state.focusedId = added.id;
          state.exerciseCueBaselines[added.id] = String(added.cue || '').trim();
          added.sets.forEach(function (set, index) {
            const prior = option.latestSets && option.latestSets[index];
            state.previousBySetId[set.id] = prior ? {
              weight: prior.weight,
              reps: prior.reps,
              rir: prior.rir,
              type: prior.type
            } : null;
          });
        }
      }, false);
      if (!added) {
        setStatus('error', 'This exercise could not be added. It may already be present or exceed Today’s row limit.');
        render();
        return;
      }
      state.history = null;
      setStatus('success', added.name + ' was added to ' + (state.draft.pendingBatch ? 'Pending from ' + state.draft.sessionType + ' · Week ' + state.draft.week : 'this workout') + '. Programs was not changed.');
      render();
    }

    function invalidateSwapRequest() {
      state.swapRequestId += 1;
      state.swapLoading = false;
      state.swap = null;
    }

    function invalidateAddExerciseRequest() {
      state.addExerciseRequestId += 1;
      state.addExerciseLoading = false;
      state.addExercise = null;
    }

    function invalidateExerciseCueSave() {
      state.exerciseCueRequestId += 1;
      state.exerciseCueSaving = false;
    }

    function openModal(html, owner) {
      closeModal();
      const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop'; backdrop.id = 'modal-backdrop'; backdrop.dataset.modalOwner = owner || ''; backdrop.innerHTML = html;
      backdrop.addEventListener('click', function (event) {
        if (state.exerciseCueSaving && backdrop.dataset.modalOwner === 'exercise-cue') return;
        if (event.target === backdrop || event.target.closest('[data-dismiss-modal]')) closeModal();
      });
      document.body.appendChild(backdrop);
      const firstButton = backdrop.querySelector('button'); if (firstButton) firstButton.focus();
    }
    function updateModal(html) { const backdrop = document.getElementById('modal-backdrop'); if (backdrop) backdrop.innerHTML = html; }
    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (backdrop && backdrop.dataset.modalOwner === 'swap') invalidateSwapRequest();
      if (backdrop && backdrop.dataset.modalOwner === 'add-exercise') invalidateAddExerciseRequest();
      if (backdrop && backdrop.dataset.modalOwner === 'exercise-cue') invalidateExerciseCueSave();
      if (backdrop) backdrop.remove();
    }

    function requestCardioCompletion() {
      const draft = state.cardioDraft;
      if (!draft || state.completing || state.saved) return;
      const duration = Number(draft.durationMinutes);
      const rpe = draft.rpe === null ? null : Number(draft.rpe);
      if (!Number.isFinite(duration) || duration <= 0 || rpe === null
          || !Number.isFinite(rpe) || rpe < 0 || rpe > 10) {
        setStatus('error', 'Enter a duration greater than zero and an RPE from 0 to 10 before completing Cardio.');
        renderStatusOnly();
        return;
      }
      const distance = isBlank(draft.distanceKm) ? '' : ' · ' + text(draft.distanceKm) + ' km';
      openModal('<section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="cardio-complete-title"><div class="sheet-handle"></div><div class="sheet-header"><div><p class="eyebrow">Ready to save?</p><h2 id="cardio-complete-title">Complete ' + text(draft.activity) + '</h2></div><button class="button icon-button" type="button" data-dismiss-modal aria-label="Cancel completion">×</button></div><p class="confirm-copy">This saves one ' + (draft.type === 'HIIT' ? 'H / HIIT' : 'M / MISS') + ' Cardio session: ' + text(draft.durationMinutes) + ' min' + distance + ' · RPE ' + text(draft.rpe) + '. It will append to LogCardio without changing Today or your planned sessions.</p><div class="confirm-actions"><button class="button" type="button" data-dismiss-modal>Keep logging</button><button id="confirm-cardio-complete" class="button button-primary" type="button">Complete cardio</button></div></section>');
      document.getElementById('confirm-cardio-complete').addEventListener('click', completeCardio);
    }

    async function completeCardio() {
      if (!state.cardioDraft || state.completing || state.saved) return;
      closeModal();
      state.completing = true;
      setStatus('info', 'Saving your Cardio session…');
      render();
      try {
        await flushCheckpoint();
        if (!state.submissionId) state.submissionId = uuid('cardio-submission');
        const draft = snapshotActiveDraft();
        const response = await rpc('webCompleteCardio', {
          clientRequestId: clientRequestId('cardio-complete'),
          draft: draft,
          expectedRevision: draft.revision,
          submissionId: state.submissionId
        });
        state.saved = response.data || {};
        state.cardioDraft = null;
        state.dirty = false;
        state.completing = false;
        setStatus(null);
        render();
      } catch (error) {
        state.completing = false;
        setStatus('error', asErrorMessage(error, 'complete Cardio'), error.code);
        render();
      }
    }

    function requestCompletion() {
      if (state.completing || state.saved) return;
      if (state.exerciseCueSaving) {
        setStatus('error', 'Completion is paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      const total = allSetCount();

    function requestWorkoutSkip() {

    async function completeWorkout(options) {
      options = options || {};
      if (state.exerciseCueSaving) {
        setStatus('error', 'Completion is paused while the exercise cue is being saved.');
        renderStatusOnly();
        return;
      }
      if (options.intentionalSkip === true) {
        const unavailable = skipWorkoutUnavailableReason();
        if (unavailable) {
          closeModal();
          setStatus('error', unavailable);
          renderStatusOnly();
          return;
        }
      }
      closeModal();
      invalidateSwapRequest();
      invalidateAddExerciseRequest();
      if (options.intentionalSkip === true) {
        markWorkoutIntentionallySkipped(state.draft);
        state.dirty = true;
        state.editEpoch += 1;
      }
      state.completing = true; setStatus('info', 'Saving your workout…'); render();
      try {
        await flushCheckpoint();
        if (!state.submissionId) state.submissionId = uuid('submission');
        const draft = snapshotDraft();
        const completionSummary = buildCompletionSummary(draft, state.completionContext);
        const response = await rpc('webCompleteWorkout', {
          clientRequestId: clientRequestId('complete'),
          draft: draft,
          expectedRevision: draft.revision,
          submissionId: state.submissionId,
          completionSummary: completionSummary
        });
        state.saved = Object.assign({}, response.data || {});
        if (!state.saved.completionSummary) state.saved.completionSummary = completionSummary;
        state.dirty = false;
        state.completing = false;
        setStatus(null);
        render();
      } catch (error) {
        state.completing = false;
        setStatus('error', asErrorMessage(error, 'complete the workout'), error.code);
        render();
      }
    }

    function completionDateLabel(value) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return String(value || '');
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return Number(match[3]) + ' ' + months[Number(match[2]) - 1] + ' ' + match[1];
    }

    function completionValue(value) {
      const rounded = completionRound(value);
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function completionRecordContext(record) {
      if (record.previousWeight === null || record.previousWeight === undefined) return '';
      if (Number(record.weight) === Number(record.previousWeight)) {
        const moreReps = Number(record.reps) - Number(record.previousReps || 0);
        return moreReps > 0 ? ' · ' + completionValue(moreReps) + ' more rep' + (moreReps === 1 ? '' : 's') : '';
      }
      if (/assisted/i.test(String(record.exercise || ''))) {
        const lessAssistance = Math.abs(Number(record.previousWeight)) - Math.abs(Number(record.weight));
        return lessAssistance > 0 ? ' · ' + completionValue(lessAssistance) + ' kg less assistance' : '';
      }
      const heavier = Number(record.weight) - Number(record.previousWeight);
      return heavier > 0 ? ' · ' + completionValue(heavier) + ' kg heavier' : '';
    }

    function completionMuscleLevel(rows, muscle) {
      const values = (rows || []).map(function (item) { return Number(item.sets) || 0; });
      const max = values.length ? Math.max.apply(null, values) : 0;
      const match = (rows || []).find(function (item) { return item.muscle === muscle; });
      const value = match ? Number(match.sets) || 0 : 0;
      if (!value || !max) return 0;
      if (value / max > .66) return 3;
      if (value / max > .33) return 2;
      return 1;
    }
