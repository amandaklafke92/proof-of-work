<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a18">
<title>Workout Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/driver.css">
<script defer src="https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/driver.js.iife.js"></script>
<style>
  :root {
    --ink: #132019;
    --muted: #68746d;
    --paper: #f7f8f4;
    --surface: #ffffff;
    --surface-soft: #e6ece8;
    --line: #d8e1da;
    --accent: #157451;
    --accent-deep: #0f6847;
    --accent-soft: #dcefe5;
    --danger: #c23d3d;
    --danger-soft: #f9e7e5;
    --warning: #9a5a00;
    --warning-soft: #fff1d8;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(29, 53, 40, .16);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--paper); }
  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    background: #edf1ed;
    color: var(--ink);
    font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid #ffbd59;
    outline-offset: 2px;
  }
  .app-shell { position: relative; width: min(100%, 430px); margin: 0 auto; min-height: 100vh; overflow: hidden; background: var(--paper); padding-bottom: 116px; }
  .app-loading, .status-card {
    min-height: 60vh; display: grid; place-content: center; gap: 12px; text-align: center; padding: 30px; color: var(--muted);
  }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .visually-hidden { position: absolute; height: 1px; width: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; }

  .topbar { padding: max(15px, env(safe-area-inset-top)) 16px 8px; background: var(--paper); }
  .dashboard-header { padding: max(22px, env(safe-area-inset-top)) 22px 19px; background: #193b2f; color: #f5faf7; }
  .dashboard-brand { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; opacity: .78; }
  .dashboard-meso { margin: 22px 0 5px; font-size: 13px; opacity: .72; }
  .dashboard-week-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dashboard-week-row h1 { margin: 0; font-size: 30px; letter-spacing: -.025em; line-height: 1.1; }
  .dashboard-week-chip { flex: 0 0 auto; border-radius: 999px; padding: 6px 10px; background: rgba(255,255,255,.11); font-size: 12px; font-weight: 650; }
  .dashboard-progress-copy { margin: 10px 0 8px; font-size: 13px; opacity: .76; }
  .dashboard-progress { height: 6px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.14); }
  .dashboard-progress span { display: block; height: 100%; border-radius: inherit; background: #55c78f; transition: width 180ms ease; }
  .dashboard-content { padding: 16px 14px 28px; }
  .dashboard-pending { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 16px; padding: 12px 14px; background: var(--warning-soft); color: #684b00; text-align: left; }
  .dashboard-pending strong, .dashboard-pending small { display: block; }
  .dashboard-pending strong { font-size: 14px; font-weight: 750; }
  .dashboard-pending small { margin-top: 2px; font-size: 12px; opacity: .78; }
  .dashboard-pending b { font-size: 25px; font-weight: 400; line-height: .7; }
  .deload-banner { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warning); }
  .deload-source { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
  .deload-message { margin: 6px 0 0; padding: 7px 9px; border-radius: 9px; background: var(--warning-soft); color: var(--warning); font-size: 12.5px; }
  .deload-message.is-info { background: var(--accent-soft); color: var(--accent-deep); }
  .dashboard-week-chip.is-deload { background: var(--warning-soft); color: var(--warning); }
  .dashboard-deload-copy { margin: 12px 4px 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-deep); font-size: 13px; }
  .dashboard-advance { display: block; width: 100%; margin-top: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--accent-deep); font: inherit; font-weight: 650; cursor: pointer; }
  .dashboard-advance.is-suggested { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dashboard-advance[disabled] { opacity: .55; cursor: default; }
  .dashboard-advance-confirm { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--warning-soft); }
  .dashboard-advance-confirm .confirm-copy { margin: 0 0 10px; color: var(--warning); }
  .dashboard-advance-confirm .dashboard-advance { margin-top: 8px; }
  .dashboard-list-label { margin: 16px 4px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .dashboard-session-list { overflow: hidden; border-radius: 20px; background: var(--surface); box-shadow: 0 6px 20px rgba(33,57,45,.07); }
  .dashboard-session-row { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #e4e9e6; padding: 12px 15px; background: transparent; color: var(--ink); text-align: left; }
  .dashboard-session-row:last-child { border-bottom: 0; }
  .dashboard-session-row:disabled { cursor: wait; opacity: .58; }
  .dashboard-session-row > span:last-child { min-width: 0; }
  .dashboard-session-row strong, .dashboard-session-row small { display: block; }
  .dashboard-session-row strong { font-size: 17px; font-weight: 700; }
  .dashboard-session-row small { margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .dashboard-status { flex: 0 0 auto; display: inline-grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; font-size: 17px; font-weight: 800; }
  .dashboard-status-completed { background: #d7f3e4; color: #17643e; }
  .dashboard-status-in-progress { background: #e6ecff; color: #3658a8; font-size: 13px; }
  .dashboard-status-skipped { background: #e9ecea; color: #68726c; }
  .dashboard-status-not-started { border: 2px solid #b8c2bc; }
  .dashboard-cardio { margin-top: 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 6px 20px rgba(33,57,45,.07); overflow: hidden; }
  .dashboard-cardio-row { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; padding: 14px 15px; background: transparent; color: var(--ink); text-align: left; }
  .dashboard-cardio-row:disabled { cursor: wait; opacity: .58; }
  .dashboard-cardio-status { flex: 0 0 auto; display: inline-grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); font-size: 19px; font-weight: 800; line-height: 1; }
  .dashboard-cardio-body { min-width: 0; flex: 1 1 auto; display: grid; gap: 6px; }
  .dashboard-cardio-heading { display: flex; align-items: center; gap: 12px; }
  .dashboard-cardio-heading h2 { margin: 0; }
  .dashboard-cardio-total { margin: 0; color: var(--ink); font-size: 14px; font-weight: 650; }
  .dashboard-cardio-split { display: flex; gap: 8px; margin: 0; color: var(--muted); font-size: 12px; }
  .dashboard-cardio-split span { border-radius: 999px; padding: 5px 9px; background: var(--surface-soft); }
  .dashboard-cardio-split b { color: var(--accent-deep); }
  .eyebrow { color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 3px; }
  .topbar-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1, h2, h3, p { margin-top: 0; }
  h1, h2, h3 { font-family: inherit; }
  h1 { font-size: 25px; line-height: 1.08; letter-spacing: -.03em; margin-bottom: 4px; font-weight: 600; }
  h2 { font-size: 21px; line-height: 1.14; letter-spacing: -.025em; margin-bottom: 4px; font-weight: 600; }
  h3 { font-size: 15px; margin-bottom: 5px; font-weight: 600; }
  .meta-line, .small { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .session-badge { background: var(--accent-soft); color: var(--accent-deep); border-radius: 999px; padding: 7px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .content { padding: 4px 14px; }
  .workout-content { padding: 2px 0 0; }
  .card { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .setup-card { padding: 18px; }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label, .field-label { color: var(--muted); font-weight: 750; font-size: 12px; letter-spacing: .025em; }
  input, select, textarea { width: 100%; min-height: 46px; border: 1px solid #cfd5d1; border-radius: 11px; background: var(--surface); color: var(--ink); padding: 10px 11px; }
  textarea { min-height: 78px; resize: vertical; line-height: 1.35; }
  input[type="number"] { font-size: 18px; font-weight: 700; }
  .button {
    appearance: none; border: 0; min-height: 48px; border-radius: 12px; padding: 10px 15px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-weight: 720; color: var(--ink); background: #e8ebe9;
  }
  .button:hover { filter: brightness(.97); }
  .button:disabled { opacity: .55; cursor: not-allowed; }
  .button-primary { background: var(--accent); color: #fff; }
  .button-danger { background: var(--danger); color: #fff; }
  .button-danger-soft { background: var(--danger-soft); color: #9f2d2d; }
  .button-quiet { background: transparent; color: var(--accent-deep); padding-inline: 8px; }
  .button-block { width: 100%; }
  .button-sm { min-height: 38px; font-size: 13px; padding: 8px 11px; }
  .icon-button { width: 42px; min-width: 42px; min-height: 42px; border-radius: 50%; padding: 0; }
  .setup-actions { margin-top: 14px; display: flex; gap: 10px; }

  .workout-header { padding: 13px 16px 7px; border-bottom: 1px solid rgba(216, 225, 218, .72); }
  .workout-header .topbar-row { align-items: center; }
  .workout-context { min-width: 0; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "label label" "session meta"; column-gap: 9px; align-items: center; }
  .workout-context .eyebrow { grid-area: label; }
  .session-heading { grid-area: session; display: inline-flex; align-items: center; margin: 0; }
  .session-selector { width: auto; min-width: 72px; min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); padding: 3px 27px 3px 8px; font-size: 15px; font-weight: 650; line-height: 1; letter-spacing: 0; box-shadow: none; }
  .cardio-session-label { font-size: 16px; font-weight: 700; }
  .workout-context .meta-line { grid-area: meta; margin: 0; white-space: nowrap; font-size: 11px; }
  .header-action { min-height: 36px; font-size: 12px; color: var(--accent); }
  .cardio-dashboard-link { display: inline-block; margin: 0 0 5px; border: 0; padding: 0; background: transparent; color: var(--accent); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .cardio-dashboard-link:disabled { opacity: .55; cursor: wait; }
  .summary-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .summary-chip { background: transparent; border: 0; border-radius: 0; padding: 0; color: var(--muted); font-size: 10px; font-weight: 500; }
  .summary-chip + .summary-chip::before { content: "·"; padding-right: 5px; }
  .exercise-intro { padding: 17px 16px 6px; }
  .exercise-intro h1 { max-width: 390px; }
  .exercise-progress { margin: 0; color: var(--muted); font-size: 14px; }
  .exercise-rail-wrap { position: sticky; z-index: 3; top: 0; margin: 0; background: var(--paper); padding: 4px 16px 12px; }
  .exercise-rail { display: flex; gap: 8px; overflow-x: auto; padding: 0; scrollbar-width: none; }
  .exercise-rail::-webkit-scrollbar { display: none; }
  .exercise-tablist { display: contents; }
  .exercise-tab { position: relative; flex: 0 0 66px; width: 66px; min-height: 76px; padding: 0 4px 8px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; color: var(--muted); text-align: center; font-size: 11px; font-weight: 500; line-height: 1.12; }
  .exercise-tab[aria-selected="true"] { background: transparent; border-bottom-color: var(--accent); color: var(--ink); box-shadow: none; }
  .exercise-tab[aria-selected="true"]::after { content: none; }
  .exercise-tab.is-complete .avatar { background: var(--accent); color: #fff; }
  .avatar { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 4px; border-radius: 12px; background: #e2e9e4; color: #425149; font-size: 14px; font-weight: 600; }
  .tab-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-progress { display: none; }
  .exercise-add-card { appearance: none; flex: 0 0 66px; width: 66px; min-height: 76px; display: block; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; color: var(--accent-deep); padding: 0 4px 8px; text-align: center; font-size: 11px; font-weight: 500; line-height: 1.12; }
  .exercise-add-card::after { content: ""; display: block; height: 12.32px; }
  .exercise-add-box { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 4px; border-radius: 12px; background: #e2e9e4; font-size: 25px; font-weight: 400; line-height: 1; }
  .exercise-add-card:hover .exercise-add-box { background: #d8e3dc; }
  .exercise-add-card:disabled { opacity: .5; cursor: not-allowed; }

  .focus-card { padding: 0 12px 20px; margin: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
  .focus-heading { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .focus-heading h2 { max-width: 100%; margin-bottom: 2px; }
  .exercise-actions { display: flex; gap: 7px; overflow-x: auto; margin: 0 4px 14px; padding: 0; scrollbar-width: none; }
  .exercise-actions::-webkit-scrollbar { display: none; }
  .action-chip { flex: 0 0 auto; min-height: 36px; border: 0; border-radius: 999px; background: var(--surface-soft); color: var(--ink); padding: 8px 13px; font-size: 13px; font-weight: 500; }
  .action-chip:hover { background: #dce4df; }
  .compact-set-grid { margin-top: 0; }
  .cardio-grid .compact-set-header, .cardio-grid .cardio-row { grid-template-columns: 40px minmax(74px, 1fr) 56px 50px 50px; }
  .cardio-row { padding-inline: 0; }
  .cardio-focus-card { padding-top: 0; }
  .cardio-rail-wrap .exercise-rail { padding-bottom: 1px; }
  .compact-set-header, .compact-set-row {
    display: grid;
    grid-template-columns: 40px minmax(68px, 1fr) 48px 44px 38px 28px;
    gap: 5px;
    align-items: center;
  }
  .compact-set-header { min-height: 30px; color: var(--muted); font-size: 11px; font-weight: 500; text-align: center; }
  .compact-set-header span:nth-child(2) { text-align: center; }
  .compact-set-body { display: grid; gap: 5px; }
  .set-swipe-row { position: relative; min-width: 0; min-height: 54px; overflow: hidden; border-radius: 10px; touch-action: pan-y; }
  .compact-set-row { position: relative; z-index: 1; min-height: 54px; border-radius: 10px; background: var(--paper); transition: background .16s, transform .18s ease; will-change: transform; }
  .set-swipe-row.completed .compact-set-row { background: var(--paper); }
  .set-swipe-row.placeholder { opacity: .8; }
  .set-type-circle {
    appearance: none; display: grid; width: 38px; height: 38px; min-height: 38px; place-items: center;
    border: 0; border-radius: 50%; padding: 0; background: #e4e9e6; color: var(--ink);
    font-size: 13px; font-weight: 600;
  }
  .set-type-cell { display: grid; place-items: center; }
  .set-type-circle.standard { background: var(--accent-soft); color: var(--accent-deep); }
  .previous-performance { min-width: 0; display: grid; place-items: center; color: #405048; font-size: 11px; line-height: 1.15; text-align: center; }
  .previous-performance > span { display: block; max-width: 100%; }
  .previous-main { display: block; white-space: nowrap; }
  .previous-performance small { display: block; margin-top: 2px; color: #78847d; font-size: 10px; }
  .previous-empty { color: #95a19a; }
  .compact-input-cell { min-width: 0; }
  .compact-input-cell input {
    min-width: 0; min-height: 38px; height: 38px; border: 1px solid transparent; border-radius: 10px;
    appearance: textfield; -moz-appearance: textfield; padding: 0 4px; background: #e7ebe8; color: var(--ink); font-size: 13px; font-weight: 500; text-align: center;
  }
  .compact-input-cell input::-webkit-inner-spin-button,
  .compact-input-cell input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .compact-input-cell input:disabled { background: #f0f2f0; color: #89948e; }
  .set-complete-cell, .set-complete-cell label { display: grid; place-items: center; }
  .set-complete-checkbox { appearance: none; position: relative; width: 24px; height: 24px; min-height: 24px; border: 2px solid #6f7a74; border-radius: 6px; background: var(--surface); padding: 0; }
  .set-complete-checkbox:checked { border-color: var(--accent); background: var(--accent); }
  .set-complete-checkbox:checked::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; line-height: 1; }
  .placeholder-mark { color: var(--muted); text-align: center; }
  .add-set-row { display: grid; grid-template-columns: 40px 1fr; gap: 5px; align-items: center; min-height: 46px; margin-top: 6px; }
  .add-set-button { font-size: 22px; font-weight: 500; }
  .add-set-label { border: 0; background: transparent; color: var(--accent); padding: 8px 0; font-size: 12px; font-weight: 500; text-align: left; }
  .exercise-notes-stack { display: grid; gap: 9px; margin: 2px 4px 0; }
  .exercise-note-panel { width: 100%; margin: 0; border: 1px solid #d4ddd7; border-radius: 14px; background: var(--surface); color: var(--ink); padding: 13px 14px; text-align: left; }
  .exercise-note-heading { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
  .exercise-note-copy { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.35; white-space: pre-wrap; }
  .form-warning { color: var(--danger); font-size: 12px; margin: 7px 0 0; }

  .metadata-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metadata-grid .field.full { grid-column: 1 / -1; }
  .metadata-grid input, .metadata-grid select { min-height: 44px; }
  .sheet-link { color: var(--accent-deep); font-weight: 750; }
  .status-banner { border-radius: 13px; padding: 11px 12px; margin: 0 0 12px; font-size: 13px; line-height: 1.4; font-weight: 650; }
  .status-banner.info { background: #e8f0fb; color: #1b4d7d; }
  .status-banner.warning { background: var(--warning-soft); color: var(--warning); }
  .status-banner.error { background: var(--danger-soft); color: #8b2525; }
  .status-banner.success { background: var(--accent-soft); color: var(--accent-deep); }
  .workout-content > .status-banner { margin-inline: 16px; }
  .sticky-actions { position: fixed; z-index: 9; inset: auto 0 0; width: min(100%, 430px); margin-inline: auto; background: rgba(247,248,244,.94); backdrop-filter: blur(13px); border-top: 1px solid rgba(207,218,211,.85); padding: 10px max(14px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)); }
  .sticky-actions-inner { width: 100%; margin: auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .sheet-fallback { min-width: 47px; padding-inline: 12px; }

  .modal-backdrop { position: fixed; z-index: 12; inset: 0; background: rgba(14, 24, 19, .46); display: flex; align-items: end; justify-content: center; padding: 14px; }
  .bottom-sheet { width: min(430px, 100%); max-height: min(86vh, 720px); overflow: auto; border-radius: 24px 24px 0 0; background: var(--surface); box-shadow: 0 -12px 40px rgba(13, 31, 22, .2); padding: 10px 16px max(20px, env(safe-area-inset-bottom)); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 99px; margin: 0 auto 12px; background: #c7d1cb; }
  .sheet-header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .details-modal .metadata-grid { margin-top: 14px; }
  .swap-loading { min-height: 180px; }
  .swap-search { margin: 13px 0 10px; }
  .swap-list { display: grid; gap: 7px; }
  .swap-option { width: 100%; min-height: 58px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
  .swap-option:hover { border-color: #a8c2b4; background: #f7faf8; }
  .swap-option strong { display: block; font-size: 14px; }
  .swap-option small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
  .swap-preview { margin: 12px 0 0; padding: 12px 12px 12px 30px; border-radius: 13px; background: var(--surface-soft); color: #40514a; font-size: 12px; line-height: 1.55; }
  .history-list { list-style: none; padding: 0; margin: 13px 0 0; display: grid; gap: 8px; }

  if (draft.week !== null && (!Number.isInteger(draft.week) || draft.week < 0)) {
    add('week', 'week must be null or a non-negative integer.');
  }
  if (draft.energy !== null && typeof draft.energy !== 'string') {
    add('energy', 'energy must be null or a string.');
  }
  if (draft.focusedExerciseId !== null && typeof draft.focusedExerciseId !== 'string') {
    add('focusedExerciseId', 'focusedExerciseId must be null or a string.');
  }
  if (!Array.isArray(draft.exercises)) add('exercises', 'exercises must be an array.');

  const exerciseIds = {};
  const exerciseNames = {};
  const exerciseOrders = {};
  const setIds = {};
  const setOrders = {};
  let setCount = 0;
  let completedCount = 0;
  let persistableSetCount = 0;

  (Array.isArray(draft.exercises) ? draft.exercises : []).forEach(function (exercise, exerciseIndex) {
    const base = 'exercises[' + exerciseIndex + ']';
    if (!exercise.id) add(base + '.id', 'Exercise id is required.');
    else if (exerciseIds[exercise.id]) add(base + '.id', 'Exercise ids must be unique.');
    else exerciseIds[exercise.id] = true;
    if (exercise.id && exercise.id.length > 128) add(base + '.id', 'Exercise id must be 128 characters or fewer.');

    if (!Number.isInteger(exercise.order) || exercise.order < 0) {
      add(base + '.order', 'Exercise order must be a non-negative integer.');
    } else if (exerciseOrders[exercise.order]) {
      add(base + '.order', 'Exercise order values must be unique.');
    } else {
      exerciseOrders[exercise.order] = true;
    }

    if (!exercise.name) add(base + '.name', 'Exercise name is required.');
    else if (exerciseNames[exercise.name]) add(base + '.name', 'Exercise names must be unique within a draft.');
    else exerciseNames[exercise.name] = true;
    if (exercise.note !== undefined && typeof exercise.note !== 'string') {
      add(base + '.note', 'Exercise note must be a string.');
    } else if (String(exercise.note || '').length > 500) {
      add(base + '.note', 'Exercise note must be 500 characters or fewer.');
    }
    if (!Array.isArray(exercise.sets)) add(base + '.sets', 'Exercise sets must be an array.');

    (Array.isArray(exercise.sets) ? exercise.sets : []).forEach(function (set, setIndex) {
      const setBase = base + '.sets[' + setIndex + ']';
      setCount++;
      if (!set.id) add(setBase + '.id', 'Set id is required.');
      else if (setIds[set.id]) add(setBase + '.id', 'Set ids must be unique across the draft.');
      else setIds[set.id] = true;
      if (set.id && set.id.length > 128) add(setBase + '.id', 'Set id must be 128 characters or fewer.');

      if (!Number.isInteger(set.order) || set.order < 0) {
        add(setBase + '.order', 'Set order must be a non-negative integer.');
      } else if (setOrders[set.order]) {
        add(setBase + '.order', 'Set order values must be unique across the draft.');
      } else {
        setOrders[set.order] = true;
      }

      if (!Number.isFinite(set.set) || set.set <= 0) add(setBase + '.set', 'Set number must be greater than zero.');
      if (!set.type) add(setBase + '.type', 'Set type is required.');
      if (set.weight !== null && !Number.isFinite(set.weight)) {
        add(setBase + '.weight', 'weight must be null or a finite number.');
      }
      ['reps', 'rir'].forEach(function (field) {
        const value = set[field];
        if (value !== null && (!Number.isFinite(value) || value < 0)) {
          add(setBase + '.' + field, field + ' must be null or a non-negative finite number.');
        }
      });
      if (typeof set.completed !== 'boolean') add(setBase + '.completed', 'completed must be a boolean.');
      if (draft.intentionalSkip === true) {
        if (set.type !== 'SKIP') {
          add(setBase + '.type', 'An intentionally skipped workout must persist every planned set as SKIP.');
        }
        if (set.weight !== null || set.reps !== null || set.rir !== null) {
          add(setBase, 'An intentionally skipped workout must blank weight, reps and RIR.');
        }
      }
      if (set.completed === true) completedCount++;
      if (set.completed === true || set.type === 'PENDING' || set.type === 'SKIP') persistableSetCount++;
    });
  });

  if (draft.focusedExerciseId !== null && !exerciseIds[draft.focusedExerciseId]) {
    add('focusedExerciseId', 'focusedExerciseId must identify an exercise in the draft.');
  }
  if (setCount > WORKOUT_TODAY_MAX_SET_ROWS) {
    add('exercises', 'A draft cannot contain more than ' + WORKOUT_TODAY_MAX_SET_ROWS + ' sets.');
  }
  if (options.forCompletion && persistableSetCount === 0) {
    add('exercises', 'At least one completed set or explicit PENDING/SKIP row is required to complete a workout.');
  }
  if (options.forCompletion && draft.sessionType === 'PENDING' && completedCount > 0) {
    add('sessionType', 'Completed working sets cannot use the Pending launcher as their session.');
  }
  if (draft.intentionalSkip === true && setCount === 0) {
    add('exercises', 'An intentionally skipped workout must include its planned sets.');
  }

  return {
    valid: errors.length === 0,
    errors: errors,
    setCount: setCount,
    completedSetCount: completedCount,
    persistableSetCount: persistableSetCount
  };
}

// Produce the one canonical payload used by the whole-workout skip action.
// Keep exercise/set identities and descriptive notes intact for recovery, but
// remove every performance value so this payload cannot become a baseline.
function buildIntentionallySkippedWorkoutDraftV1(rawDraft) {
  const draft = normalizeWorkoutDraftV1(rawDraft);
  draft.intentionalSkip = true;
  draft.exercises.forEach(function (exercise) {
    exercise.sets.forEach(function (set) {
      set.type = 'SKIP';
      set.weight = null;
      set.reps = null;
      set.rir = null;
      set.completed = false;
    });
  });
  return draft;
}

// Program rows can contain repeated/non-contiguous set numbers and exercises can
// be reorganised.  `set.order` is therefore the only authoritative flattening
// key; array nesting and set number are not used to determine Log row order.
function orderedWorkoutSetsV1(draft, options) {
  options = options || {};
  const out = [];
  (draft.exercises || []).forEach(function (exercise, exerciseIndex) {
    (exercise.sets || []).forEach(function (set, setIndex) {
      if (options.completedOnly
          && set.completed !== true
          && set.type !== 'PENDING'
          && set.type !== 'SKIP') return;
      out.push({
        exercise: exercise,
        set: set,
        exerciseIndex: exerciseIndex,
        setIndex: setIndex
      });
    });
  });
  out.sort(function (a, b) {
    if (a.set.order !== b.set.order) return a.set.order - b.set.order;
    if (a.exercise.order !== b.exercise.order) return a.exercise.order - b.exercise.order;
    if (a.exerciseIndex !== b.exerciseIndex) return a.exerciseIndex - b.exerciseIndex;
    return a.setIndex - b.setIndex;
  });
  return out;
}

function _workoutCoreSheetValue(value) {
  return value === null ? '' : value;
}

function buildWorkoutLogRowsV1(rawDraft, options) {
  options = options || {};
  const draft = normalizeWorkoutDraftV1(rawDraft);
  const validation = validateWorkoutDraftV1(draft, { forCompletion: options.completedOnly === true });
  if (!validation.valid) {
    const error = new Error('Workout draft validation failed.');
    error.name = 'WorkoutValidationError';
    error.validationErrors = validation.errors;
    throw error;
  }

  return orderedWorkoutSetsV1(draft, { completedOnly: options.completedOnly === true })
    .map(function (entry) {
      const set = entry.set;
      const placeholder = set.type === 'PENDING' || set.type === 'SKIP';
      return [
        draft.date,
        draft.sessionType,
        _workoutCoreSheetValue(draft.week),
        entry.exercise.name,
        set.set,
        set.type,
        placeholder ? '' : _workoutCoreSheetValue(set.weight),
        placeholder ? '' : _workoutCoreSheetValue(set.reps),
        placeholder ? '' : _workoutCoreSheetValue(set.rir),
        set.notes,
        draft.gymLocation
      ];
    });
}

function stableStringifyWorkoutV1(value) {
  if (value === null || typeof value !== 'object') return JSON.stringify(value);
  if (Array.isArray(value)) {
    return '[' + value.map(function (item) { return stableStringifyWorkoutV1(item); }).join(',') + ']';
  }
  const keys = Object.keys(value).sort();
  return '{' + keys.map(function (key) {
    return JSON.stringify(key) + ':' + stableStringifyWorkoutV1(value[key]);
  }).join(',') + '}';
}

function _workoutCoreYmdOrdinal(value) {
  const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return null;
  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  const timestamp = Date.UTC(year, month - 1, day);
  const date = new Date(timestamp);
  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) {
    return null;
  }
  return Math.floor(timestamp / 86400000);
}

// Resolve a selected date against inclusive meso intervals without local-time
// or daylight-saving drift. Overlap is an explicit configuration state; callers
// must not silently choose one of two matching mesos.
function resolveWorkoutMesoForDateV1(intervals, ymd) {
  const selectedDay = _workoutCoreYmdOrdinal(ymd);
  const matches = [];
  if (selectedDay !== null) {
    (Array.isArray(intervals) ? intervals : []).forEach(function (interval) {
      interval = interval || {};
      const meso = _workoutCoreString(interval.meso, true);
      const startDate = _workoutCoreString(interval.startDate, true);
      const endDate = _workoutCoreString(interval.endDate, true);
      const startDay = _workoutCoreYmdOrdinal(startDate);
      const endDay = _workoutCoreYmdOrdinal(endDate);
      if (!meso || startDay === null || endDay === null || endDay < startDay) return;
      if (selectedDay >= startDay && selectedDay <= endDay) {
        matches.push({
          meso: meso,
          startDate: startDate,
          endDate: endDate,
          week: Math.floor((selectedDay - startDay) / 7) + 1
        });
      }
    });
  }
  if (matches.length > 1) {
    return { status: 'overlap', meso: null, week: null, matches: matches };
  }
  if (matches.length === 1) {
    return {
      status: 'matched',
      meso: matches[0].meso,
      week: matches[0].week,
      matches: matches
    };
  }
  return { status: 'none', meso: null, week: null, matches: [] };
}

// A program-wide week is the baseline for every session. A session advances
// independently only when that exact session/week has a durable resolution in
// Log. Callers decide what constitutes a resolution; this keeps the rule ready
// for whole-workout skips without coupling this pure helper to Sheet row shape.
function resolveWorkoutSessionWeekV1(programWeek, sessionType, resolutions) {
  const week = _workoutCoreNumber(programWeek);
  const session = _workoutCoreString(sessionType, true);
  if (!Number.isInteger(week) || week < 1 || !session) return programWeek;
  const resolved = (Array.isArray(resolutions) ? resolutions : []).some(function (entry) {
    entry = entry || {};
    return entry.resolved === true
      && _workoutCoreString(entry.sessionType, true) === session
      && _workoutCoreNumber(entry.week) === week;
  });
  return resolved ? week + 1 : week;
}

// Programs columns: A=Meso, B=Session, C=Exercise, D=Set, E=Type.
// An exact resolved meso always wins even when a different meso is later in the
// document. With no resolved interval, the final matching Programs meso is the
// explicit legacy fallback. Row order is preserved in both cases.
function selectWorkoutProgramV1(programRows, sessionType, resolvedMeso) {
  const session = _workoutCoreString(sessionType, true);
  const matching = (Array.isArray(programRows) ? programRows : []).filter(function (row) {
    return Array.isArray(row)
      && _workoutCoreString(row[0], true)
      && _workoutCoreString(row[1], true) === session;
  });
  if (!matching.length) return null;
  const exactMeso = resolvedMeso === null || resolvedMeso === undefined
    ? '' : _workoutCoreString(resolvedMeso, true);
  const requestedMeso = exactMeso || _workoutCoreString(matching[matching.length - 1][0], true);
  const mesoKey = _workoutCoreMesoKey(requestedMeso);
  const rawLabels = [];
  matching.forEach(function (row) {
    const label = _workoutCoreString(row[0], true);
    if (_workoutCoreMesoKey(label) === mesoKey && rawLabels.indexOf(label) < 0) {
      rawLabels.push(label);
    }
  });
  if (rawLabels.length > 1) {
    const error = new Error('Multiple Programs meso labels resolve to the same logical meso.');
    error.name = 'WorkoutProgramAmbiguityError';
    error.mesoKey = mesoKey;
    error.labels = rawLabels;
    error.sessionType = session;
    throw error;
  }
  const meso = rawLabels.length ? rawLabels[0] : '';
  const rows = matching.filter(function (row) {
    return _workoutCoreString(row[0], true) === meso;
  });
  return rows.length ? { meso: meso, rows: rows } : null;
}

// Export only in the local Node harness. `module` is absent in Apps Script.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    WORKOUT_DRAFT_SCHEMA_VERSION: WORKOUT_DRAFT_SCHEMA_VERSION,
    WORKOUT_TODAY_MAX_SET_ROWS: WORKOUT_TODAY_MAX_SET_ROWS,
    CARDIO_DRAFT_SCHEMA_VERSION: CARDIO_DRAFT_SCHEMA_VERSION,
    CARDIO_TYPES: CARDIO_TYPES,
    normalizeCardioDraftV1: normalizeCardioDraftV1,
    validateCardioDraftV1: validateCardioDraftV1,
    buildCardioLogRowV1: buildCardioLogRowV1,
    normalizeWorkoutDraftV1: normalizeWorkoutDraftV1,
    validateWorkoutDraftV1: validateWorkoutDraftV1,
    buildIntentionallySkippedWorkoutDraftV1: buildIntentionallySkippedWorkoutDraftV1,
    orderedWorkoutSetsV1: orderedWorkoutSetsV1,
    buildWorkoutLogRowsV1: buildWorkoutLogRowsV1,
    stableStringifyWorkoutV1: stableStringifyWorkoutV1,
    resolveWorkoutMesoForDateV1: resolveWorkoutMesoForDateV1,
    resolveWorkoutSessionWeekV1: resolveWorkoutSessionWeekV1,
    selectWorkoutProgramV1: selectWorkoutProgramV1
  };
}

// ── src/DeloadEngine.gs ──
// Pure mesocycle-progression and deload-prescription helpers.
//
// This file deliberately has no Apps Script dependencies. It is loaded by the
// Apps Script V8 runtime in production and by node:test (through vm) locally,
// exactly like WorkoutCore.gs.
//
// Canonical specs:
//   prds/spec_mesocycle-progression-and-session-dashboard.md  (progression, state, lifecycle)
//   prds/prd_deload-session-generator.md                      (prescription)
//
// Sheet shapes this file reads (arrays only — never a Sheet object):
//   Mesos    [Meso, Start Date, Weeks, End Date, Status, Current Week, Notes]
//   Programs [Meso, Session, Exercise, Set, Type]
//   Log      [Date, Session, Week, Exercise, Set, Type, Weight, Reps, RIR, Notes]
//   Sessions [Date, Session, Week, Energy, Notes, Status, Deload, Meso]

const DELOAD_ENGINE_VERSION = 1;

const DELOAD_SET_RETENTION = 0.5;   // working sets kept, rounded up
const DELOAD_LOAD_FACTOR = 0.9;     // baseline load multiplier
const DELOAD_TARGET_RIR = 4;
const DELOAD_REP_CAP = 15;

const DELOAD_COVERAGE_TYPES = ['W', 'SKIP', 'PENDING'];
const DELOAD_EXCLUDED_SOURCE_TYPES = ['WU', 'D', 'RP', 'PENDING', 'SKIP'];

const DELOAD_MESSAGES = {
  ASSISTED: "Targets unchanged — assistance can't be reduced automatically. Add more assistance if you want it easier.",
  NO_LOAD: 'Weight unchanged — no load to reduce here. Your deload comes from the halved sets.',
  NO_HISTORY: 'No history for this exercise yet. Enter a weight you could stop 4 reps short on.'
};

// ── Primitives ───────────────────────────────────────────────────────────────

// `instanceof Date` is per-realm. Apps Script has one realm, but the local test
// harness loads these files into a vm context, so a Date built outside it would
// fail the check and hide exactly the bug this guards against.
function _deloadIsDate(value) {
  return Object.prototype.toString.call(value) === '[object Date]' && !isNaN(value.getTime());
}

function _deloadString(value) {
  if (value === null || value === undefined) return '';
  return String(value).trim();
}

function _deloadUpper(value) {
  return _deloadString(value).toUpperCase();
}

// A blank cell, an empty string and a non-numeric string are all "no number".
// Zero is a real value and must survive.
function _deloadNumber(value) {
  if (value === null || value === undefined || value === '') return null;
  if (typeof value === 'number') return isFinite(value) ? value : null;
  const text = _deloadString(value);
  if (!text) return null;
  const parsed = Number(text);
  return isFinite(parsed) ? parsed : null;
}

const _DELOAD_MONTHS = {
  jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
  jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
};

// Accepts a Date, an ISO 'yyyy-mm-dd', or the Sheet's display format
// ('Sun 7 Sep 2025'). Returns 'yyyy-mm-dd' or ''. Anything else is not a date.
function _deloadYmd(value) {
  if (value === null || value === undefined || value === '') return '';
  if (_deloadIsDate(value)) {
    const month = String(value.getMonth() + 1).padStart(2, '0');
    const day = String(value.getDate()).padStart(2, '0');
    return value.getFullYear() + '-' + month + '-' + day;
  }
  const text = _deloadString(value);
  const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
  if (iso) return text;
  const display = /^(?:[A-Za-z]{3},?\s+)?(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/.exec(text);
  if (display) {
    const month = _DELOAD_MONTHS[display[2].toLowerCase()];
    if (!month) return '';
    return display[3] + '-' + String(month).padStart(2, '0') + '-' + display[1].padStart(2, '0');
  }
  return '';
}

const _DELOAD_MONTH_NAMES = [
  'jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'
];

// Mesocycle names are user-typed and drift ('Jun 2026' vs 'June 2026'), so
// compare on a normalised key rather than raw text.
//
// A label like 'Jun 2026' is also a date as far as Sheets is concerned, and it
// will silently store one unless the cell is formatted as plain text. Any cell
// that slipped through reads back as a Date, so fold that back to its month-year
// label rather than failing to match it.
function _deloadMesoKey(value) {
  if (_deloadIsDate(value)) {
    return _DELOAD_MONTH_NAMES[value.getMonth()] + ' ' + value.getFullYear();
  }
  const text = _deloadString(value).toLowerCase().replace(/\s+/g, ' ');
  if (!text) return '';
  return text.replace(/\b([a-z]{3})[a-z]*\b/g, function (match, stem) {
    return _DELOAD_MONTHS[stem] ? stem : match;
  });
}

function _deloadSameMeso(a, b) {
  const left = _deloadMesoKey(a);
  return left !== '' && left === _deloadMesoKey(b);
}

// ── Mesocycle resolution ─────────────────────────────────────────────────────

// The active mesocycle is the single Mesos row with Status = Active. Dates never
// decide it (spec § Mesocycle lifecycle). `Weeks` is inclusive of the deload, so
// working weeks are 1..Weeks-1 and the deload is week `Weeks`.
//
// `Current Week` is stored, not computed. The user advances it explicitly; no
// rule infers it from dates or from logged work.
function resolveActiveMesoV1(mesoRows) {
  const rows = Array.isArray(mesoRows) ? mesoRows : [];
  const active = [];
  rows.forEach(function (row, index) {
    if (!Array.isArray(row)) return;
    const name = _deloadString(row[0]);
    if (!name) return;
    if (_deloadUpper(row[4]) !== 'ACTIVE') return;
    active.push({
      name: name,
      startDate: _deloadYmd(row[1]),
      totalWeeks: _deloadNumber(row[2]),
      currentWeek: _deloadNumber(row[5]),
      rowIndex: index
    });
  });

  if (!active.length) return { status: 'none', meso: null };
  if (active.length > 1) {
    return {
      status: 'multiple',
      meso: null,
      matches: active.map(function (entry) { return entry.name; })
    };
  }

  const found = active[0];
  if (found.totalWeeks === null || found.totalWeeks < 2) {
    return {
      status: 'invalid',
      meso: found.name,
      reason: 'A mesocycle needs Weeks >= 2: one or more working weeks plus the deload week.',
      totalWeeks: found.totalWeeks
    };
  }

  // A block that has never been advanced starts at week 1.
  const currentWeek = found.currentWeek === null ? 1 : found.currentWeek;
  return {
    status: 'matched',
    meso: found.name,
    startDate: found.startDate,
    totalWeeks: found.totalWeeks,
    workingWeeks: found.totalWeeks - 1,
    deloadWeek: found.totalWeeks,
    currentWeek: currentWeek,
    currentWeekStored: found.currentWeek !== null,
    rowIndex: found.rowIndex
  };
}

// Log rows carry no mesocycle. Attribute them by start date: a row belongs to
// the active meso when it falls on or after that meso's start date and before
// the start of any later meso. This needs no End Date, which is exactly why the
// End Date formula can be retired.
function deloadMesoLogWindowV1(mesoRows, mesoName) {
  const rows = Array.isArray(mesoRows) ? mesoRows : [];
  const starts = [];
  let start = '';
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    const name = _deloadString(row[0]);
    const ymd = _deloadYmd(row[1]);
    if (!name || !ymd) return;
    starts.push(ymd);
    if (_deloadSameMeso(name, mesoName)) start = ymd;
  });
  if (!start) return null;
  let end = '';
  starts.forEach(function (ymd) {
    if (ymd <= start) return;
    if (!end || ymd < end) end = ymd;
  });
  return { startDate: start, nextStartDate: end };
}

function _deloadInWindow(ymd, window) {
  if (!ymd || !window) return false;
  if (ymd < window.startDate) return false;
  if (window.nextStartDate && ymd >= window.nextStartDate) return false;
  return true;
}

// ── Required checklist ───────────────────────────────────────────────────────

// The weekly checklist is the distinct session names in the active meso's
// Programs rows, in the order Programs lists them.
function requiredSessionsV1(programRows, mesoName) {
  const rows = Array.isArray(programRows) ? programRows : [];
  const seen = {};
  const out = [];
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (!_deloadSameMeso(row[0], mesoName)) return;
    const session = _deloadString(row[1]);
    if (!session || seen[session]) return;
    seen[session] = true;
    out.push(session);
  });
  return out;
}

function programmedExercisesV1(programRows, mesoName, session) {
  const rows = Array.isArray(programRows) ? programRows : [];
  const seen = {};
  const out = [];
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (!_deloadSameMeso(row[0], mesoName)) return;
    if (_deloadString(row[1]) !== _deloadString(session)) return;
    if (_deloadUpper(row[4]) !== 'W') return;
    const exercise = _deloadString(row[2]);
    if (!exercise || seen[exercise]) return;
    seen[exercise] = true;
    out.push(exercise);
  });
  return out;
}

// Programmed working-set count per exercise, used only as the fallback when an
// exercise has no eligible history (§8.5).
function programmedSetCountV1(programRows, mesoName, session, exercise) {
  const rows = Array.isArray(programRows) ? programRows : [];
  let count = 0;
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (!_deloadSameMeso(row[0], mesoName)) return;
    if (_deloadString(row[1]) !== _deloadString(session)) return;
    if (_deloadString(row[2]) !== _deloadString(exercise)) return;
    if (_deloadUpper(row[4]) !== 'W') return;
    count += 1;
  });
  return count;
}

// ── Session state ────────────────────────────────────────────────────────────

// Deload sessions are identified by their Sessions row, not by Log. Build the
// set of (date, session) pairs the Sessions tab marks as deload so Log rows can
// be excluded from normal-performance lookup.
function deloadSessionKeysV1(sessionRows) {
  const rows = Array.isArray(sessionRows) ? sessionRows : [];
  const keys = {};
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (!_deloadTruthy(row[6])) return;
    const ymd = _deloadYmd(row[0]);
    const session = _deloadString(row[1]);
    if (!ymd || !session) return;
    keys[ymd + '|' + session] = true;
  });
  return keys;
}

function _deloadTruthy(value) {
  if (value === true) return true;
  const text = _deloadUpper(value);
  return text === 'TRUE' || text === 'YES';
}

function _deloadIsDeloadRow(logRow, deloadKeys) {
  const ymd = _deloadYmd(logRow[0]);
  const session = _deloadString(logRow[1]);
  return !!deloadKeys[ymd + '|' + session];
}

// How much of a session's programmed work has any row this week. Advisory only:
// it drives the "all four logged — start week 13?" nudge and the "2 exercises
// left" hint. It never decides whether a session or a week is finished.
//
// Real data settled this. Amanda routinely trains 6 of 9 programmed UP
// exercises and considers the session done, and a quarter of her sessions are
// split across two dates. Partial coverage therefore means both "finished,
// dropped a few" and "coming back Thursday", and nothing in the data separates
// them. Only the user knows, so only the user says.
function sessionCoverageV1(options) {
  options = options || {};
  const session = _deloadString(options.session);
  const week = _deloadNumber(options.week);
  const window = options.window || null;
  const programmed = programmedExercisesV1(options.programRows, options.meso, session);

  const covered = {};
  let performed = 0;
  let skipRows = 0;
  (Array.isArray(options.logRows) ? options.logRows : []).forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (_deloadString(row[1]) !== session) return;
    if (_deloadNumber(row[2]) !== week) return;
    if (window && !_deloadInWindow(_deloadYmd(row[0]), window)) return;
    const type = _deloadUpper(row[5]);
    if (DELOAD_COVERAGE_TYPES.indexOf(type) < 0) return;
    const exercise = _deloadString(row[3]);
    if (programmed.indexOf(exercise) < 0) return;
    covered[exercise] = true;
    if (type === 'SKIP') skipRows += 1;
    else performed += 1;
  });

  const coveredList = programmed.filter(function (name) { return covered[name] === true; });
  return {
    programmed: programmed,
    covered: coveredList,
    missing: programmed.filter(function (name) { return covered[name] !== true; }),
    anyWork: coveredList.length > 0,
    performedAny: performed > 0,
    allSkipped: coveredList.length > 0 && performed === 0 && skipRows > 0
  };
}

// Terminal state is read from Sessions.Status, never inferred. A split session
// writes more than one dated row for the same meso + session + week; any one of
// them carrying a terminal Status resolves the session.
function _deloadTerminalStatus(sessionRows, meso, session, week) {
  const rows = Array.isArray(sessionRows) ? sessionRows : [];
  let found = '';
  rows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (_deloadString(row[1]) !== _deloadString(session)) return;
    if (_deloadNumber(row[2]) !== _deloadNumber(week)) return;
    // Pass the raw cell: stringifying a Date here would destroy the very thing
    // _deloadMesoKey needs to fold a date-typed label back to its month-year.
    const rowMeso = row[7];
    const hasMeso = _deloadIsDate(rowMeso) || _deloadString(rowMeso) !== '';
    if (hasMeso && !_deloadSameMeso(rowMeso, meso)) return;
    const status = _deloadUpper(row[5]);
    if (status === 'COMPLETED') found = 'completed';
    else if (status === 'SKIPPED' && found !== 'completed') found = 'skipped';
  });
  return found;
}

function resolveSessionStateV1(options) {
  options = options || {};
  const session = _deloadString(options.session);
  const week = _deloadNumber(options.week);
  const coverage = sessionCoverageV1(options);
  const terminal = _deloadTerminalStatus(options.sessionRows, options.meso, session, week);
  const activeDraft = options.activeDraft || null;
  const draftMatches = activeDraft
    && _deloadString(activeDraft.session) === session
    && _deloadNumber(activeDraft.week) === week;

  let state;
  if (terminal) {
    state = terminal;
  } else if (draftMatches) {
    state = 'in_progress';
  } else if (coverage.anyWork) {
    // Work is logged but nothing marked it finished. True for legacy rows
    // written before Sessions.Status existed, and for a split session between
    // saves. Both are honestly "in progress" until the user says otherwise.
    state = 'in_progress';
  } else {
    state = 'not_started';
  }

  return {
    session: session,
    week: week,
    state: state,
    statusSource: terminal ? 'sessions-status' : (draftMatches ? 'draft' : (coverage.anyWork ? 'legacy-log' : 'absence')),
    programmed: coverage.programmed,
    covered: coverage.covered,
    missing: coverage.missing
  };
}

function _deloadIsTerminal(state) {
  return state === 'completed' || state === 'skipped';
}

// ── The week view ────────────────────────────────────────────────────────────

// The current week is stored in Mesos, not computed. This function only
// describes the stored week: which sessions are resolved, whether it is the
// deload, and what the advance control should offer.
function resolveWeekViewV1(options) {
  options = options || {};
  const meso = options.meso;
  const week = _deloadNumber(options.currentWeek);
  const totalWeeks = _deloadNumber(options.totalWeeks);
  const names = requiredSessionsV1(options.programRows, meso);

  if (!names.length) {
    return { status: 'no_program', meso: meso, week: week, sessions: [] };
  }
  if (week === null || week < 1 || totalWeeks === null || week > totalWeeks) {
    return { status: 'invalid_week', meso: meso, week: week, totalWeeks: totalWeeks, sessions: [] };
  }

  const sessions = names.map(function (session) {
    return resolveSessionStateV1({
      programRows: options.programRows,
      logRows: options.logRows,
      sessionRows: options.sessionRows,
      meso: meso,
      session: session,
      week: week,
      window: options.window,
      activeDraft: options.activeDraft
    });
  });

  const resolved = sessions.filter(function (entry) { return _deloadIsTerminal(entry.state); });
  const isDeload = week === totalWeeks;
  const allResolved = resolved.length === sessions.length;

  return {
    status: isDeload ? 'deload' : 'working',
    meso: meso,
    week: week,
    totalWeeks: totalWeeks,
    isDeload: isDeload,
    sessions: sessions,
    resolvedCount: resolved.length,
    requiredCount: sessions.length,
    allResolved: allResolved,
    advance: _deloadAdvanceOffer(week, totalWeeks, sessions, allResolved)
  };
}

// What the advance control offers. The user may always advance — they know
// whether the week is done better than the sheet does — but advancing with
// outstanding sessions asks first, so a mis-tap cannot silently skip a week.
function _deloadAdvanceOffer(week, totalWeeks, sessions, allResolved) {
  const outstanding = sessions
    .filter(function (entry) { return !_deloadIsTerminal(entry.state); })
    .map(function (entry) { return entry.session; });

  if (week < totalWeeks) {
    const next = week + 1;
    return {
      kind: 'week',
      target: next,
      opensDeload: next === totalWeeks,
      label: next === totalWeeks ? 'Start deload' : 'Start week ' + next,
      suggested: allResolved,
      confirmRequired: outstanding.length > 0,
      outstanding: outstanding
    };
  }
  return {
    kind: 'close',
    target: null,
    opensDeload: false,
    label: 'Close meso',
    suggested: allResolved,
    confirmRequired: outstanding.length > 0,
    outstanding: outstanding
  };
}

// Apply the advance action. Pure: returns the writes the caller should make.
function resolveWeekAdvanceV1(options) {
  options = options || {};
  const view = options.weekView || {};
  const confirmed = options.confirmed === true;

  if (view.status !== 'working' && view.status !== 'deload') {
    return { ok: false, reason: 'no_week', writes: null };
  }
  const offer = view.advance || {};
  if (offer.confirmRequired && !confirmed) {
    return { ok: false, reason: 'confirm_required', outstanding: offer.outstanding, writes: null };
  }
  if (offer.kind === 'week') {
    return {
      ok: true,
      reason: offer.opensDeload ? 'deload_opened' : 'week_advanced',
      writes: { currentWeek: offer.target }
    };
  }
  return { ok: true, reason: 'ready_to_close', writes: null, close: true };
}

// ── Mesocycle closure ────────────────────────────────────────────────────────

// Closure stamps End Date and Status once, when the user advances past the
// deload week. Replaying an interrupted closure must observe Closed and write
// nothing, so the decision is a pure function of current state.
function resolveMesoClosureV1(options) {
  options = options || {};
  const view = options.weekView || {};
  const currentStatus = _deloadUpper(options.currentStatus);
  const currentEndDate = _deloadYmd(options.currentEndDate);
  const confirmed = options.confirmed === true;

  if (currentStatus === 'CLOSED') {
    return { shouldClose: false, reason: 'already_closed', endDate: currentEndDate };
  }
  if (view.status !== 'deload') {
    return { shouldClose: false, reason: 'not_deload_week', endDate: '' };
  }
  if (!view.allResolved && !confirmed) {
    return {
      shouldClose: false,
      reason: 'deload_outstanding',
      outstanding: (view.advance && view.advance.outstanding) || [],
      endDate: ''
    };
  }

  const dates = [];
  (Array.isArray(options.logRows) ? options.logRows : []).forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (_deloadNumber(row[2]) !== _deloadNumber(view.week)) return;
    if (options.window && !_deloadInWindow(_deloadYmd(row[0]), options.window)) return;
    const ymd = _deloadYmd(row[0]);
    if (ymd) dates.push(ymd);
  });
  dates.sort();

  if (!dates.length) return { shouldClose: false, reason: 'no_deload_dates', endDate: '' };
  return { shouldClose: true, reason: 'deload_complete', endDate: dates[dates.length - 1] };
}

// ── Deload prescription ──────────────────────────────────────────────────────

// Round down to a practical increment (§8.4). Positive numeric loads only.
function roundDeloadLoadV1(weight) {
  const value = _deloadNumber(weight);
  if (value === null || value <= 0) return value;
  const step = value < 20 ? 0.5 : (value <= 60 ? 2.5 : 5);
  const rounded = Math.floor(value / step) * step;
  return Math.round(rounded * 100) / 100;
}

// The baseline is the single hardest working set: highest numeric weight, then
// highest reps, then latest set position. Numeric maximum is correct for
// assisted work too — max(-20, -30) is -20, the set with least assistance.
function selectDeloadBaselineSetV1(sets) {
  const candidates = (Array.isArray(sets) ? sets : []).filter(function (entry) {
    return entry && _deloadNumber(entry.weight) !== null;
  });
  if (!candidates.length) return null;
  return candidates.reduce(function (best, entry) {
    const bestWeight = _deloadNumber(best.weight);
    const entryWeight = _deloadNumber(entry.weight);
    if (entryWeight > bestWeight) return entry;
    if (entryWeight < bestWeight) return best;
    const bestReps = _deloadNumber(best.reps) === null ? -1 : _deloadNumber(best.reps);
    const entryReps = _deloadNumber(entry.reps) === null ? -1 : _deloadNumber(entry.reps);
    if (entryReps > bestReps) return entry;
    if (entryReps < bestReps) return best;
    return _deloadNumber(entry.set) >= _deloadNumber(best.set) ? entry : best;
  });
}

// Walk back per exercise to the most recent eligible session containing it.
// That one session supplies both the performed set count and the baseline set.
function findDeloadSourceSessionV1(options) {
  options = options || {};
  const logRows = Array.isArray(options.logRows) ? options.logRows : [];
  const session = _deloadString(options.session);
  const exercise = _deloadString(options.exercise);
  const deloadWeek = _deloadNumber(options.deloadWeek);
  const deloadKeys = options.deloadKeys || {};
  const window = options.window || null;

  const byDate = {};
  logRows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    if (_deloadString(row[1]) !== session) return;
    if (_deloadString(row[3]) !== exercise) return;
    if (_deloadUpper(row[5]) !== 'W') return;
    const week = _deloadNumber(row[2]);
    if (week === null || week >= deloadWeek) return;
    const ymd = _deloadYmd(row[0]);
    if (!ymd) return;
    if (window && !_deloadInWindow(ymd, window)) return;
    if (_deloadIsDeloadRow(row, deloadKeys)) return;
    if (!byDate[ymd]) byDate[ymd] = { date: ymd, week: week, sets: [] };
    byDate[ymd].sets.push({
      set: _deloadNumber(row[4]),
      weight: _deloadNumber(row[6]),
      reps: _deloadNumber(row[7]),
      rir: _deloadNumber(row[8])
    });
  });

  const dates = Object.keys(byDate).sort();
  if (!dates.length) return null;
  return byDate[dates[dates.length - 1]];
}

// Reads as: `Heaviest · Wk 11 · 20 kg × 6  @ 0 RIR`
// It states what the prescription came from. What it produced is already the
// prefilled value in the set grid, so repeating it here is noise.
function _deloadSourceText(source, baseline) {
  const weight = _deloadNumber(baseline.weight);
  const reps = _deloadNumber(baseline.reps);
  const rir = _deloadNumber(baseline.rir);
  let performed = weight === null ? '—' : weight + ' kg';
  if (reps !== null) performed += ' × ' + reps;
  if (rir !== null) performed += '  @ ' + rir + ' RIR';
  return 'Heaviest · Wk ' + source.week + ' · ' + performed;
}

// Transform one exercise into its deload prescription.
function transformDeloadExerciseV1(options) {
  options = options || {};
  const exercise = _deloadString(options.exercise);
  const source = options.source || null;
  const programmedSets = _deloadNumber(options.programmedSets) || 0;

  if (!source || !source.sets.length) {
    const fallbackSets = Math.max(1, Math.ceil(programmedSets * DELOAD_SET_RETENTION) || 1);
    return {
      exercise: exercise,
      sets: _deloadBuildSets(fallbackSets, null, null),
      sourceText: '',
      message: DELOAD_MESSAGES.NO_HISTORY,
      flag: 'NO_ELIGIBLE_HISTORY'
    };
  }

  const baseline = selectDeloadBaselineSetV1(source.sets);
  const performedSets = source.sets.length;
  const keptSets = Math.max(1, Math.ceil(performedSets * DELOAD_SET_RETENTION));

  if (!baseline) {
    return {
      exercise: exercise,
      sets: _deloadBuildSets(keptSets, null, null),
      sourceText: '',
      message: DELOAD_MESSAGES.NO_HISTORY,
      flag: 'NO_ELIGIBLE_HISTORY'
    };
  }

  const baseWeight = _deloadNumber(baseline.weight);
  const reps = baseline.reps === null ? null : Math.min(baseline.reps, DELOAD_REP_CAP);

  let prescribedWeight = baseWeight;
  let message = '';
  let flag = '';
  if (baseWeight === null) {
    message = DELOAD_MESSAGES.NO_HISTORY;
    flag = 'NO_ELIGIBLE_HISTORY';
  } else if (baseWeight < 0) {
    // Assistance. Applying x0.90 would reduce the assistance and make the set
    // harder, so the source value is kept unchanged.
    message = DELOAD_MESSAGES.ASSISTED;
    flag = 'ASSISTED';
  } else if (baseWeight === 0) {
    message = DELOAD_MESSAGES.NO_LOAD;
    flag = 'NO_LOAD';
  } else {
    prescribedWeight = roundDeloadLoadV1(baseWeight * DELOAD_LOAD_FACTOR);
  }

  return {
    exercise: exercise,
    sets: _deloadBuildSets(keptSets, prescribedWeight, reps),
    sourceText: _deloadSourceText(source, baseline),
    message: message,
    flag: flag,
    source: { date: source.date, week: source.week, performedSets: performedSets }
  };
}

function _deloadBuildSets(count, weight, reps) {
  const out = [];
  for (let index = 1; index <= count; index += 1) {
    out.push({ set: index, type: 'W', weight: weight, reps: reps, rir: DELOAD_TARGET_RIR });
  }
  return out;
}

// Generate the full deload prescription for one session.
function generateDeloadSessionV1(options) {
  options = options || {};
  const meso = options.meso;
  const session = _deloadString(options.session);
  const deloadWeek = _deloadNumber(options.deloadWeek);
  const deloadKeys = deloadSessionKeysV1(options.sessionRows);
  const exercises = programmedExercisesV1(options.programRows, meso, session);

  const generated = exercises.map(function (exercise) {
    const source = findDeloadSourceSessionV1({
      logRows: options.logRows,
      session: session,
      exercise: exercise,
      deloadWeek: deloadWeek,
      deloadKeys: deloadKeys,
      window: options.window
    });
    return transformDeloadExerciseV1({
      exercise: exercise,
      source: source,
      programmedSets: programmedSetCountV1(options.programRows, meso, session, exercise)
    });
  });

  return {
    meso: meso,
    session: session,
    week: deloadWeek,
    deload: true,
    banner: 'DELOAD · ' + session + ' · Week ' + deloadWeek,
    prescription: 'Sets halved · load −10%',
    exercises: generated
  };
}

// Export only in the local Node harness. `module` is absent in Apps Script.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    DELOAD_ENGINE_VERSION: DELOAD_ENGINE_VERSION,
    DELOAD_MESSAGES: DELOAD_MESSAGES,
    DELOAD_TARGET_RIR: DELOAD_TARGET_RIR,
    DELOAD_REP_CAP: DELOAD_REP_CAP,
    resolveActiveMesoV1: resolveActiveMesoV1,
    deloadMesoLogWindowV1: deloadMesoLogWindowV1,
    requiredSessionsV1: requiredSessionsV1,
    programmedExercisesV1: programmedExercisesV1,
    programmedSetCountV1: programmedSetCountV1,
    deloadSessionKeysV1: deloadSessionKeysV1,
    sessionCoverageV1: sessionCoverageV1,
    resolveSessionStateV1: resolveSessionStateV1,
    resolveWeekViewV1: resolveWeekViewV1,
    resolveWeekAdvanceV1: resolveWeekAdvanceV1,
    resolveMesoClosureV1: resolveMesoClosureV1,
    roundDeloadLoadV1: roundDeloadLoadV1,
    selectDeloadBaselineSetV1: selectDeloadBaselineSetV1,
    findDeloadSourceSessionV1: findDeloadSourceSessionV1,
    transformDeloadExerciseV1: transformDeloadExerciseV1,
    generateDeloadSessionV1: generateDeloadSessionV1
  };
}

// ── src/SessionsMigration.gs ──
// Additive Sessions migration planner: Status, Deload and Meso.
//
// Pure planning only. This file computes what the migration would write and
// never touches a Sheet, so the plan can be rehearsed against a copy of the real
// data and reviewed before anything is applied.
//
// Canonical spec: prds/spec_mesocycle-progression-and-session-dashboard.md
//                 § Durable state, § Migration hazards
//
// Current schema  A..E  [Date, Session, Week, Energy, Notes]
// Target schema   A..H  [Date, Session, Week, Energy, Notes, Status, Deload, Meso]
//
// Columns A-E keep their position and content. `_webEnsureSessionsSheet`
// validates only the first five headers, and `_webComparableSessionRow` builds
// its conflict fingerprint from only the first five cells, so appending F-H
// leaves both intact. The writer must be extended to cover F-H before it starts
// depending on them; until then they are written by this migration alone.

const SESSIONS_MIGRATION_VERSION = 1;

const SESSIONS_CURRENT_HEADERS = ['Date', 'Session', 'Week', 'Energy', 'Notes'];
const SESSIONS_TARGET_HEADERS = ['Date', 'Session', 'Week', 'Energy', 'Notes', 'Status', 'Deload', 'Meso'];

function _migrationString(value) {
  if (value === null || value === undefined) return '';
  return String(value).trim();
}

function _migrationNormalizedHeader(value) {
  return _migrationString(value).toLowerCase();
}

// Verify the tab is the shape this migration expects before planning anything.
function verifySessionsSchemaV1(headerRow) {
  const headers = (Array.isArray(headerRow) ? headerRow : []).map(_migrationNormalizedHeader);
  const mismatched = [];
  SESSIONS_CURRENT_HEADERS.forEach(function (expected, index) {
    if (headers[index] !== expected.toLowerCase()) {
      mismatched.push({ column: index + 1, expected: expected, actual: headers[index] || '' });
    }
  });
  const alreadyMigrated = SESSIONS_TARGET_HEADERS.slice(5).every(function (expected, offset) {
    return headers[5 + offset] === expected.toLowerCase();
  });
  return {
    ok: mismatched.length === 0,
    alreadyMigrated: mismatched.length === 0 && alreadyMigrated,
    mismatched: mismatched
  };
}

// Plan the migration. Returns the header change, per-row updates, the rows that
// must be inserted because no Sessions row was ever written, and warnings for
// anything a human should look at before applying.
//
// Requires the deload engine to be loaded: Apps Script shares one global scope,
// and the local harness injects it.
function planSessionsMigrationV1(options) {
  options = options || {};
  const sessionRows = Array.isArray(options.sessionRows) ? options.sessionRows : [];
  const logRows = Array.isArray(options.logRows) ? options.logRows : [];
  const programRows = Array.isArray(options.programRows) ? options.programRows : [];
  const mesoRows = Array.isArray(options.mesoRows) ? options.mesoRows : [];

  const mesos = mesoRows
    .filter(function (row) { return Array.isArray(row) && _migrationString(row[0]); })
    .map(function (row) {
      return {
        name: _migrationString(row[0]),
        totalWeeks: Number(row[2]),
        window: deloadMesoLogWindowV1(mesoRows, _migrationString(row[0]))
      };
    })
    .filter(function (entry) { return entry.window; });

  function mesoForDate(ymd) {
    if (!ymd) return null;
    for (let index = 0; index < mesos.length; index += 1) {
      const window = mesos[index].window;
      if (ymd < window.startDate) continue;
      if (window.nextStartDate && ymd >= window.nextStartDate) continue;
      return mesos[index];
    }
    return null;
  }

  const warnings = [];

  // 1. Every (meso, session, week) that Log shows as terminal, and the dates it
  //    was trained on. A split session contributes more than one date.
  const groups = {};
  logRows.forEach(function (row) {
    if (!Array.isArray(row)) return;
    const ymd = deloadYmdForMigrationV1(row[0]);
    const session = _migrationString(row[1]);
    const week = Number(row[2]);
    if (!ymd || !session || !isFinite(week)) return;
    const meso = mesoForDate(ymd);
    if (!meso) return;
    const key = meso.name + '|' + session + '|' + week;
    if (!groups[key]) {
      groups[key] = { meso: meso, session: session, week: week, dates: {} };
    }
    groups[key].dates[ymd] = true;
  });

  const terminalByDateSession = {};
  Object.keys(groups).forEach(function (key) {
    const group = groups[key];
    // Historical Status is inferred from Log, because Sessions.Status is what
    // this migration is creating — reading it here would be circular.
    //
    // The rule is "any real work means the session happened", not full coverage.
    // Amanda routinely trains 6 of 9 programmed exercises and considers the
    // session done, so requiring every exercise would mark most of her history
    // unfinished. Going forward the user marks completion explicitly; this is a
    // one-time reconstruction of what already happened.
    const coverage = sessionCoverageV1({
      programRows: programRows,
      logRows: logRows,
      meso: group.meso.name,
      session: group.session,
      week: group.week,
      window: group.meso.window
    });
    if (!coverage.anyWork) {
      warnings.push({
        kind: 'no_programmed_work',
        meso: group.meso.name,
        session: group.session,
        week: group.week,
        missing: coverage.missing,
        detail: 'Log has no row matching a programmed exercise, so no Status is written.'
      });
      return;
    }
    const status = coverage.allSkipped ? 'Skipped' : 'Completed';
    if (coverage.missing.length) {
      warnings.push({
        kind: 'partial_coverage',
        meso: group.meso.name,
        session: group.session,
        week: group.week,
        missing: coverage.missing,
        detail: 'Marked ' + status + ' from logged work; these programmed exercises have no row.'
      });
    }
    Object.keys(group.dates).forEach(function (ymd) {
      terminalByDateSession[ymd + '|' + group.session] = {
        status: status,
        meso: group.meso.name,
        week: group.week
      };
    });
    // Historical deloads are not inferred. The rule "the deload is week Weeks"
    // is new, and stamping it onto old blocks would assert something the data
    // does not record. Flag candidates instead so they can be set by hand.
    if (isFinite(group.meso.totalWeeks) && group.week === group.meso.totalWeeks) {
      warnings.push({
        kind: 'possible_historical_deload',
        meso: group.meso.name,
        session: group.session,
        week: group.week,
